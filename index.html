<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zsoltsb.eu</title>
  <link rel="me" href="https://ditto.pub/zsoltsb.eu" />
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
  <link href="https://fonts.bunny.net/css?family=ibm-plex-mono:400,500,600,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
      --accent: #8b5cf6; --accent2: #a78bfa; --text: #e8e8e8;
      --muted: #888; --gold: #f59e0b; --green: #34d399;
      --font: 'IBM Plex Mono', 'Courier New', monospace;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 40px 16px 80px;
    }
    .card {
      width: 100%; max-width: 600px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    }
    .banner {
      height: 160px; position: relative;
      background: linear-gradient(135deg,#1e1040 0%,#2d1b69 50%,#1a0f3d 100%);
      background-size: cover; background-position: center;
    }
    .banner-tick { position: absolute; bottom: 8px; right: 10px; }
    .avatar-wrap { position: absolute; bottom: -48px; left: 24px; }
    .avatar-img, .avatar-fb {
      width: 96px; height: 96px; border-radius: 50%;
      border: 4px solid var(--surface); display: block;
    }
    .avatar-img { object-fit: cover; }
    .avatar-fb {
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; font-size: 2.4rem; font-weight: 700; color: #fff;
    }
    .avatar-tick { position: absolute; bottom: 2px; right: 2px; }
    .body { padding: 62px 24px 28px; }
    .display-name { font-size: 1.25rem; font-weight: 700; }
    .pill-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(139,92,246,.10); border: 1px solid rgba(139,92,246,.28);
      border-radius: 20px; padding: 6px 14px; font-size: .78rem;
      color: var(--accent2); text-decoration: none; font-family: inherit;
      line-height: 1; transition: background .18s, border-color .18s; white-space: nowrap;
    }
    .pill:hover { background: rgba(139,92,246,.22); border-color: rgba(139,92,246,.55); }
    .dropdown { position: relative; margin-left: auto; flex-shrink: 0; }
    .dropdown-btn {
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 20px; padding: 6px 12px; font-size: .75rem;
      font-family: inherit; cursor: pointer; transition: filter .15s;
      white-space: nowrap; user-select: none;
    }
    .dropdown-btn:hover { filter: brightness(1.2); }
    .dropdown-btn .chevron { font-size: .6rem; transition: transform .2s; }
    .dropdown.open .chevron { transform: rotate(180deg); }
    .dropdown-menu {
      display: none; position: absolute; right: 0; top: calc(100% + 6px);
      background: #1e1e1e; border: 1px solid var(--border); border-radius: 10px;
      min-width: 210px; z-index: 100; overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,.6);
    }
    .dropdown.open .dropdown-menu { display: block; }
    .dropdown-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; font-size: .78rem; color: var(--text);
      text-decoration: none; transition: background .12s; font-family: inherit;
    }
    .dropdown-item:hover { background: rgba(255,255,255,.06); }
    .di-icon {
      width: 20px; height: 20px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .di-icon svg { width: 18px; height: 18px; fill: currentColor; }
    .di-label { flex: 1; }
    .tick {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0; cursor: help;
    }
    .tick svg { width: 9px; height: 9px; }
    .tick.gold { background: var(--gold); }
    .tick.green { background: var(--green); }
    .tick.lg { width: 20px; height: 20px; box-shadow: 0 0 0 2px var(--surface); }
    .tick.lg svg { width: 11px; height: 11px; }
    .section-title {
      font-size: .65rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted); margin-top: 24px; margin-bottom: 10px;
    }
    .social-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .social-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 10px;
      background: transparent; border: none;
      color: var(--muted); text-decoration: none;
      transition: color .15s, transform .1s;
    }
    .social-btn:hover { color: var(--text); transform: translateY(-2px); }
    .social-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .btn-icon {
      display: inline-flex; align-items: center;
      width: 14px; height: 14px; flex-shrink: 0;
    }
    .btn-icon svg { width: 14px; height: 14px; fill: currentColor; }
    .footer-link {
      display: block; text-align: center; margin-top: 26px; padding-top: 18px;
      border-top: 1px solid var(--border); font-size: .72rem;
      color: var(--muted); text-decoration: none;
    }
    .footer-link span { color: var(--accent2); }
    .footer-link:hover span { text-decoration: underline; }
    .sk {
      background: linear-gradient(90deg,var(--border) 25%,#2e2e2e 50%,var(--border) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }
    .error { padding: 28px; color: #f87171; font-size: .875rem; text-align: center; line-height: 1.7; }
    .error code { display: block; margin-top: 8px; font-size: .68rem; color: var(--muted); word-break: break-all; }
  </style>
</head>
<body>
<div class="card">
  <div class="banner" id="banner">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar-fb sk" style="background:var(--border)"></div>
    </div>
  </div>
  <div class="body" id="body">
    <div class="sk" style="width:44%;height:22px;margin-bottom:10px"></div>
    <div class="sk" style="width:100%;height:34px;border-radius:20px;margin-bottom:8px"></div>
    <div class="sk" style="width:100%;height:34px;border-radius:20px"></div>
  </div>
</div>

<script>
void (async () => {

  // ── CONFIG ────────────────────────────────────────────────────────────────
  const DOMAIN          = 'zsoltsb.eu';
  const DITTO_URL       = 'https://ditto.pub';
  const LN_USER         = 'wallet';
  const LN_DOMAIN       = DOMAIN;
  const GRAVATAR_SLUG   = 'zsoltsb';
  const KEYTRACE_HANDLE = 'zsoltsb.eu'; // resolves to keytrace.dev/@zsoltsb.eu

  const AUTHORITY_RELAY = 'wss://relay.ditto.pub';
  const OPENVIBE_RELAYS = [
    'wss://relay.damus.io','wss://relay.nostr.band','wss://nos.lol',
    'wss://relay.primal.net','wss://nostr.wine','wss://relay.snort.social',
    'wss://purplepag.es','wss://relay.nos.social',
  ];
  const EXTRA_RELAYS = ['wss://nostr.mom','wss://relay.nostr.bg','wss://nostr.oxtr.dev'];
  const DOH_RESOLVERS = [
    n => `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(n)}&type=TXT`,
    n => `https://dns.google/resolve?name=${encodeURIComponent(n)}&type=TXT`,
  ];

  // ── SOCIAL ORDERING ───────────────────────────────────────────────────────
  // Category weights define sort order per spec:
  // 0: ATProto open social, 1: ActivityPub open social, 2: text kind-of-open (Threads),
  // 3: mixed kind-of-open (Tumblr), 4: ATProto git (future), 5: kind-of-open git (GitLab),
  // 6: bigtech git (GitHub)
  const SOCIAL_ORDER = {
    'bluesky':   0,
    'mastodon':  1,
    'pixelfed':  1,
    'threads':   2,
    'tumblr':    3,
    'gitlab':    5,
    'github':    6,
  };

  // Git fallbacks shown only if not provided by primary/secondary sources
  const GIT_FALLBACKS = [
    { shortname:'gitlab', url:'https://gitlab.com/zsoltsb',  name:'GitLab',  source:'fallback' },
    { shortname:'github', url:'https://github.com/zsoltsb', name:'GitHub',   source:'fallback' },
  ];

  // Messaging shortnames → "Drop me a line" dropdown
  const MESSAGING_KEYS = new Set([
    'whatsapp','telegram','signal','messenger','wechat','line','viber',
    'skype','discord','slack','matrix','imessage','sms','kik','snapchat',
    'kakaotalk','zalo','imo','threema','wire','session','element',
    'rocketchat','mattermost','teams','hangouts','gchat',
  ]);

  // Hardcoded Telegram (always first in messaging)
  const TELEGRAM_ENTRY = { shortname:'telegram', url:'https://t.me/zsoltsb', name:'Telegram' };

  // Friendly payment labels
  const PAYMENT_LABELS = {
    'paypal':'PayPal','paypalme':'PayPal','venmo':'Venmo','cashapp':'Cash App',
    'patreon':'Patreon','kofi':'Ko-fi','ko-fi':'Ko-fi',
    'buymeacoffee':'Buy Me a Coffee','liberapay':'Liberapay',
    'opencollective':'Open Collective','bitcoin':'Bitcoin','ethereum':'Ethereum',
    'revolut':'Revolut','stripe':'Stripe','gofundme':'GoFundMe',
  };

  // Shortnames with no icon in any public icon set — omit entirely
  const NO_ICON_SHORTNAMES = new Set(['sentz']);

  const friendlyPaymentName = (key, fallback) => {
    const k = (key||'').toLowerCase().replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]/g,'');
    return PAYMENT_LABELS[k] || fallback || key;
  };

  // ── BRAND COLORS ─────────────────────────────────────────────────────────
  const BRAND_COLORS = {
    'telegram':       '#0088CC',
    'whatsapp':       '#25D366',
    'signal':         '#3A76F0',
    'discord':        '#5865F2',
    'slack':          '#4A154B',
    'skype':          '#00AFF0',
    'matrix':         '#0DBD8B',
    'paypal':         '#009CDE',
    'paypalme':       '#009CDE',
    'venmo':          '#3D95CE',
    'cashapp':        '#00D64F',
    'patreon':        '#FF424D',
    'kofi':           '#FF5E5B',
    'ko-fi':          '#FF5E5B',
    'buymeacoffee':   '#FFDD00',
    'liberapay':      '#F6C915',
    'opencollective': '#7FADF2',
    'bitcoin':        '#F7931A',
    'ethereum':       '#627EEA',
    'revolut':        '#7F84F6',
    'bluesky':        '#0085FF',
    'mastodon':       '#6364FF',
    'pixelfed':       '#FF425B',
    'tumblr':         '#35465C',
    'threads':        '#AAAAAA',
    'github':         '#6E8B9E',
    'gitlab':         '#FC6D26',
    'twitter':        '#1D9BF0',
    'x':              '#E7E7E7',
    'instagram':      '#E1306C',
    'facebook':       '#1877F2',
    'linkedin':       '#0A66C2',
    'youtube':        '#FF0000',
    'twitch':         '#9146FF',
    'spotify':        '#1DB954',
    'soundcloud':     '#FF5500',
    'reddit':         '#FF4500',
    'tiktok':         '#EE1D52',
    'pinterest':      '#E60023',
    'medium':         '#00AB6C',
    'substack':       '#FF6719',
    'strava':         '#FC4C02',
    'steam':          '#1B2838',
    'codepen':        '#47CF73',
    'npm':            '#CB3837',
    'docker':         '#2496ED',
    '_default':       '#888888',
  };

  const getBrandColor = (shortname, url) => {
    const k = (shortname||'').toLowerCase().replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]/g,'');
    if (BRAND_COLORS[k]) return BRAND_COLORS[k];
    try {
      const host = new URL(url).hostname.replace(/^www\./,'').replace(/\.[^.]+$/,'');
      const hk = host.toLowerCase().replace(/[^a-z0-9-]/g,'');
      if (BRAND_COLORS[hk]) return BRAND_COLORS[hk];
      for (const [key, val] of Object.entries(BRAND_COLORS)) {
        if (key !== '_default' && (hk.includes(key) || key.includes(hk))) return val;
      }
    } catch {}
    return BRAND_COLORS['_default'];
  };

  const hexToRgb = hex => {
    const h = hex.replace('#','');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  };
  const avgColors = hexArr => {
    if (!hexArr.length) return '#555555';
    const sum = hexArr.reduce((acc,h) => {
      const [r,g,b] = hexToRgb(h); return [acc[0]+r,acc[1]+g,acc[2]+b];
    }, [0,0,0]);
    return '#'+sum.map(v=>Math.round(v/hexArr.length).toString(16).padStart(2,'0')).join('');
  };
  const blendWithBg = (hex, alpha=0.18) => {
    const [r,g,b] = hexToRgb(hex); const bg=26;
    return `rgb(${Math.round(bg+(r-bg)*alpha)},${Math.round(bg+(g-bg)*alpha)},${Math.round(bg+(b-bg)*alpha)})`;
  };

  // ── ICONIFY SVG FETCHER ───────────────────────────────────────────────────
  const iconCache = new Map();
  const fetchIcon = async (collection, name) => {
    const key = `${collection}:${name}`;
    if (iconCache.has(key)) return iconCache.get(key);
    try {
      const r = await fetch(
        `https://api.iconify.design/${collection}/${name}.svg?width=1em&height=1em`,
        { signal: AbortSignal.timeout(5000) }
      );
      if (!r.ok) throw new Error('not found');
      const svg = (await r.text()).replace(/\s(width|height)="[^"]*"/g,'');
      // Validate it's actually SVG
      if (!svg.includes('<svg')) throw new Error('not svg');
      iconCache.set(key, svg);
      return svg;
    } catch {
      iconCache.set(key, null);
      return null;
    }
  };

  // Icon candidates: shortname → [[collection, icon], ...] tried in order
  const ICON_LOOKUP = {
    'bluesky':        [['fa6-brands','bluesky'],          ['simple-icons','bluesky']],
    'mastodon':       [['fa6-brands','mastodon'],          ['simple-icons','mastodon']],
    'pixelfed':       [['simple-icons','pixelfed']],
    'tumblr':         [['fa6-brands','tumblr'],            ['simple-icons','tumblr']],
    'threads':        [['fa6-brands','threads'],           ['simple-icons','threads']],
    'github':         [['fa6-brands','github'],            ['simple-icons','github']],
    'gitlab':         [['fa6-brands','gitlab'],            ['simple-icons','gitlab']],
    'twitter':        [['fa6-brands','x-twitter'],         ['simple-icons','x']],
    'x':              [['fa6-brands','x-twitter'],         ['simple-icons','x']],
    'instagram':      [['fa6-brands','instagram'],         ['simple-icons','instagram']],
    'facebook':       [['fa6-brands','facebook'],          ['simple-icons','facebook']],
    'linkedin':       [['fa6-brands','linkedin'],          ['simple-icons','linkedin']],
    'pinterest':      [['fa6-brands','pinterest'],         ['simple-icons','pinterest']],
    'reddit':         [['fa6-brands','reddit'],            ['simple-icons','reddit']],
    'tiktok':         [['fa6-brands','tiktok'],            ['simple-icons','tiktok']],
    'youtube':        [['fa6-brands','youtube'],           ['simple-icons','youtube']],
    'twitch':         [['fa6-brands','twitch'],            ['simple-icons','twitch']],
    'soundcloud':     [['fa6-brands','soundcloud'],        ['simple-icons','soundcloud']],
    'spotify':        [['fa6-brands','spotify'],           ['simple-icons','spotify']],
    'medium':         [['fa6-brands','medium'],            ['simple-icons','medium']],
    'substack':       [['simple-icons','substack']],
    'telegram':       [['fa6-brands','telegram'],          ['simple-icons','telegram']],
    'whatsapp':       [['fa6-brands','whatsapp'],          ['simple-icons','whatsapp']],
    'signal':         [['simple-icons','signal']],
    'discord':        [['fa6-brands','discord'],           ['simple-icons','discord']],
    'slack':          [['fa6-brands','slack'],             ['simple-icons','slack']],
    'skype':          [['fa6-brands','skype'],             ['simple-icons','skype']],
    'matrix':         [['simple-icons','matrix']],
    'paypal':         [['fa6-brands','paypal'],            ['simple-icons','paypal']],
    'paypalme':       [['fa6-brands','paypal'],            ['simple-icons','paypal']],
    'venmo':          [['simple-icons','venmo']],
    'cashapp':        [['simple-icons','cashapp']],
    'patreon':        [['fa6-brands','patreon'],           ['simple-icons','patreon']],
    'kofi':           [['simple-icons','kofi']],
    'ko-fi':          [['simple-icons','kofi']],
    'buymeacoffee':   [['simple-icons','buymeacoffee']],
    'liberapay':      [['simple-icons','liberapay']],
    'opencollective': [['fa6-brands','opencollective'],    ['simple-icons','opencollective']],
    'bitcoin':        [['fa6-brands','bitcoin'],           ['simple-icons','bitcoin']],
    'ethereum':       [['simple-icons','ethereum']],
    'revolut':        [['simple-icons','revolut']],
    'strava':         [['fa6-brands','strava'],            ['simple-icons','strava']],
    'steam':          [['fa6-brands','steam'],             ['simple-icons','steam']],
    'codepen':        [['fa6-brands','codepen'],           ['simple-icons','codepen']],
    'npm':            [['fa6-brands','npm'],               ['simple-icons','npm']],
    'docker':         [['fa6-brands','docker'],            ['simple-icons','docker']],
    '_link':          [['fa6-solid','link']],
    '_plane':         [['fa6-solid','paper-plane']],
    '_hand-dollar':   [['fa6-solid','hand-holding-dollar']],
  };

  const resolveIconKey = (shortname, url) => {
    const k = (shortname||'').toLowerCase().replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]/g,'');
    if (ICON_LOOKUP[k]) return k;
    try {
      const host = new URL(url).hostname.replace(/^www\./,'').replace(/\.[^.]+$/,'');
      const hk = host.toLowerCase().replace(/[^a-z0-9-]/g,'');
      if (ICON_LOOKUP[hk]) return hk;
      for (const key of Object.keys(ICON_LOOKUP)) {
        if (!key.startsWith('_') && (hk.includes(key) || key.includes(hk))) return key;
      }
    } catch {}
    return '_link';
  };

  const getIcon = async (shortname, url) => {
    const key = resolveIconKey(shortname, url);
    for (const [col, name] of (ICON_LOOKUP[key] || ICON_LOOKUP['_link'])) {
      const svg = await fetchIcon(col, name);
      if (svg) return svg;
    }
    return null; // no fallback SVG generation per spec
  };

  // ── HELPERS ───────────────────────────────────────────────────────────────
  const esc = s => String(s??'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const tickHtml = (level, title, large=false) => !level ? '' :
    `<span class="tick${large?' lg':''} ${esc(level)}" title="${esc(title)}">
       <svg viewBox="0 0 10 10" fill="none" stroke="#0f0f0f" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
         <polyline points="1.5,5 4,7.5 8.5,2.5"/>
       </svg>
     </span>`;

  const fetchJSON = async (url, ms=5000) => {
    const r = await fetch(url, { signal: AbortSignal.timeout(ms) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };

  const fetchJSONP = (url, cbParam='callback', ms=8000) =>
    new Promise((resolve, reject) => {
      const name = '__gjp_' + Math.random().toString(36).slice(2);
      const timer = setTimeout(() => { cleanup(); reject(new Error('jsonp-timeout')); }, ms);
      const script = document.createElement('script');
      const cleanup = () => { clearTimeout(timer); delete window[name]; script.remove(); };
      window[name] = data => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('jsonp-error')); };
      script.src = `${url}${url.includes('?')?'&':'?'}${cbParam}=${name}`;
      document.head.appendChild(script);
    });

  const dohTxtLookup = async hostname => {
    for (const resolver of DOH_RESOLVERS) {
      try {
        const data = await fetchJSON(resolver(hostname), 4000);
        const answers = (data?.Answer||[]).filter(a=>a.type===16);
        if (answers.length) return answers.map(a=>String(a.data).replace(/^"|"$/g,'').trim());
      } catch {}
    }
    return [];
  };

  const hexToNpub = hex => {
    try {
      const CS='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      const cb=(d,f,t,p)=>{let a=0,b=0,r=[];for(const v of d){a=(a<<f)|v;b+=f;while(b>=t){b-=t;r.push((a>>b)&((1<<t)-1));}}if(p&&b>0)r.push((a<<(t-b))&((1<<t)-1));return r;};
      const pm=v=>{const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const x of v){const b=c>>25;c=((c&0x1ffffff)<<5)^x;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c;};
      const he=h=>{const r=[];for(const c of h)r.push(c.charCodeAt(0)>>5);r.push(0);for(const c of h)r.push(c.charCodeAt(0)&31);return r;};
      const cs=(h,d)=>{const v=he(h).concat(d).concat([0,0,0,0,0,0]);const m=pm(v)^1;const r=[];for(let p=0;p<6;p++)r.push((m>>(5*(5-p)))&31);return r;};
      const bytes=hex.match(/.{1,2}/g).map(b=>parseInt(b,16));
      const data=cb(bytes,8,5,true);
      const hrp='npub';
      return hrp+'1'+data.concat(cs(hrp,data)).map(d=>CS[d]).join('');
    } catch { return null; }
  };

  const checkMediaHost = (() => {
    let p = null;
    const get = () => {
      if (!p) p = fetchJSON(`https://${DOMAIN}/.well-known/media-servers.json`,4000)
        .then(j=>{
          const raw=Array.isArray(j)?j:(j?.servers||j?.media_servers||[]);
          return raw.map(s=>{try{return new URL(s).hostname.toLowerCase();}catch{return null;}}).filter(Boolean);
        }).catch(()=>[]);
      return p;
    };
    return async url => {
      if (!url) return null;
      let h; try{h=new URL(url).hostname.toLowerCase();}catch{return null;}
      if (h===DOMAIN||h.endsWith(`.${DOMAIN}`)) return 'gold';
      const t = await get();
      if (t.some(x=>h===x||h.endsWith(`.${x}`))) return 'green';
      return null;
    };
  })();

  // ── RELAY SYSTEM ──────────────────────────────────────────────────────────
  const fetchFromRelay = (wsUrl, pubkey, timeoutMs=8000) =>
    new Promise((resolve, reject) => {
      let done=false; let ws;
      try{ws=new WebSocket(wsUrl);}catch(e){return reject(e);}
      const fail=r=>{if(!done){done=true;try{ws.close();}catch{}reject(new Error(r));}};
      const timer=setTimeout(()=>fail(`timeout:${wsUrl}`),timeoutMs);
      ws.onopen=()=>ws.send(JSON.stringify(['REQ','s',{kinds:[0],authors:[pubkey],limit:1}]));
      ws.onmessage=e=>{
        try{
          const m=JSON.parse(e.data);
          if(m[0]==='EVENT'&&m[1]==='s'&&m[2]?.kind===0&&!done){
            done=true;clearTimeout(timer);try{ws.close();}catch{}
            resolve({meta:JSON.parse(m[2].content),relay:wsUrl});
          }else if(m[0]==='EOSE'&&!done){fail(`eose-empty:${wsUrl}`);}
        }catch{}
      };
      ws.onerror=()=>fail(`ws-err:${wsUrl}`);
      ws.onclose=()=>{if(!done)fail(`ws-close:${wsUrl}`);};
    });

  const fetchNostrMeta = async (pubkey, relayHints) => {
    const others=[...new Set([
      ...relayHints.filter(r=>r!==AUTHORITY_RELAY),
      ...OPENVIBE_RELAYS,...EXTRA_RELAYS,
    ])].filter(r=>r!==AUTHORITY_RELAY);
    let authorityResult=null;
    const authorityPromise=fetchFromRelay(AUTHORITY_RELAY,pubkey,9000)
      .then(r=>{authorityResult=r;return r;})
      .catch(e=>{console.warn('[relay] authority:',e.message);return null;});
    await new Promise(r=>setTimeout(r,200));
    const otherPromises=others.map(url=>fetchFromRelay(url,pubkey,8000).catch(()=>null));
    await authorityPromise;
    if(authorityResult) return authorityResult;
    const fallback=await Promise.any(
      otherPromises.map(p=>p.then(r=>r?r:Promise.reject()))
    ).catch(()=>null);
    if(fallback) return fallback;
    throw new Error('All relays failed');
  };

  // ── KEYTRACE DATA FETCHER ─────────────────────────────────────────────────
  // Keytrace is ATProto-based. The public profile page is keytrace.dev/@{handle}
  // The developer API resolves handle → DID → PDS → dev.keytrace.* records.
  // We fetch the public profile page and parse the JSON-LD / embedded data,
  // OR use the @keytrace/claims package API endpoint.
  // Primary API: https://keytrace.dev/api/claims/{handle}  (undocumented but consistent)
  // Fallback: parse keytrace.dev/@{handle} HTML for embedded JSON
  const fetchKeytraceData = async (handle) => {
    const empty = { social:[], messaging:[], payments:[] };

    // Try the claims API endpoint first
    const apiUrls = [
      `https://keytrace.dev/api/claims/${encodeURIComponent(handle)}`,
      `https://keytrace.dev/api/profile/${encodeURIComponent(handle)}`,
    ];

    let claims = null;
    for (const url of apiUrls) {
      try {
        const data = await fetchJSON(url, 6000);
        if (data && (Array.isArray(data) || Array.isArray(data?.claims) || data?.accounts)) {
          claims = data;
          console.log('[keytrace] api ✓', url);
          break;
        }
      } catch(e) { console.warn('[keytrace] api miss:', url, e.message); }
    }

    // Parse claims into account entries
    // Keytrace claim structure: { platform, url, handle, verified }
    const parseClaimsToAccounts = (raw) => {
      const list = Array.isArray(raw) ? raw
        : Array.isArray(raw?.claims) ? raw.claims
        : Array.isArray(raw?.accounts) ? raw.accounts
        : [];
      return list
        .filter(c => c?.url || c?.profile_url)
        .map(c => {
          const url = (c.url || c.profile_url || '').trim();
          const platform = (c.platform || c.service || c.shortname || '').toLowerCase()
            .replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
          const name = c.name || c.display_name || c.platform || platform;
          return { shortname: platform, name, url, source: 'keytrace' };
        })
        .filter(a => a.url.startsWith('http') && a.shortname);
    };

    if (claims) {
      const accounts = parseClaimsToAccounts(claims);
      const social    = accounts.filter(a => !MESSAGING_KEYS.has(a.shortname));
      const messaging = accounts.filter(a =>  MESSAGING_KEYS.has(a.shortname));
      console.log(`[keytrace] social:${social.length} msg:${messaging.length}`);
      return { social, messaging, payments: [] };
    }

    console.warn('[keytrace] all attempts failed, returning empty');
    return empty;
  };

  // ── GRAVATAR DATA FETCHER ─────────────────────────────────────────────────
  const fetchGravatarData = async () => {
    const url = `https://gravatar.com/${GRAVATAR_SLUG}.json`;
    let entry = null;
    try {
      const d = await fetchJSONP(url);
      entry = d?.entry?.[0];
      if (entry) console.log('[gravatar] jsonp ✓');
    } catch(e) { console.warn('[gravatar] jsonp:', e.message); }
    if (!entry) {
      try {
        const d = await fetchJSON(url, 6000);
        entry = d?.entry?.[0];
        if (entry) console.log('[gravatar] direct ✓');
      } catch(e) { console.warn('[gravatar] direct:', e.message); }
    }
    if (!entry) return { social:[], messaging:[], payments:[] };

    const rawAccounts = (entry.accounts||[])
      .filter(a => !a.is_hidden && a.verified && (a.url||'').trim())
      .filter(a => !NO_ICON_SHORTNAMES.has((a.shortname||'').toLowerCase()))
      .map(a => ({
        shortname: (a.shortname||'').toLowerCase(),
        name:      a.name || a.shortname || '',
        url:       (a.url||'').trim(),
        source:    'gravatar',
      }));

    const social    = rawAccounts.filter(a => !MESSAGING_KEYS.has(a.shortname));
    const messaging = rawAccounts.filter(a =>  MESSAGING_KEYS.has(a.shortname));

    const paymentsObj = entry.payments || {};
    const payments = Object.entries(paymentsObj)
      .map(([key, url]) => ({
        shortname: key.toLowerCase().replace(/\s+/g,'-'),
        name:      friendlyPaymentName(key, key),
        url:       String(url),
      }))
      .filter(p => p.url.startsWith('http'))
      .filter(p => !NO_ICON_SHORTNAMES.has(p.shortname));

    console.log(`[gravatar] social:${social.length} msg:${messaging.length} pay:${payments.length}`);
    return { social, messaging, payments };
  };

  // ── MERGE SOURCES ─────────────────────────────────────────────────────────
  // Keytrace is primary for social links; Gravatar fills gaps.
  // Dedup by shortname: keytrace wins over gravatar wins over fallback.
  const mergeSocialSources = (keytrace, gravatar, fallbacks) => {
    const seen = new Map(); // shortname → entry

    // Priority 1: Keytrace
    for (const a of keytrace) {
      if (!seen.has(a.shortname)) seen.set(a.shortname, a);
    }
    // Priority 2: Gravatar (fill gaps)
    for (const a of gravatar) {
      if (!seen.has(a.shortname)) seen.set(a.shortname, a);
    }
    // Priority 3: Hardcoded fallbacks (only if not already present)
    for (const a of fallbacks) {
      if (!seen.has(a.shortname)) seen.set(a.shortname, a);
    }

    const all = [...seen.values()];

    // Sort by SOCIAL_ORDER; items not in map go after, preserving relative order
    const maxOrder = Math.max(...Object.values(SOCIAL_ORDER)) + 1;
    // Assign stable secondary index for items not in SOCIAL_ORDER
    const originalIdx = new Map(all.map((a,i) => [a.shortname, i]));
    all.sort((a,b) => {
      const oa = SOCIAL_ORDER[a.shortname] ?? (maxOrder + (originalIdx.get(a.shortname)||0));
      const ob = SOCIAL_ORDER[b.shortname] ?? (maxOrder + (originalIdx.get(b.shortname)||0));
      return oa - ob;
    });

    return all;
  };

  const mergeMessagingSources = (keytrace, gravatar) => {
    const seen = new Map();
    // Hardcoded Telegram always first
    seen.set('telegram', TELEGRAM_ENTRY);
    for (const a of keytrace) {
      if (!seen.has(a.shortname)) seen.set(a.shortname, a);
    }
    for (const a of gravatar) {
      if (!seen.has(a.shortname)) seen.set(a.shortname, a);
    }
    return [...seen.values()];
  };

  // ── MAIN ──────────────────────────────────────────────────────────────────

  // 1. Pubkey
  let pubkey='', wellKnownNostrOk=false, relayHints=[];
  try {
    const j = await fetchJSON(`https://${DOMAIN}/.well-known/nostr.json?name=_`,4000);
    const pk = j?.names?.['_']||Object.values(j?.names||{})[0]||'';
    if(pk){pubkey=pk;wellKnownNostrOk=true;relayHints=j?.relays?.[pk]||[];}
  } catch {}
  if(!pubkey){
    document.getElementById('body').innerHTML='<div class="error">⚠️ Could not resolve pubkey from NIP-05.</div>';
    return;
  }

  // 2. Parallel: Nostr meta + Keytrace + Gravatar
  const [metaResult, keytraceData, gravatarData] = await Promise.all([
    fetchNostrMeta(pubkey, relayHints).catch(e => { throw e; }),
    fetchKeytraceData(KEYTRACE_HANDLE),
    fetchGravatarData(),
  ]);

  const {meta} = metaResult;
  const npub          = hexToNpub(pubkey);
  const nip05         = meta.nip05||`_@${DOMAIN}`;
  const nip05Domain   = nip05.includes('@')?nip05.split('@')[1]:'';
  const displayHandle = nip05.startsWith('_@')?nip05.slice(2):nip05;

  // 3. Parallel verification
  const [
    dnsNostrOk, dnsLnOk, lnWellKnownOk,
    avatarMediaLevel, bannerMediaLevel,
  ] = await Promise.all([
    (async()=>{
      for(const name of[`_nostr.${DOMAIN}`,`_nip05.${DOMAIN}`,DOMAIN]){
        try{
          const txts=await dohTxtLookup(name);
          if(txts.some(t=>t.includes(pubkey)||(npub&&t.includes(npub))))return true;
        }catch{}
      }
      return false;
    })(),
    (async()=>{
      try{
        const txts=await dohTxtLookup(`_lnurlp.${LN_DOMAIN}`);
        return txts.some(t=>t.includes(LN_USER)||t.toLowerCase().includes('lnurlp')||t.toLowerCase().includes('lightning'));
      }catch{return false;}
    })(),
    (async()=>{
      try{
        const j=await fetchJSON(`https://${LN_DOMAIN}/.well-known/lnurlp/${LN_USER}`,5000);
        return j?.tag==='payRequest'&&!!j?.callback;
      }catch{return false;}
    })(),
    checkMediaHost(meta.picture||''),
    checkMediaHost(meta.banner||''),
  ]);

  // 4. Merge sources
  const allSocial = mergeSocialSources(
    keytraceData.social,
    gravatarData.social,
    GIT_FALLBACKS
  );
  const allMessaging = mergeMessagingSources(
    keytraceData.messaging,
    gravatarData.messaging
  );
  const payments = gravatarData.payments; // payments only from Gravatar

  // 5. Ticks
  let handleTickLevel='green', handleTickTitle='Verified via relay';
  if(wellKnownNostrOk&&nip05Domain===DOMAIN){
    handleTickLevel='gold';
    handleTickTitle='/.well-known/nostr.json ✓'+(dnsNostrOk?' · DNS TXT ✓':'');
  }else if(wellKnownNostrOk){
    handleTickLevel='gold';
    handleTickTitle='Verified: pubkey in /.well-known/nostr.json ✓';
  }
  let lnTickLevel=null, lnTickTitle='';
  if(lnWellKnownOk){
    lnTickLevel='gold';
    lnTickTitle='/.well-known/lnurlp ✓'+(dnsLnOk?' · DNS TXT _lnurlp ✓':'');
  }
  const avatarTickTitle = avatarMediaLevel==='gold'?`Avatar hosted on ${DOMAIN} ✓`
    :avatarMediaLevel==='green'?'Avatar on trusted media server ✓':'';
  const bannerTickTitle = bannerMediaLevel==='gold'?`Banner hosted on ${DOMAIN} ✓`
    :bannerMediaLevel==='green'?'Banner on trusted media server ✓':'';

  // 6. rel=me
  if(npub){const l=document.createElement('link');l.rel='me';l.href=`https://njump.me/${npub}`;document.head.appendChild(l);}
  for(const{url}of allSocial){const l=document.createElement('link');l.rel='me';l.href=url;document.head.appendChild(l);}

  // 7. Banner
  const bannerEl=document.getElementById('banner');
  if(meta.banner){const img=new Image();img.onload=()=>{bannerEl.style.backgroundImage=`url(${meta.banner})`;};img.src=meta.banner;}
  if(bannerMediaLevel){const bt=document.createElement('div');bt.className='banner-tick';bt.innerHTML=tickHtml(bannerMediaLevel,bannerTickTitle,true);bannerEl.appendChild(bt);}

  // 8. Avatar
  const name=meta.display_name||meta.name||DOMAIN;
  const avatarWrap=document.getElementById('avatarWrap');
  if(meta.picture){
    const img=document.createElement('img');img.className='avatar-img';img.alt=name;
    img.onerror=()=>{const fb=document.createElement('div');fb.className='avatar-fb';fb.textContent=(name||'?')[0].toUpperCase();img.replaceWith(fb);};
    img.src=meta.picture;avatarWrap.replaceChildren(img);
  }else{
    const fb=document.createElement('div');fb.className='avatar-fb';fb.textContent=(name||'?')[0].toUpperCase();avatarWrap.replaceChildren(fb);
  }
  if(avatarMediaLevel){const at=document.createElement('div');at.className='avatar-tick';at.innerHTML=tickHtml(avatarMediaLevel,avatarTickTitle,true);avatarWrap.appendChild(at);}

  // 9. Pre-fetch all icons concurrently
  const nostrUri  = npub?`nostr:${npub}`:`https://njump.me/${nip05}`;
  const lightning = `${LN_USER}@${LN_DOMAIN}`;

  const [
    iconPlaneSvg, iconHandDollarSvg,
    socialIcons, messagingIcons, paymentIcons,
  ] = await Promise.all([
    fetchIcon('fa6-solid','paper-plane'),
    fetchIcon('fa6-solid','hand-holding-dollar'),
    Promise.all(allSocial.map(a=>getIcon(a.shortname,a.url))),
    Promise.all(allMessaging.map(a=>getIcon(a.shortname,a.url))),
    Promise.all(payments.map(p=>getIcon(p.shortname,p.url))),
  ]);

  // 10. Button styles from averaged brand colors
  const msgColors   = allMessaging.map(a=>getBrandColor(a.shortname,a.url));
  const tipColors   = payments.map(p=>getBrandColor(p.shortname,p.url));
  const msgAvgColor = avgColors(msgColors);
  const tipAvgColor = avgColors(tipColors);

  const makeBtnStyle = avgHex => {
    const bg = blendWithBg(avgHex, 0.20);
    return `background:${bg};border:1px solid ${avgHex}66;color:${avgHex};`;
  };

  // 11. Build HTML
  // Social buttons: only render if icon resolved (no SVG generation)
  const buildSocialRow = () => allSocial
    .map((a,i) => socialIcons[i]
      ? `<a class="social-btn" href="${esc(a.url)}" target="_blank" rel="noopener me" title="${esc(a.name)}">${socialIcons[i]}</a>`
      : ''
    ).join('');

  const buildDropdown = (btnLabel, btnIconSvg, btnStyleStr, items, icons, colors) => {
    // Only include items where icon resolved
    const validItems = items.map((item,i)=>({item,icon:icons[i],color:colors[i]}))
      .filter(({icon})=>icon);
    if(!validItems.length) return '';
    const itemsHtml = validItems.map(({item,icon,color})=>
      `<a class="dropdown-item" href="${esc(item.url)}" target="_blank" rel="noopener">
         <span class="di-icon" style="color:${color||'#888'};">${icon}</span>
         <span class="di-label">${esc(item.name)}</span>
       </a>`
    ).join('');
    const btnIcon = btnIconSvg
      ? `<span class="btn-icon">${btnIconSvg}</span>`
      : '';
    return `<div class="dropdown">
      <button class="dropdown-btn" type="button" style="${btnStyleStr}">
        ${btnIcon}${esc(btnLabel)} <span class="chevron">▾</span>
      </button>
      <div class="dropdown-menu">${itemsHtml}</div>
    </div>`;
  };

  const msgDropdown = buildDropdown(
    'Drop me a line', iconPlaneSvg, makeBtnStyle(msgAvgColor),
    allMessaging, messagingIcons, msgColors
  );
  const tipDropdown = buildDropdown(
    'Drop me a dime', iconHandDollarSvg, makeBtnStyle(tipAvgColor),
    payments, paymentIcons, tipColors
  );

  const socialRowHtml = buildSocialRow();

  document.getElementById('body').innerHTML = `
    <div class="display-name">${esc(name)}</div>

    <div class="pill-row">
      <a class="pill" href="${esc(nostrUri)}" title="Open in your Nostr client">
        @${esc(displayHandle)} ${tickHtml(handleTickLevel,handleTickTitle)}
      </a>
      ${msgDropdown}
    </div>

    <div class="pill-row">
      <a class="pill" href="lightning:${esc(lightning)}" title="Pay via Lightning Network">
        ⚡ ${esc(lightning)} ${tickHtml(lnTickLevel,lnTickTitle)}
      </a>
      ${tipDropdown}
    </div>

    ${socialRowHtml ? `
      <div class="section-title">Follow me on</div>
      <div class="social-row">${socialRowHtml}</div>
    ` : ''}

    <a class="footer-link" href="${DITTO_URL}/${esc(DOMAIN)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

  // 12. Dropdown toggle
  document.querySelectorAll('.dropdown-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const dd=btn.closest('.dropdown');
      const wasOpen=dd.classList.contains('open');
      document.querySelectorAll('.dropdown.open').forEach(d=>d.classList.remove('open'));
      if(!wasOpen) dd.classList.add('open');
    });
  });
  document.addEventListener('click',()=>{
    document.querySelectorAll('.dropdown.open').forEach(d=>d.classList.remove('open'));
  });

})().catch(err=>{
  const b=document.getElementById('body');
  if(b) b.innerHTML=`<div class="error">⚠️ Unexpected error.<code>${String(err?.message??err)}</code></div>`;
});
</script>
</body>
</html>
