<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zsoltsb.eu</title>
  <link rel="me" href="https://ditto.pub/zsoltsb.eu" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
      --accent:  #8b5cf6; --accent-2: #a78bfa; --text: #e8e8e8;
      --muted:   #888;    --gold: #f59e0b;     --green: #34d399;
      --radius:  14px;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 40px 16px 80px;
    }
    .card {
      width: 100%; max-width: 600px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    }
    .banner {
      height: 160px;
      background: linear-gradient(135deg,#1e1040 0%,#2d1b69 50%,#1a0f3d 100%);
      background-size: cover; background-position: center; position: relative;
    }
    .banner-tick { position: absolute; bottom: 8px; right: 10px; }
    .avatar-wrap { position: absolute; bottom: -48px; left: 24px; display: inline-block; }
    .avatar-img, .avatar-fallback {
      width: 96px; height: 96px; border-radius: 50%;
      border: 4px solid var(--surface); object-fit: cover; display: block;
    }
    .avatar-fallback {
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; font-size: 2.4rem; font-weight: 700; color: #fff;
    }
    .avatar-tick { position: absolute; bottom: 2px; right: 2px; }
    .body { padding: 62px 24px 28px; }
    .display-name { font-size: 1.35rem; font-weight: 700; line-height: 1.2; color: var(--text); }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(139,92,246,0.10); border: 1px solid rgba(139,92,246,0.28);
      border-radius: 20px; padding: 6px 14px; font-size: 0.8rem;
      color: var(--accent-2); text-decoration: none; font-family: inherit;
      line-height: 1; transition: background 0.18s, border-color 0.18s;
    }
    .pill:hover { background: rgba(139,92,246,0.22); border-color: rgba(139,92,246,0.55); }
    .tick {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0; cursor: help;
    }
    .tick svg { width: 9px; height: 9px; fill: none; stroke: #0f0f0f; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tick.gold  { background: var(--gold); }
    .tick.green { background: var(--green); }
    .tick.lg    { width: 20px; height: 20px; box-shadow: 0 0 0 2px var(--surface); }
    .tick.lg svg { width: 11px; height: 11px; }

    /* ── Social section ── */
    .section-title {
      font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.09em; color: var(--muted); margin-top: 24px; margin-bottom: 12px;
    }
    .social-row { display: flex; flex-wrap: wrap; gap: 10px; }

    /* The button itself */
    .social-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
      position: relative; flex-shrink: 0; overflow: hidden;
    }
    .social-btn:hover {
      background: rgba(139,92,246,0.10); border-color: var(--accent);
      color: var(--accent-2); transform: translateY(-2px);
    }

    /* Layer 1: Font Awesome <i> */
    .social-btn .fa-layer {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; line-height: 1;
    }
    /* Layer 2: inline SVG */
    .social-btn .svg-layer {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .social-btn .svg-layer svg { width: 20px; height: 20px; fill: currentColor; }
    /* Layer 3: emoji/text fallback */
    .social-btn .emoji-layer {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; line-height: 1; font-style: normal;
    }

    /* Visibility controlled by JS-set data attribute on .social-row */
    /* Default: show SVG (always works, no external deps) */
    .social-row[data-icon-mode="fa"]    .svg-layer,
    .social-row[data-icon-mode="fa"]    .emoji-layer   { display: none !important; }
    .social-row[data-icon-mode="svg"]   .fa-layer,
    .social-row[data-icon-mode="svg"]   .emoji-layer   { display: none !important; }
    .social-row[data-icon-mode="emoji"] .fa-layer,
    .social-row[data-icon-mode="emoji"] .svg-layer     { display: none !important; }
    /* Before JS sets the attribute, show SVG by default */
    .social-row:not([data-icon-mode])   .fa-layer,
    .social-row:not([data-icon-mode])   .emoji-layer   { display: none !important; }

    .footer-link {
      display: block; text-align: center; margin-top: 26px; padding-top: 18px;
      border-top: 1px solid var(--border); font-size: 0.78rem;
      color: var(--muted); text-decoration: none;
    }
    .footer-link span { color: var(--accent-2); }
    .footer-link:hover span { text-decoration: underline; }
    .sk {
      background: linear-gradient(90deg,var(--border) 25%,#2e2e2e 50%,var(--border) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite;
      border-radius: 6px; margin-bottom: 8px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .error { padding: 28px; color: #f87171; font-size: 0.875rem; text-align: center; line-height: 1.7; }
    .error code { display: block; margin-top: 8px; font-size: 0.72rem; color: var(--muted); word-break: break-all; }
  </style>
</head>
<body>
<div class="card">
  <div class="banner" id="banner">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar-fallback sk" style="background:var(--border);"></div>
    </div>
  </div>
  <div class="body" id="body">
    <div class="sk" style="width:44%;height:22px;"></div>
    <div class="sk" style="width:62%;height:32px;margin-top:12px;border-radius:20px;display:inline-block;"></div>
    <div class="sk" style="width:52%;height:32px;border-radius:20px;display:inline-block;margin-left:8px;"></div>
  </div>
</div>

  const resolvePlatform = (serviceType, url) => {
    const key = (serviceType || '').toLowerCase().replace(/[\s_]+/g, '-');
    if (PLATFORMS[key]) return PLATFORMS[key];
    try {
      const host = new URL(url).hostname.replace(/^www\./, '');
      for (const [k, v] of Object.entries(PLATFORMS)) {
        if (k !== '_default' && host.includes(k.replace(/-/g, ''))) return v;
      }
    } catch {}
    return PLATFORMS['_default'];
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // HELPERS
  // ═══════════════════════════════════════════════════════════════════════════
  const esc = s => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const tickHtml = (level, title, large = false) => !level ? '' :
    `<span class="tick ${large?'lg ':''} ${esc(level)}" title="${esc(title)}">
       <svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>
     </span>`;

  const showError = (msg, detail) => {
    document.getElementById('body').innerHTML =
      `<div class="error">⚠️ Could not load profile.<br>${esc(msg)}${detail?`<code>${esc(detail)}</code>`:''}</div>`;
  };

  const fetchJSON = async (url, ms = 5000) => {
    const r = await fetch(url, { signal: AbortSignal.timeout(ms) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };

  // ── JSONP ──────────────────────────────────────────────────────────────────
  const fetchJSONP = (url, cbParam = 'callback', ms = 8000) =>
    new Promise((resolve, reject) => {
      const name = '__gjp_' + Math.random().toString(36).slice(2);
      const timer = setTimeout(() => { cleanup(); reject(new Error('jsonp-timeout')); }, ms);
      const script = document.createElement('script');
      const cleanup = () => { clearTimeout(timer); delete window[name]; script.remove(); };
      window[name] = data => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('jsonp-error')); };
      script.src = `${url}${url.includes('?')?'&':'?'}${cbParam}=${name}`;
      document.head.appendChild(script);
    });

  // ── CORS proxy chain ───────────────────────────────────────────────────────
  const CORS_PROXIES = [
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://thingproxy.freeboard.io/fetch/${u}`,
    u => `https://cors.sh/${u}`,
    u => `https://crossorigin.me/${u}`,
  ];

  const fetchViaProxy = async (url, ms = 7000) => {
    for (const proxy of CORS_PROXIES) {
      try {
        const r = await fetch(proxy(url), { signal: AbortSignal.timeout(ms) });
        if (r.ok) {
          const text = await r.text();
          if (text.trim().startsWith('{') || text.trim().startsWith('['))
            return JSON.parse(text);
        }
      } catch {}
    }
    throw new Error('all-proxies-failed');
  };

  // ── DNS-over-HTTPS ─────────────────────────────────────────────────────────
  const dohTxtLookup = async hostname => {
    for (const resolver of DOH_RESOLVERS) {
      try {
        const data = await fetchJSON(resolver(hostname), 4000);
        const answers = (data?.Answer || []).filter(a => a.type === 16);
        if (answers.length)
          return answers.map(a => String(a.data).replace(/^"|"$/g,'').trim());
      } catch {}
    }
    return [];
  };

  const hexToNpub = hex => {
    try {
      const CS='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      const cb=(d,f,t,p)=>{let a=0,b=0,r=[];for(const v of d){a=(a<<f)|v;b+=f;while(b>=t){b-=t;r.push((a>>b)&((1<<t)-1));}}if(p&&b>0)r.push((a<<(t-b))&((1<<t)-1));return r;};
      const pm=v=>{const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const x of v){const b=c>>25;c=((c&0x1ffffff)<<5)^x;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c;};
      const he=h=>{const r=[];for(const c of h)r.push(c.charCodeAt(0)>>5);r.push(0);for(const c of h)r.push(c.charCodeAt(0)&31);return r;};
      const cs=(h,d)=>{const v=he(h).concat(d).concat([0,0,0,0,0,0]);const m=pm(v)^1;const r=[];for(let p=0;p<6;p++)r.push((m>>(5*(5-p)))&31);return r;};
      const bytes=hex.match(/.{1,2}/g).map(b=>parseInt(b,16));
      const data=cb(bytes,8,5,true);
      const hrp='npub';
      return hrp+'1'+data.concat(cs(hrp,data)).map(d=>CS[d]).join('');
    } catch { return null; }
  };

  // ── Media host check ───────────────────────────────────────────────────────
  const checkMediaHost = (() => {
    let p = null;
    const get = () => { if(!p) p = fetchJSON(`https://${DOMAIN}/.well-known/media-servers.json`,4000).then(j=>{const raw=Array.isArray(j)?j:(j?.servers||j?.media_servers||[]);return raw.map(s=>{try{return new URL(s).hostname.toLowerCase();}catch{return null;}}).filter(Boolean);}).catch(()=>[]); return p; };
    return async url => {
      if(!url) return null;
      let h; try{h=new URL(url).hostname.toLowerCase();}catch{return null;}
      if(h===DOMAIN||h.endsWith(`.${DOMAIN}`)) return 'gold';
      const t=await get();
      if(t.some(x=>h===x||h.endsWith(`.${x}`))) return 'green';
      return null;
    };
  })();

  // ── Font Awesome loader with CDN fallback chain ────────────────────────────
  const FA_CDNS = [
    'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css',
    'https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css',
    'https://use.fontawesome.com/releases/v6.5.2/css/all.css',
    'https://unpkg.com/@fortawesome/fontawesome-free@6.5.2/css/all.min.css',
  ];

  const probeFontAwesome = () => {
    const i = document.createElement('i');
    i.className = 'fa-solid fa-check';
    i.style.cssText = 'position:absolute;visibility:hidden;left:-9999px';
    document.body.appendChild(i);
    const ff = window.getComputedStyle(i,'::before').fontFamily || '';
    document.body.removeChild(i);
    return ff.toLowerCase().includes('font awesome') || ff.toLowerCase().includes('fontawesome');
  };

  const ensureFontAwesome = () => new Promise(resolve => {
    // Already loaded?
    if (probeFontAwesome()) { resolve(true); return; }
    let idx = 0;
    const tryNext = () => {
      if (idx >= FA_CDNS.length) { resolve(false); return; }
      const link = document.createElement('link');
      link.rel = 'stylesheet'; link.crossOrigin = 'anonymous';
      link.href = FA_CDNS[idx++];
      link.onload = () => setTimeout(() => { if (probeFontAwesome()) resolve(true); else tryNext(); }, 100);
      link.onerror = tryNext;
      document.head.appendChild(link);
    };
    // Give the inline <link> in <head> a chance first
    setTimeout(() => { if (probeFontAwesome()) resolve(true); else tryNext(); }, 600);
  });

  // ═══════════════════════════════════════════════════════════════════════════
  // RELAY SYSTEM — authority-first with cross-check
  // ═══════════════════════════════════════════════════════════════════════════

  // Fetch kind:0 from a single relay, returns parsed meta or throws
  const fetchFromRelay = (wsUrl, pubkey, timeoutMs = 8000) =>
    new Promise((resolve, reject) => {
      let done = false;
      let ws;
      try { ws = new WebSocket(wsUrl); } catch(e) { return reject(e); }
      const SUB = 's';
      const fail = r => { if(!done){done=true;try{ws.close();}catch{}reject(new Error(r));} };
      const timer = setTimeout(() => fail(`timeout:${wsUrl}`), timeoutMs);
      ws.onopen = () => ws.send(JSON.stringify(['REQ',SUB,{kinds:[0],authors:[pubkey],limit:1}]));
      ws.onmessage = e => {
        try {
          const m = JSON.parse(e.data);
          if (m[0]==='EVENT' && m[1]===SUB && m[2]?.kind===0 && !done) {
            done=true; clearTimeout(timer);
            try { ws.close(); } catch {}
            resolve({ meta: JSON.parse(m[2].content), pubkey: m[2].pubkey, relay: wsUrl });
          } else if (m[0]==='EOSE' && !done) { fail(`eose-empty:${wsUrl}`); }
        } catch {}
      };
      ws.onerror = () => fail(`ws-err:${wsUrl}`);
      ws.onclose = () => { if(!done) fail(`ws-close:${wsUrl}`); };
    });

  // Deep-equality check on the fields we care about
  const metaConsistent = (authority, candidate) => {
    const fields = ['name','display_name','picture','banner','nip05','lud16','lud06','about','website'];
    return fields.every(f => (authority[f] ?? '') === (candidate[f] ?? ''));
  };

  // Main relay orchestration:
  // 1. Fetch from AUTHORITY_RELAY first (with priority timeout)
  // 2. Race all other relays simultaneously
  // 3. Cross-check every non-authority result against authority data
  // 4. Discard any relay whose data differs; log warnings
  const fetchNostrMeta = async (pubkey, relayHints) => {
    // Build ordered relay list: authority first, then hints, then openvibe, then extras
    const others = [...new Set([
      ...relayHints.filter(r => r !== AUTHORITY_RELAY),
      ...OPENVIBE_RELAYS,
      ...EXTRA_RELAYS,
    ])].filter(r => r !== AUTHORITY_RELAY);

    // Fetch authority — give it a head start but don't block others
    let authorityResult = null;
    let authorityError  = null;
    const authorityPromise = fetchFromRelay(AUTHORITY_RELAY, pubkey, 9000)
      .then(r => { authorityResult = r; return r; })
      .catch(e => { authorityError = e; return null; });

    // Fire all others simultaneously after a brief delay to let authority connect
    await new Promise(r => setTimeout(r, 200));
    const otherPromises = others.map(url =>
      fetchFromRelay(url, pubkey, 8000).catch(() => null)
    );

    // Wait for authority first (up to its timeout)
    await authorityPromise;

    if (authorityResult) {
      // Authority succeeded — cross-check all others as they arrive
      const crossCheck = async () => {
        const results = await Promise.allSettled(otherPromises);
        let consistent = 0, inconsistent = 0;
        for (const r of results) {
          if (r.status === 'fulfilled' && r.value) {
            if (metaConsistent(authorityResult.meta, r.value.meta)) {
              consistent++;
            } else {
              inconsistent++;
              console.warn(`[relay] Inconsistent data from ${r.value.relay} — discarded`);
            }
          }
        }
        console.log(`[relay] Cross-check: ${consistent} consistent, ${inconsistent} inconsistent vs authority`);
      };
      crossCheck(); // fire-and-forget, don't block render
      return authorityResult;
    }

    // Authority failed — fall back to first consistent result from others
    console.warn('[relay] Authority relay failed:', authorityError?.message);
    const fallback = await Promise.any(
      otherPromises.map(p => p.then(r => r ? Promise.resolve(r) : Promise.reject()))
    ).catch(() => null);

    if (fallback) return fallback;
    throw new Error('All relays failed including authority');
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // GRAVATAR — 5-strategy waterfall
  // ═══════════════════════════════════════════════════════════════════════════
  const normaliseAccounts = (accts = []) => accts
    .filter(a => {
      if (!a?.url && !a?.profile_url) return false;
      const t = (a.service_type || a.shortname || '').toLowerCase().replace(/[\s_]+/g,'-');
      return !MESSAGING_TYPES.has(t);
    })
    .map(a => ({
      url:         (a.url || a.profile_url || '').trim(),
      label:       a.service_label || a.display || a.shortname || '',
      serviceType: (a.service_type || a.shortname || '').toLowerCase().replace(/[\s_]+/g,'-'),
    }))
    .filter(a => a.url);

  const fetchGravatarAccounts = async () => {
    const legacyUrl = `https://gravatar.com/${GRAVATAR_SLUG}.json`;
    const v3Url     = `https://api.gravatar.com/v3/profiles/${GRAVATAR_SLUG}`;

    // 1. JSONP — bypasses CORS natively
    try {
      const d = await fetchJSONP(legacyUrl);
      const a = normaliseAccounts(d?.entry?.[0]?.accounts);
      if (a.length) { console.log('[gravatar] jsonp ✓'); return a; }
    } catch(e) { console.warn('[gravatar] jsonp:', e.message); }

    // 2. Direct fetch (works if Gravatar CDN allows origin)
    try {
      const d = await fetchJSON(legacyUrl, 5000);
      const a = normaliseAccounts(d?.entry?.[0]?.accounts);
      if (a.length) { console.log('[gravatar] direct ✓'); return a; }
    } catch(e) { console.warn('[gravatar] direct:', e.message); }

    // 3. v3 REST direct
    try {
      const d = await fetchJSON(v3Url, 6000);
      const a = normaliseAccounts(d?.verified_accounts || d?.accounts);
      if (a.length) { console.log('[gravatar] v3 direct ✓'); return a; }
    } catch(e) { console.warn('[gravatar] v3 direct:', e.message); }

    // 4. Legacy via CORS proxy chain
    try {
      const d = await fetchViaProxy(legacyUrl);
      const a = normaliseAccounts(d?.entry?.[0]?.accounts);
      if (a.length) { console.log('[gravatar] proxy ✓'); return a; }
    } catch(e) { console.warn('[gravatar] proxy:', e.message); }

    // 5. v3 via CORS proxy chain
    try {
      const d = await fetchViaProxy(v3Url);
      const a = normaliseAccounts(d?.verified_accounts || d?.accounts);
      if (a.length) { console.log('[gravatar] v3 proxy ✓'); return a; }
    } catch(e) { console.warn('[gravatar] v3 proxy:', e.message); }

    console.warn('[gravatar] all strategies failed — no social icons');
    return [];
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // ICON RENDERING — 3-layer with runtime FA probe
  // ═══════════════════════════════════════════════════════════════════════════
  // Layers rendered in DOM simultaneously; CSS hides the inactive ones.
  // JS sets data-icon-mode on .social-row after probing FA.
  // SVG is the default (always works, zero external deps).
  const buildSocialHTML = (accounts) => {
    if (!accounts.length) return '';
    const buttons = accounts.map(({ url, label, serviceType }) => {
      const p   = resolvePlatform(serviceType, url);
      const tip = label || serviceType || (() => { try { return new URL(url).hostname; } catch { return url; } })();
      return `<a class="social-btn" href="${esc(url)}" target="_blank" rel="noopener me" title="${esc(tip)}">
        <span class="fa-layer"><i class="${esc(p.fa)}"></i></span>
        <span class="svg-layer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${esc(p.svg)}"/></svg>
        </span>
        <span class="emoji-layer" aria-hidden="true">${p.emoji}</span>
      </a>`;
    }).join('');
    return `<div class="section-title">Follow me on</div>
            <div class="social-row" id="socialRow">${buttons}</div>`;
  };

  const applyIconMode = faLoaded => {
    const row = document.getElementById('socialRow');
    if (row) row.setAttribute('data-icon-mode', faLoaded ? 'fa' : 'svg');
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // MAIN
  // ═══════════════════════════════════════════════════════════════════════════

  // 1. Resolve pubkey from same-origin nostr.json
  let pubkey = '', wellKnownNostrOk = false, relayHints = [];
  try {
    const j = await fetchJSON(`https://${DOMAIN}/.well-known/nostr.json?name=_`, 4000);
    const pk = j?.names?.['_'] || Object.values(j?.names || {})[0] || '';
    if (pk) {
      pubkey = pk; wellKnownNostrOk = true;
      const hm = j?.relays?.[pk] || [];
      relayHints = Array.isArray(hm) ? hm : [];
    }
  } catch {}
  if (!pubkey) { showError('Could not resolve pubkey from NIP-05.'); return; }

  // 2. Kick off all parallel operations
  const metaPromise      = fetchNostrMeta(pubkey, relayHints);
  const gravatarPromise  = fetchGravatarAccounts();
  const faPromise        = ensureFontAwesome();

  // 3. Await Nostr meta (critical path)
  let result;
  try { result = await metaPromise; }
  catch(e) { showError('All relays failed.', e.message); return; }

  const { meta } = result;
  const npub     = hexToNpub(pubkey);
  const nip05    = meta.nip05 || `_@${DOMAIN}`;
  const nip05Domain   = nip05.includes('@') ? nip05.split('@')[1] : '';
  const displayHandle = nip05.startsWith('_@') ? nip05.slice(2) : nip05;

  // 4. All verification checks in parallel
  const [
    dnsNostrOk, dnsLnOk, lnWellKnownOk,
    avatarMediaLevel, bannerMediaLevel,
    gravatarAccounts, faLoaded,
  ] = await Promise.all([
    // DNS NIP-05
    (async () => {
      for (const name of [`_nostr.${DOMAIN}`,`_nip05.${DOMAIN}`,DOMAIN]) {
        try {
          const txts = await dohTxtLookup(name);
          if (txts.some(t => t.includes(pubkey) || (npub && t.includes(npub)))) return true;
        } catch {}
      }
      return false;
    })(),
    // DNS lightning
    (async () => {
      try {
        const txts = await dohTxtLookup(`_lnurlp.${LN_DOMAIN}`);
        return txts.some(t => t.includes(LN_USER) || t.toLowerCase().includes('lnurlp') || t.toLowerCase().includes('lightning'));
      } catch { return false; }
    })(),
    // LN well-known
    (async () => {
      try {
        const j = await fetchJSON(`https://${LN_DOMAIN}/.well-known/lnurlp/${LN_USER}`, 5000);
        return j?.tag === 'payRequest' && !!j?.callback;
      } catch { return false; }
    })(),
    checkMediaHost(meta.picture || ''),
    checkMediaHost(meta.banner  || ''),
    gravatarPromise,
    faPromise,
  ]);

  // 5. Tick levels
  let handleTickLevel = 'green', handleTickTitle = 'Verified via relay';
  if (wellKnownNostrOk && nip05Domain === DOMAIN) {
    handleTickLevel = 'gold';
    handleTickTitle = '/.well-known/nostr.json ✓' + (dnsNostrOk ? '  DNS TXT ✓' : '');
  } else if (wellKnownNostrOk) {
    handleTickLevel = 'gold';
    handleTickTitle = 'Verified: pubkey in /.well-known/nostr.json ✓';
  }

  let lnTickLevel = null, lnTickTitle = '';
  if (lnWellKnownOk) {
    lnTickLevel = 'gold';
    lnTickTitle = '/.well-known/lnurlp ✓' + (dnsLnOk ? '  DNS TXT _lnurlp ✓' : '');
  }

  const avatarTickTitle = avatarMediaLevel === 'gold' ? `Avatar on ${DOMAIN} ✓`
    : avatarMediaLevel === 'green' ? 'Avatar on trusted media server ✓' : '';
  const bannerTickTitle = bannerMediaLevel === 'gold' ? `Banner on ${DOMAIN} ✓`
    : bannerMediaLevel === 'green' ? 'Banner on trusted media server ✓' : '';

  // 6. rel=me
  if (npub) { const l=document.createElement('link');l.rel='me';l.href=`https://njump.me/${npub}`;document.head.appendChild(l); }
  for (const {url} of gravatarAccounts) { const l=document.createElement('link');l.rel='me';l.href=url;document.head.appendChild(l); }

  // 7. Banner
  const bannerEl = document.getElementById('banner');
  if (meta.banner) {
    const img = new Image();
    img.onload = () => { bannerEl.style.backgroundImage=`url(${meta.banner})`;bannerEl.style.backgroundSize='cover';bannerEl.style.backgroundPosition='center'; };
    img.src = meta.banner;
  }
  if (bannerMediaLevel) { const bt=document.createElement('div');bt.className='banner-tick';bt.innerHTML=tickHtml(bannerMediaLevel,bannerTickTitle,true);bannerEl.appendChild(bt); }

  // 8. Avatar
  const name = meta.display_name || meta.name || DOMAIN;
  const avatarWrap = document.getElementById('avatarWrap');
  const makeFallback = n => { const d=document.createElement('div');d.className='avatar-fallback';d.textContent=(n||'?')[0].toUpperCase();return d; };
  if (meta.picture) {
    const img=document.createElement('img');img.className='avatar-img';img.alt=name;
    img.onerror=()=>img.replaceWith(makeFallback(name));img.src=meta.picture;
    avatarWrap.replaceChildren(img);
  } else { avatarWrap.replaceChildren(makeFallback(name)); }
  if (avatarMediaLevel) { const at=document.createElement('div');at.className='avatar-tick';at.innerHTML=tickHtml(avatarMediaLevel,avatarTickTitle,true);avatarWrap.appendChild(at); }

  // 9. Render body
  const nostrUri  = npub ? `nostr:${npub}` : `https://njump.me/${nip05}`;
  const lightning = `${LN_USER}@${LN_DOMAIN}`;

  document.getElementById('body').innerHTML = `
    <div class="display-name">${esc(name)}</div>
    <div class="pills">
      <a class="pill" href="${esc(nostrUri)}" title="Open in your Nostr client">
        @${esc(displayHandle)} ${tickHtml(handleTickLevel, handleTickTitle)}
      </a>
      <a class="pill" href="lightning:${esc(lightning)}" title="Pay via Lightning Network">
        ⚡ ${esc(lightning)} ${tickHtml(lnTickLevel, lnTickTitle)}
      </a>
    </div>
    ${buildSocialHTML(gravatarAccounts)}
    <a class="footer-link" href="${DITTO_URL}/${esc(DOMAIN)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

  // 10. Apply icon mode now that DOM is ready
  applyIconMode(faLoaded);

})().catch(err => {
  document.getElementById('body').innerHTML =
    `<div class="error">⚠️ Unexpected error.<code>${esc ? esc(err?.message??err) : (err?.message??err)}</code></div>`;
});
</script>
</body>
</html>
