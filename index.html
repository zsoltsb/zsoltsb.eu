<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zsoltsb.eu</title>

  <!-- Static rel-me; more injected dynamically after load -->
  <link rel="me" href="https://ditto.pub/zsoltsb.eu" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #1a1a1a;
      --border:   #2a2a2a;
      --accent:   #8b5cf6;
      --accent-2: #a78bfa;
      --text:     #e8e8e8;
      --muted:    #888;
      --gold:     #f59e0b;
      --green:    #34d399;
      --radius:   14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ── Banner ── */
    .banner {
      height: 160px;
      background: linear-gradient(135deg, #1e1040 0%, #2d1b69 50%, #1a0f3d 100%);
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: absolute;
      bottom: -48px;
      left: 24px;
    }
    .avatar-img, .avatar-fallback {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: 4px solid var(--surface);
      object-fit: cover;
      display: block;
    }
    .avatar-fallback {
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; font-weight: 700; color: #fff;
    }

    /* ── Body ── */
    .body { padding: 62px 24px 28px; }

    .display-name {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
    }

    /* ── Pills ── */
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(139,92,246,0.10);
      border: 1px solid rgba(139,92,246,0.28);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--accent-2);
      text-decoration: none;
      font-family: inherit;
      line-height: 1;
      transition: background 0.18s, border-color 0.18s;
    }
    .pill:hover {
      background: rgba(139,92,246,0.22);
      border-color: rgba(139,92,246,0.55);
    }

    /* ── Verification ticks ── */
    .tick {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px; height: 15px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tick svg {
      width: 9px; height: 9px;
      fill: none;
      stroke: #0f0f0f;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tick.gold  { background: var(--gold); }
    .tick.green { background: var(--green); }

    /* ── Section title ── */
    .section-title {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      margin-top: 24px;
      margin-bottom: 10px;
    }

    /* ── Social pills row ── */
    .social-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Social links reuse .pill style but with slightly different colour */
    .social-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 0.18s, background 0.18s;
    }
    .social-pill:hover {
      border-color: var(--accent);
      background: rgba(139,92,246,0.06);
    }
    .social-pill i {
      font-size: 0.95rem;
      width: 14px;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
    }
    .footer-link span { color: var(--accent-2); }
    .footer-link:hover span { text-decoration: underline; }

    /* ── Skeleton ── */
    .sk {
      background: linear-gradient(90deg, var(--border) 25%, #2e2e2e 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .error {
      padding: 28px; color: #f87171;
      font-size: 0.875rem; text-align: center; line-height: 1.7;
    }
    .error code {
      display: block; margin-top: 8px;
      font-size: 0.72rem; color: var(--muted); word-break: break-all;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="banner" id="banner">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar-fallback sk" style="background:var(--border);"></div>
    </div>
  </div>
  <div class="body" id="body">
    <div class="sk" style="width:44%;height:22px;"></div>
    <div class="sk" style="width:62%;height:32px;margin-top:12px;border-radius:20px;display:inline-block;"></div>
    <div class="sk" style="width:52%;height:32px;border-radius:20px;display:inline-block;margin-left:8px;"></div>
    <div class="sk" style="width:30%;height:11px;margin-top:24px;"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
      <div class="sk" style="width:90px;height:34px;border-radius:20px;margin:0;"></div>
      <div class="sk" style="width:110px;height:34px;border-radius:20px;margin:0;"></div>
      <div class="sk" style="width:80px;height:34px;border-radius:20px;margin:0;"></div>
    </div>
  </div>
</div>

<script>
(async () => {
  const DOMAIN        = 'zsoltsb.eu';
  const DITTO         = 'https://ditto.pub';
  const GRAVATAR_SLUG = 'zsoltsb'; // gravatar.com/zsoltsb

  const RELAYS = [
    'wss://relay.damus.io',
    'wss://relay.nostr.band',
    'wss://nos.lol',
    'wss://relay.primal.net',
    'wss://nostr.mom',
    'wss://relay.snort.social',
    'wss://ditto.pub',
  ];

  // ── Helpers ───────────────────────────────────────────────────────────────
  const esc = s => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function tickHtml(level, title) {
    if (!level) return '';
    return `<span class="tick ${esc(level)}" title="${esc(title)}">
      <svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>
    </span>`;
  }

  function showError(msg, detail) {
    document.getElementById('body').innerHTML =
      `<div class="error">⚠️ Could not load profile.<br>${esc(msg)}${detail?`<code>${esc(detail)}</code>`:''}</div>`;
  }

  async function fetchJSON(url, ms = 5000) {
    const r = await fetch(url, { signal: AbortSignal.timeout(ms) });
    if (!r.ok) throw new Error(`HTTP ${r.status} — ${url}`);
    return r.json();
  }

  // ── Minimal bech32 encoder → npub ─────────────────────────────────────────
  function hexToNpub(hex) {
    try {
      const CS = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      const cb = (d,f,t,p) => { let a=0,b=0,r=[]; for(const v of d){a=(a<<f)|v;b+=f;while(b>=t){b-=t;r.push((a>>b)&((1<<t)-1));}}if(p&&b>0)r.push((a<<(t-b))&((1<<t)-1));return r; };
      const pm = v => { const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const x of v){const b=c>>25;c=((c&0x1ffffff)<<5)^x;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c; };
      const he = h => { const r=[];for(const c of h)r.push(c.charCodeAt(0)>>5);r.push(0);for(const c of h)r.push(c.charCodeAt(0)&31);return r; };
      const cs = (h,d) => { const v=he(h).concat(d).concat([0,0,0,0,0,0]);const m=pm(v)^1;const r=[];for(let p=0;p<6;p++)r.push((m>>(5*(5-p)))&31);return r; };
      const bytes = hex.match(/.{1,2}/g).map(b=>parseInt(b,16));
      const data  = cb(bytes,8,5,true);
      const hrp   = 'npub';
      return hrp+'1'+data.concat(cs(hrp,data)).map(d=>CS[d]).join('');
    } catch { return null; }
  }

  // ── WebSocket relay query ─────────────────────────────────────────────────
  function queryRelay(url, pubkey) {
    return new Promise((resolve, reject) => {
      let done = false;
      let ws;
      try { ws = new WebSocket(url); } catch(e) { return reject(e); }
      const t = setTimeout(() => {
        if (!done) { done=true; try{ws.close();}catch{} reject(new Error(`timeout:${url}`)); }
      }, 7000);
      ws.onopen = () => ws.send(JSON.stringify(['REQ','p',{kinds:[0],authors:[pubkey],limit:1}]));
      ws.onmessage = e => {
        try {
          const m = JSON.parse(e.data);
          if (m[0]==='EVENT' && m[1]==='p' && m[2]?.kind===0 && !done) {
            done=true; clearTimeout(t); try{ws.close();}catch{}
            try { resolve({ meta: JSON.parse(m[2].content), pubkey: m[2].pubkey }); }
            catch(pe) { reject(pe); }
          } else if (m[0]==='EOSE' && !done) {
            done=true; clearTimeout(t); try{ws.close();}catch{}
            reject(new Error(`no-event:${url}`));
          }
        } catch {}
      };
      ws.onerror = () => { if(!done){done=true;clearTimeout(t);reject(new Error(`ws-err:${url}`));} };
      ws.onclose = () => { if(!done){done=true;clearTimeout(t);reject(new Error(`ws-close:${url}`));} };
    });
  }

  // ── Step 1: Resolve pubkey via NIP-05 (same-origin) ──────────────────────
  let pubkey = '';
  let nip05SelfHosted = false;
  try {
    const j = await fetchJSON(`https://${DOMAIN}/.well-known/nostr.json?name=_`, 4000);
    const pk = j?.names?.['_'] || Object.values(j?.names || {})[0] || '';
    if (pk) { pubkey = pk; nip05SelfHosted = true; }
  } catch {}

  if (!pubkey) { showError('Could not resolve pubkey from NIP-05.'); return; }

  // ── Step 2: Race relays for kind:0 ───────────────────────────────────────
  let result;
  try {
    result = await Promise.any(RELAYS.map(r => queryRelay(r, pubkey)));
  } catch(agg) {
    showError('All relays failed.', agg?.errors?.map(e=>e.message).join(' | ') ?? String(agg));
    return;
  }

  const { meta } = result;
  const npub = hexToNpub(pubkey);

  // ── Step 3: Validate handle ───────────────────────────────────────────────
  const nip05 = meta.nip05 || `_@${DOMAIN}`;
  const nip05Domain = nip05.includes('@') ? nip05.split('@')[1] : '';
  const displayHandle = nip05.startsWith('_@') ? nip05.slice(2) : nip05;

  // Golden: pubkey confirmed in our own /.well-known/nostr.json AND nip05 domain = our domain
  // Green:  NIP-05 resolves but on a third-party domain
  const handleTickLevel = (nip05SelfHosted && nip05Domain === DOMAIN) ? 'gold'
    : nip05SelfHosted ? 'green'
    : null;
  const handleTickTitle = handleTickLevel === 'gold'
    ? 'Verified via /.well-known/nostr.json on this domain'
    : 'NIP-05 identity confirmed';

  // ── Step 4: Validate lightning address ────────────────────────────────────
  const lightning = meta.lud16 || meta.lud06 || '';
  let lnTickLevel = null, lnTickTitle = '';
  if (lightning && lightning.includes('@')) {
    const [lnUser, lnDomain] = lightning.split('@');
    try {
      const lnJson = await fetchJSON(`https://${lnDomain}/.well-known/lnurlp/${lnUser}`, 5000);
      if (lnJson?.tag === 'payRequest' && lnJson?.callback) {
        // Golden if the lightning address is self-hosted on our own domain
        lnTickLevel = (lnDomain === DOMAIN) ? 'gold' : 'green';
        lnTickTitle = lnTickLevel === 'gold'
          ? 'Verified via /.well-known/lnurlp on this domain'
          : 'Lightning address resolves to a valid LNURL-pay endpoint';
      }
    } catch {}
  }

  // ── Step 5: Fetch Gravatar verified accounts ──────────────────────────────
  // Strategy: try v3 REST API (may need API key → will 401), fall back to
  // legacy /{slug}.json which is unauthenticated for public profiles.
  let gravatarAccounts = [];

  const parseV3 = data => {
    const accts = data?.verified_accounts || data?.accounts || [];
    return accts
      .filter(a => a?.url || a?.profile_url)
      .map(a => ({
        url:   (a.url || a.profile_url).trim(),
        label: a.service_label || a.service_type || '',
        type:  (a.service_type || '').toLowerCase().replace(/\s+/g, '-'),
      }));
  };

  const parseLegacy = data => {
    const accts = data?.entry?.[0]?.accounts || [];
    return accts
      .filter(a => a?.url)
      .map(a => ({
        url:   a.url.trim(),
        label: a.display || a.shortname || a.domain || '',
        type:  (a.shortname || '').toLowerCase(),
      }));
  };

  // Try v3 first (no API key — works for public profiles on some endpoints)
  try {
    const d = await fetchJSON(`https://api.gravatar.com/v3/profiles/${GRAVATAR_SLUG}`, 6000);
    gravatarAccounts = parseV3(d);
  } catch {}

  // Fall back to legacy JSON endpoint if v3 returned nothing or failed
  if (!gravatarAccounts.length) {
    try {
      const d = await fetchJSON(`https://gravatar.com/${GRAVATAR_SLUG}.json`, 6000);
      gravatarAccounts = parseLegacy(d);
    } catch {}
  }

  // ── Step 6: Per-account DNS/.well-known cross-verification ────────────────
  // For each Gravatar-verified account, attempt to confirm via the platform's
  // own webfinger or rel-me endpoint that it references back to our domain.
  // This is feasible for ActivityPub/Mastodon (webfinger) and any site
  // serving /.well-known/ with rel-me. Others get green (Gravatar-only).
  async function checkWellKnownBacklink(accountUrl) {
    try {
      const u = new URL(accountUrl);
      const host = u.hostname;
      // Mastodon/ActivityPub: webfinger lookup for the account
      // Extract username from path e.g. /@zsoltsb → zsoltsb
      const pathParts = u.pathname.replace(/^\/+/, '').replace(/^@/, '').split('/');
      const username  = pathParts[0];
      if (!username) return false;

      const wf = await fetchJSON(
        `https://${host}/.well-known/webfinger?resource=acct:${encodeURIComponent(username)}@${host}`,
        4000
      );
      // Check if webfinger links contain a rel=me or alias pointing to our domain
      const links   = wf?.links   || [];
      const aliases = wf?.aliases || [];
      const all     = [...aliases, ...links.map(l => l?.href || '')].join(' ');
      return all.includes(DOMAIN);
    } catch { return false; }
  }

  // Run all cross-checks in parallel
  const crossChecked = await Promise.all(
    gravatarAccounts.map(async acct => {
      const domainVerified = await checkWellKnownBacklink(acct.url);
      return { ...acct, domainVerified };
    })
  );

  // ── Step 7: Platform icon map ─────────────────────────────────────────────
  const PLATFORMS = [
    { key:'mastodon',   test: u => /mastodon|fosstodon|hachyderm|infosec\.exchange|social\.coop|techhub\.social|mstdn\.|social\./i.test(u), icon:'fa-brands fa-mastodon',    color:'#6364ff' },
    { key:'bluesky',    test: u => /bsky\.app|bsky\.social/i.test(u),                                                                        icon:'fa-brands fa-bluesky',     color:'#0085ff' },
    { key:'instagram',  test: u => /instagram\.com/i.test(u),                                                                                icon:'fa-brands fa-instagram',   color:'#e1306c' },
    { key:'threads',    test: u => /threads\.net/i.test(u),                                                                                  icon:'fa-brands fa-threads',     color:'#e8e8e8' },
    { key:'twitter',    test: u => /twitter\.com|x\.com/i.test(u),                                                                           icon:'fa-brands fa-x-twitter',   color:'#e8e8e8' },
    { key:'github',     test: u => /github\.com/i.test(u),                                                                                   icon:'fa-brands fa-github',      color:'#e8e8e8' },
    { key:'youtube',    test: u => /youtube\.com|youtu\.be/i.test(u),                                                                        icon:'fa-brands fa-youtube',     color:'#ff0000' },
    { key:'twitch',     test: u => /twitch\.tv/i.test(u),                                                                                    icon:'fa-brands fa-twitch',      color:'#9146ff' },
    { key:'tiktok',     test: u => /tiktok\.com/i.test(u),                                                                                   icon:'fa-brands fa-tiktok',      color:'#e8e8e8' },
    { key:'linkedin',   test: u => /linkedin\.com/i.test(u),                                                                                 icon:'fa-brands fa-linkedin',    color:'#0a66c2' },
    { key:'facebook',   test: u => /facebook\.com|fb\.com/i.test(u),                                                                         icon:'fa-brands fa-facebook',    color:'#1877f2' },
    { key:'reddit',     test: u => /reddit\.com/i.test(u),                                                                                   icon:'fa-brands fa-reddit',      color:'#ff4500' },
    { key:'telegram',   test: u => /t\.me|telegram\.me/i.test(u),                                                                            icon:'fa-brands fa-telegram',    color:'#2ca5e0' },
    { key:'discord',    test: u => /discord\.gg|discord\.com/i.test(u),                                                                      icon:'fa-brands fa-discord',     color:'#5865f2' },
    { key:'farcaster',  test: u => /warpcast\.com|farcaster\.xyz/i.test(u),                                                                  icon:'fa-solid fa-circle-nodes', color:'#8a63d2' },
    { key:'nostr',      test: u => /nostr\.|njump\.me|snort\.social|primal\.net/i.test(u),                                                   icon:'fa-solid fa-bolt',         color:'#a78bfa' },
    { key:'substack',   test: u => /substack\.com/i.test(u),                                                                                 icon:'fa-solid fa-newspaper',    color:'#ff6719' },
    { key:'medium',     test: u => /medium\.com/i.test(u),                                                                                   icon:'fa-brands fa-medium',      color:'#e8e8e8' },
    { key:'tumblr',     test: u => /tumblr\.com/i.test(u),                                                                                   icon:'fa-brands fa-tumblr',      color:'#35465c' },
    { key:'pinterest',  test: u => /pinterest\.com/i.test(u),                                                                                icon:'fa-brands fa-pinterest',   color:'#e60023' },
    { key:'spotify',    test: u => /spotify\.com/i.test(u),                                                                                  icon:'fa-brands fa-spotify',     color:'#1db954' },
    { key:'soundcloud', test: u => /soundcloud\.com/i.test(u),                                                                               icon:'fa-brands fa-soundcloud',  color:'#ff5500' },
    { key:'patreon',    test: u => /patreon\.com/i.test(u),                                                                                  icon:'fa-brands fa-patreon',     color:'#ff424d' },
    { key:'ko-fi',      test: u => /ko-fi\.com/i.test(u),                                                                                    icon:'fa-solid fa-mug-hot',      color:'#ff5e5b' },
    { key:'wordpress',  test: u => /wordpress\.com/i.test(u),                                                                                icon:'fa-brands fa-wordpress',   color:'#21759b' },
    { key:'website',    test: () => false,                                                                                                    icon:'fa-solid fa-globe',        color:'#888'    },
  ];

  function detectPlatform(url) {
    return PLATFORMS.find(p => p.test(url)) || PLATFORMS[PLATFORMS.length - 1];
  }

  // ── Step 8: Inject rel=me into <head> ─────────────────────────────────────
  for (const { url } of crossChecked) {
    const l = document.createElement('link');
    l.rel = 'me'; l.href = url;
    document.head.appendChild(l);
  }
  if (npub) {
    const l = document.createElement('link');
    l.rel = 'me'; l.href = `https://njump.me/${npub}`;
    document.head.appendChild(l);
  }

  // ── Step 9: Banner ────────────────────────────────────────────────────────
  const bannerUrl = meta.banner || '';
  if (bannerUrl) {
    const img = new Image();
    img.onload = () => {
      const b = document.getElementById('banner');
      b.style.backgroundImage    = `url(${bannerUrl})`;
      b.style.backgroundSize     = 'cover';
      b.style.backgroundPosition = 'center';
    };
    img.src = bannerUrl;
  }

  // ── Step 10: Avatar ───────────────────────────────────────────────────────
  const avatarUrl = meta.picture || '';
  const name      = meta.display_name || meta.name || DOMAIN;
  const avatarWrap = document.getElementById('avatarWrap');

  const makeFallback = n => {
    const d = document.createElement('div');
    d.className = 'avatar-fallback';
    d.textContent = (n || '?')[0].toUpperCase();
    return d;
  };
  if (avatarUrl) {
    const img = document.createElement('img');
    img.className = 'avatar-img';
    img.alt = name;
    img.onerror = () => img.replaceWith(makeFallback(name));
    img.src = avatarUrl;
    avatarWrap.replaceChildren(img);
  } else {
    avatarWrap.replaceChildren(makeFallback(name));
  }

  // ── Step 11: Social pills HTML ────────────────────────────────────────────
  const nostrUri = npub ? `nostr:${npub}` : `https://njump.me/${nip05}`;

  let socialHtml = '';
  if (crossChecked.length) {
    const pills = crossChecked.map(({ url, label, type, domainVerified }) => {
      const p = PLATFORMS.find(pl => pl.key === type) || detectPlatform(url);
      const displayLabel = label || p.key;
      const tLevel = domainVerified ? 'gold' : 'green';
      const tTitle = domainVerified
        ? 'Verified via Gravatar + DNS/.well-known backlink'
        : 'Verified via Gravatar';
      return `<a class="social-pill" href="${esc(url)}" target="_blank" rel="noopener me">
        <i class="${esc(p.icon)}" style="color:${esc(p.color)};"></i>
        ${esc(displayLabel)}
        ${tickHtml(tLevel, tTitle)}
      </a>`;
    }).join('');
    socialHtml = `<div class="section-title">Find me on</div><div class="social-row">${pills}</div>`;
  }

  // ── Step 12: Render ───────────────────────────────────────────────────────
  document.getElementById('body').innerHTML = `
    <div class="display-name">${esc(name)}</div>

    <div class="pills">
      <a class="pill" href="${esc(nostrUri)}" title="Open in your Nostr client">
        @${esc(displayHandle)}
        ${tickHtml(handleTickLevel, handleTickTitle)}
      </a>

      ${lightning ? `<a class="pill" href="lightning:${esc(lightning)}" title="Pay via Lightning Network">
        ⚡ ${esc(lightning)}
        ${tickHtml(lnTickLevel, lnTickTitle)}
      </a>` : ''}
    </div>

    ${socialHtml}

    <a class="footer-link" href="${DITTO}/${esc(DOMAIN)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

})().catch(err => {
  document.getElementById('body').innerHTML =
    `<div class="error">⚠️ Unexpected error.<code>${err?.message ?? err}</code></div>`;
});
</script>
</body>
</html>
