<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zsoltsb.eu</title>
  <link rel="me" href="https://ditto.pub/zsoltsb.eu" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #1a1a1a;
      --border:   #2a2a2a;
      --accent:   #8b5cf6;
      --accent-2: #a78bfa;
      --text:     #e8e8e8;
      --muted:    #888;
      --radius:   12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px 80px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .banner {
      height: 160px;
      background: linear-gradient(135deg, #1e1040 0%, #2d1b69 50%, #1a0f3d 100%);
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .avatar-wrap {
      position: absolute;
      bottom: -46px;
      left: 24px;
    }
    .avatar-wrap img,
    .avatar-wrap .avatar-fallback {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 3px solid var(--surface);
      object-fit: cover;
      display: block;
    }
    .avatar-fallback {
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
    }

    .body { padding: 58px 24px 28px; }

    .name { font-size: 1.3rem; font-weight: 700; line-height: 1.2; }

    .handle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .handle { font-size: 0.875rem; color: var(--muted); }
    .handle a { color: var(--muted); text-decoration: none; }
    .handle a:hover { color: var(--accent-2); }
    .favicon { width: 14px; height: 14px; border-radius: 3px; }

    .lightning {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.8rem;
      color: var(--accent-2);
      text-decoration: none;
      transition: background 0.2s;
    }
    .lightning:hover { background: rgba(139,92,246,0.25); }

    .bio {
      margin-top: 14px;
      font-size: 0.9rem;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bio a { color: var(--accent-2); text-decoration: none; }
    .bio a:hover { text-decoration: underline; }

    .stats { display: flex; gap: 20px; margin-top: 16px; }
    .stat { font-size: 0.85rem; color: var(--muted); }
    .stat strong { color: var(--text); font-weight: 600; }

    .section-title {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      margin-top: 22px;
      margin-bottom: 8px;
    }

    .addresses { display: flex; flex-direction: column; gap: 6px; }

    .address-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.83rem;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.2s;
    }
    .address-chip:hover { border-color: var(--accent); }
    .chip-icon { width: 18px; height: 18px; border-radius: 3px; object-fit: contain; flex-shrink: 0; }
    .chip-name { color: var(--muted); font-size: 0.75rem; min-width: 80px; flex-shrink: 0; }
    .chip-value { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip-verified { margin-left: auto; color: #34d399; font-size: 0.7rem; flex-shrink: 0; padding-left: 6px; }

    .ditto-link {
      display: block;
      text-align: center;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
    }
    .ditto-link span { color: var(--accent-2); }
    .ditto-link:hover span { text-decoration: underline; }

    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, #2e2e2e 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .error-msg {
      padding: 28px;
      color: #f87171;
      font-size: 0.875rem;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="banner" id="banner">
    <div class="avatar-wrap" id="avatar-wrap">
      <div class="avatar-fallback skeleton"
           style="width:92px;height:92px;border-radius:50%;background:var(--border);"></div>
    </div>
  </div>
  <div class="body" id="body">
    <div class="skeleton" style="width:42%;height:20px;"></div>
    <div class="skeleton" style="width:32%;height:13px;margin-top:8px;"></div>
    <div class="skeleton" style="width:55%;height:13px;margin-top:16px;border-radius:20px;"></div>
    <div class="skeleton" style="width:95%;height:13px;margin-top:16px;"></div>
    <div class="skeleton" style="width:80%;height:13px;margin-top:7px;"></div>
    <div class="skeleton" style="width:65%;height:13px;margin-top:7px;"></div>
  </div>
</div>

<script>
(async () => {
  const DOMAIN  = 'zsoltsb.eu';
  const DITTO   = 'https://ditto.pub';
  const RELAY   = 'wss://ditto.pub';

  const esc = s => String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function showError(msg) {
    document.getElementById('body').innerHTML =
      `<p class="error-msg">⚠️ Could not load profile.<br><small>${esc(msg)}</small></p>`;
  }

  function stripHtml(html) {
    const d = document.createElement('div');
    d.innerHTML = html;
    return d.textContent || d.innerText || '';
  }

  function bioFromText(text) {
    // linkify URLs and hashtags in plain text
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/#(\w+)/g,
        `<a href="${DITTO}/t/$1" target="_blank" rel="noopener">#$1</a>`);
  }

  function chipHostname(href) {
    try { return new URL(href).hostname.replace(/^www\./, ''); }
    catch { return ''; }
  }

  function makeFallback(n) {
    const d = document.createElement('div');
    d.className = 'avatar-fallback';
    d.style.cssText = 'width:92px;height:92px;border-radius:50%;border:3px solid var(--surface);';
    d.textContent = (n || '?')[0].toUpperCase();
    return d;
  }

  // ── Step 1: resolve pubkey via NIP-05 /.well-known/nostr.json ─────────────
  // This endpoint is on the SAME domain (zsoltsb.eu) so no CORS issue.
  // If served from a different domain during dev, fall back to hardcoded pubkey.
  let pubkey = '';
  try {
    const nip05res = await fetch(
      `https://${DOMAIN}/.well-known/nostr.json?name=_`,
      { signal: AbortSignal.timeout(5000) }
    );
    if (nip05res.ok) {
      const nip05 = await nip05res.json();
      pubkey = nip05.names?.['_'] || Object.values(nip05.names || {})[0] || '';
    }
  } catch (_) { /* will try relay lookup by NIP-05 identifier instead */ }

  // ── Step 2: fetch kind:0 via WebSocket relay (no CORS restrictions) ────────
  const profile = await new Promise((resolve, reject) => {
    const ws = new WebSocket(RELAY);
    const timeout = setTimeout(() => {
      ws.close();
      reject(new Error('Relay timeout — no response within 10 s'));
    }, 10000);

    ws.addEventListener('open', () => {
      // If we have a pubkey, filter by it; otherwise filter by NIP-05 identifier
      const filter = pubkey
        ? { kinds: [0], authors: [pubkey], limit: 1 }
        : { kinds: [0], '#d': [`${DOMAIN}`], limit: 1 };

      // Also try searching by nip05 field via Ditto's search relay support
      const req = pubkey
        ? ['REQ', 'profile', { kinds: [0], authors: [pubkey], limit: 1 }]
        : ['REQ', 'profile', { kinds: [0], search: `_@${DOMAIN}`, limit: 1 }];

      ws.send(JSON.stringify(req));
    });

    ws.addEventListener('message', e => {
      try {
        const msg = JSON.parse(e.data);
        // msg = ["EVENT", subId, event] or ["EOSE", subId]
        if (msg[0] === 'EVENT' && msg[1] === 'profile' && msg[2]?.kind === 0) {
          clearTimeout(timeout);
          ws.close();
          try {
            resolve(JSON.parse(msg[2].content));
          } catch {
            reject(new Error('Could not parse profile content JSON'));
          }
        } else if (msg[0] === 'EOSE') {
          // End of stored events — no profile found
          clearTimeout(timeout);
          ws.close();
          reject(new Error('Profile not found on relay'));
        }
      } catch (parseErr) {
        clearTimeout(timeout);
        ws.close();
        reject(parseErr);
      }
    });

    ws.addEventListener('error', () => {
      clearTimeout(timeout);
      reject(new Error('WebSocket connection failed'));
    });
  }).catch(async err => {
    // ── Fallback: try Ditto's HTTP API with no-cors (opaque) won't work for
    //    JSON, so instead try a jsonp-style approach via <script> tag — not
    //    feasible. Best last resort: try fetch with credentials omitted and
    //    hope Ditto added CORS headers since last check.
    try {
      const r = await fetch(
        `${DITTO}/api/v1/accounts/lookup?acct=${DOMAIN}`,
        { headers: { 'Accept': 'application/json' } }
      );
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const masto = await r.json();
      // Convert Mastodon format → Nostr metadata format
      return {
        name:        masto.display_name || masto.username,
        picture:     masto.avatar,
        banner:      masto.header,
        about:       stripHtml(masto.note || ''),
        nip05:       `_@${DOMAIN}`,
        lud16:       masto.lud16 || '',
        _fields:     masto.fields || [],
        _followers:  masto.followers_count,
        _following:  masto.following_count,
        _acct:       masto.acct,
      };
    } catch (fallbackErr) {
      throw new Error(`${err.message} | fallback: ${fallbackErr.message}`);
    }
  });

  if (!profile) { showError('Empty profile'); return; }

  // ── Parse ──────────────────────────────────────────────────────────────────
  const name      = profile.display_name || profile.name || DOMAIN;
  const handle    = profile._acct        || profile.nip05 || `_@${DOMAIN}`;
  const avatarUrl = profile.picture      || profile.avatar || '';
  const headerUrl = profile.banner       || profile.header || '';
  const about     = profile.about        || '';
  const lightning = profile.lud16        || profile.lud06 || '';
  const website   = profile.website      || '';

  // Extra links: from _fields (Mastodon fallback) or parse from about
  const extraFields = profile._fields
    ? profile._fields.filter(f => !/lightning|⚡|lnurl|wallet/i.test(f.name))
    : [];

  const followers = profile._followers;
  const following = profile._following;

  // ── Banner ─────────────────────────────────────────────────────────────────
  const banner = document.getElementById('banner');
  if (headerUrl) {
    const img = new Image();
    img.onload = () => {
      banner.style.backgroundImage    = `url(${headerUrl})`;
      banner.style.backgroundSize     = 'cover';
      banner.style.backgroundPosition = 'center';
    };
    img.src = headerUrl;
  }

  // ── Avatar ─────────────────────────────────────────────────────────────────
  const avatarWrap = document.getElementById('avatar-wrap');
  if (avatarUrl) {
    const img = document.createElement('img');
    img.alt = name;
    img.style.cssText = 'width:92px;height:92px;border-radius:50%;border:3px solid var(--surface);object-fit:cover;display:block;';
    img.onerror = () => img.replaceWith(makeFallback(name));
    img.src = avatarUrl;
    avatarWrap.replaceChildren(img);
  } else {
    avatarWrap.replaceChildren(makeFallback(name));
  }

  // ── Build HTML ─────────────────────────────────────────────────────────────
  const displayHandle = handle.includes('@') ? `@${handle}` : `@${handle}`;
  const profileUrl    = `${DITTO}/${handle.replace(/^_@/, '')}`;

  const lightningHtml = lightning ? `
    <a class="lightning" href="lightning:${esc(lightning)}" title="Send via Lightning Network">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
        <path d="M13 2L4.5 13.5H11L10 22L19.5 10.5H13L13 2Z"/>
      </svg>
      ${esc(lightning)}
    </a>` : '';

  const statsHtml = (followers != null || following != null) ? `
    <div class="stats">
      ${followers != null ? `<div class="stat"><strong>${Number(followers).toLocaleString()}</strong> followers</div>` : ''}
      ${following != null ? `<div class="stat"><strong>${Number(following).toLocaleString()}</strong> following</div>` : ''}
    </div>` : '';

  let addressesHtml = '';
  if (extraFields.length) {
    const chips = extraFields.map(f => {
      const rawValue = (typeof f.value === 'string'
        ? stripHtml(f.value) : String(f.value)).trim();
      const href = f.value?.match?.(/href="([^"]+)"/)?.[1]
                || (rawValue.startsWith('http') ? rawValue : null);
      const host = href ? chipHostname(href) : '';
      const fav  = host ? `${DITTO}/api/favicon/${host}` : '';
      const verified = f.verified_at
        ? '<span class="chip-verified">✓ verified</span>' : '';
      const iconHtml = fav
        ? `<img class="chip-icon" src="${esc(fav)}" alt="" onerror="this.style.display='none'" />`
        : `<span style="width:18px;flex-shrink:0;"></span>`;

      return href
        ? `<a class="address-chip" href="${esc(href)}" target="_blank" rel="noopener me">
             ${iconHtml}
             <span class="chip-name">${esc(f.name)}</span>
             <span class="chip-value">${esc(rawValue)}</span>
             ${verified}
           </a>`
        : `<div class="address-chip">
             ${iconHtml}
             <span class="chip-name">${esc(f.name)}</span>
             <span class="chip-value">${esc(rawValue)}</span>
           </div>`;
    }).join('');

    addressesHtml = `
      <div class="section-title">Also on</div>
      <div class="addresses">${chips}</div>`;
  }

  document.getElementById('body').innerHTML = `
    <div class="name">${esc(name)}</div>
    <div class="handle-row">
      <span class="handle">
        <a href="${esc(profileUrl)}" target="_blank" rel="noopener me">${esc(displayHandle)}</a>
      </span>
      <img class="favicon"
           src="${DITTO}/api/favicon/${esc(DOMAIN)}"
           alt=""
           onerror="this.style.display='none'" />
    </div>
    ${lightningHtml}
    <div class="bio">${bioFromText(about)}</div>
    ${statsHtml}
    ${addressesHtml}
    <a class="ditto-link" href="${esc(profileUrl)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

})().catch(err => {
  document.getElementById('body').innerHTML =
    `<p class="error-msg">⚠️ Could not load profile.<br><small>${err.message}</small></p>`;
});
</script>
</body>
</html>
