<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zsoltsb.eu</title>

  <link rel="me" href="https://ditto.pub/zsoltsb.eu" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #1a1a1a;
      --border:   #2a2a2a;
      --accent:   #8b5cf6;
      --accent-2: #a78bfa;
      --text:     #e8e8e8;
      --muted:    #888;
      --gold:     #f59e0b;
      --green:    #34d399;
      --radius:   14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ── Banner ── */
    .banner {
      height: 160px;
      background: linear-gradient(135deg, #1e1040 0%, #2d1b69 50%, #1a0f3d 100%);
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .banner-tick {
      position: absolute;
      bottom: 8px;
      right: 10px;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: absolute;
      bottom: -48px;
      left: 24px;
      display: inline-block;
    }
    .avatar-img, .avatar-fallback {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: 4px solid var(--surface);
      object-fit: cover;
      display: block;
    }
    .avatar-fallback {
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; font-weight: 700; color: #fff;
    }
    .avatar-tick {
      position: absolute;
      bottom: 2px;
      right: 2px;
    }

    /* ── Body ── */
    .body { padding: 62px 24px 28px; }

    .display-name {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
    }

    /* ── Pills ── */
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(139,92,246,0.10);
      border: 1px solid rgba(139,92,246,0.28);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--accent-2);
      text-decoration: none;
      font-family: inherit;
      line-height: 1;
      transition: background 0.18s, border-color 0.18s;
    }
    .pill:hover {
      background: rgba(139,92,246,0.22);
      border-color: rgba(139,92,246,0.55);
    }

    /* ── Verification ticks ── */
    .tick {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px; height: 15px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: help;
    }
    .tick svg {
      width: 9px; height: 9px;
      fill: none;
      stroke: #0f0f0f;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tick.gold  { background: var(--gold); }
    .tick.green { background: var(--green); }
    .tick.lg {
      width: 20px; height: 20px;
      box-shadow: 0 0 0 2px var(--surface);
    }
    .tick.lg svg { width: 11px; height: 11px; }

    /* ── Social section ── */
    .section-title {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .social-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Icon-only square button, comfortable tap target */
    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 1.2rem;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
      position: relative;
    }
    .social-btn:hover {
      background: rgba(139,92,246,0.10);
      border-color: var(--accent);
      color: var(--accent-2);
      transform: translateY(-2px);
    }
    .social-btn i {
      /* single colour — inherit from parent, no per-platform colour */
      line-height: 1;
    }

    /* ── Footer ── */
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
    }
    .footer-link span { color: var(--accent-2); }
    .footer-link:hover span { text-decoration: underline; }

    /* ── Skeleton ── */
    .sk {
      background: linear-gradient(90deg, var(--border) 25%, #2e2e2e 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .error {
      padding: 28px; color: #f87171;
      font-size: 0.875rem; text-align: center; line-height: 1.7;
    }
    .error code {
      display: block; margin-top: 8px;
      font-size: 0.72rem; color: var(--muted); word-break: break-all;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="banner" id="banner">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar-fallback sk" style="background:var(--border);"></div>
    </div>
  </div>
  <div class="body" id="body">
    <div class="sk" style="width:44%;height:22px;"></div>
    <div class="sk" style="width:62%;height:32px;margin-top:12px;border-radius:20px;display:inline-block;"></div>
    <div class="sk" style="width:52%;height:32px;border-radius:20px;display:inline-block;margin-left:8px;"></div>
  </div>
</div>

<script>
void (async () => {

  // ── Constants ──────────────────────────────────────────────────────────────
  const DOMAIN        = 'zsoltsb.eu';
  const DITTO         = 'https://ditto.pub';
  const LN_USER       = 'wallet';
  const LN_DOMAIN     = DOMAIN;
  const GRAVATAR_SLUG = 'zsoltsb';

  const FALLBACK_RELAYS = [
    'wss://relay.damus.io',
    'wss://relay.nostr.band',
    'wss://nos.lol',
    'wss://relay.primal.net',
    'wss://nostr.mom',
    'wss://relay.snort.social',
    'wss://ditto.pub',
  ];

  const DOH_RESOLVERS = [
    n => `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(n)}&type=TXT`,
    n => `https://dns.google/resolve?name=${encodeURIComponent(n)}&type=TXT`,
  ];

  // Messaging / IM platforms to exclude — we only want social/content platforms
  const MESSAGING_TYPES = new Set([
    'whatsapp','telegram','signal','messenger','wechat','line','viber',
    'skype','discord','slack','matrix','xmpp','imessage','sms','kik',
    'snapchat','kakaotalk','zalo','imo','threema','wire','session',
    'element','rocketchat','mattermost','teams','hangouts','gchat',
  ]);

  // Platform → Font Awesome 6 icon class map
  // Keyed on Gravatar service_type (lowercased, spaces→hyphens)
  const PLATFORM_ICONS = {
    'twitter':        'fa-brands fa-x-twitter',
    'x':              'fa-brands fa-x-twitter',
    'x-twitter':      'fa-brands fa-x-twitter',
    'mastodon':       'fa-brands fa-mastodon',
    'bluesky':        'fa-brands fa-bluesky',
    'instagram':      'fa-brands fa-instagram',
    'threads':        'fa-brands fa-threads',
    'facebook':       'fa-brands fa-facebook',
    'linkedin':       'fa-brands fa-linkedin',
    'github':         'fa-brands fa-github',
    'gitlab':         'fa-brands fa-gitlab',
    'youtube':        'fa-brands fa-youtube',
    'twitch':         'fa-brands fa-twitch',
    'tiktok':         'fa-brands fa-tiktok',
    'reddit':         'fa-brands fa-reddit',
    'pinterest':      'fa-brands fa-pinterest',
    'tumblr':         'fa-brands fa-tumblr',
    'medium':         'fa-brands fa-medium',
    'substack':       'fa-solid fa-newspaper',
    'wordpress':      'fa-brands fa-wordpress',
    'soundcloud':     'fa-brands fa-soundcloud',
    'spotify':        'fa-brands fa-spotify',
    'patreon':        'fa-brands fa-patreon',
    'ko-fi':          'fa-solid fa-mug-hot',
    'kofi':           'fa-solid fa-mug-hot',
    'twitch':         'fa-brands fa-twitch',
    'vimeo':          'fa-brands fa-vimeo',
    'flickr':         'fa-brands fa-flickr',
    'deviantart':     'fa-brands fa-deviantart',
    'behance':        'fa-brands fa-behance',
    'dribbble':       'fa-brands fa-dribbble',
    'stackexchange':  'fa-brands fa-stack-exchange',
    'stackoverflow':  'fa-brands fa-stack-overflow',
    'hackernews':     'fa-brands fa-hacker-news',
    'producthunt':    'fa-brands fa-product-hunt',
    'farcaster':      'fa-solid fa-circle-nodes',
    'nostr':          'fa-solid fa-bolt',
    'peertube':       'fa-solid fa-play',
    'pixelfed':       'fa-solid fa-camera',
    'lemmy':          'fa-solid fa-comments',
    'diaspora':       'fa-brands fa-diaspora',
    'vk':             'fa-brands fa-vk',
    'odnoklassniki':  'fa-brands fa-odnoklassniki',
    'xing':           'fa-brands fa-xing',
    'quora':          'fa-brands fa-quora',
    'goodreads':      'fa-brands fa-goodreads',
    'last-fm':        'fa-brands fa-lastfm',
    'lastfm':         'fa-brands fa-lastfm',
    'strava':         'fa-brands fa-strava',
    'steam':          'fa-brands fa-steam',
    'itch-io':        'fa-brands fa-itch-io',
    'twitch':         'fa-brands fa-twitch',
    'bandcamp':       'fa-brands fa-bandcamp',
    'mixcloud':       'fa-brands fa-mixcloud',
    'researchgate':   'fa-brands fa-researchgate',
    'orcid':          'fa-brands fa-orcid',
    'academia':       'fa-solid fa-graduation-cap',
    'angellist':      'fa-brands fa-angellist',
    'crunchbase':     'fa-solid fa-building',
    'gravatar':       'fa-solid fa-user-circle',
    // fallback
    '_default':       'fa-solid fa-globe',
  };

  // Derive icon from service_type, falling back to URL hostname sniffing
  function resolveIcon(serviceType, url) {
    const key = (serviceType || '').toLowerCase().replace(/[\s_]+/g, '-');
    if (PLATFORM_ICONS[key]) return PLATFORM_ICONS[key];
    // Hostname sniff fallback
    try {
      const host = new URL(url).hostname.replace(/^www\./, '');
      for (const [k, v] of Object.entries(PLATFORM_ICONS)) {
        if (k !== '_default' && host.includes(k.replace(/-/g, ''))) return v;
      }
    } catch {}
    return PLATFORM_ICONS['_default'];
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  const esc = s => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const tickHtml = (level, title, large = false) => !level ? '' :
    `<span class="tick ${large ? 'lg ' : ''}${esc(level)}" title="${esc(title)}">
       <svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>
     </span>`;

  const showError = (msg, detail) => {
    document.getElementById('body').innerHTML =
      `<div class="error">⚠️ Could not load profile.<br>${esc(msg)}${
        detail ? `<code>${esc(detail)}</code>` : ''}</div>`;
  };

  const fetchJSON = async (url, ms = 5000) => {
    const r = await fetch(url, { signal: AbortSignal.timeout(ms) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };

  // ── DNS-over-HTTPS TXT lookup ──────────────────────────────────────────────
  const dohTxtLookup = async hostname => {
    for (const resolver of DOH_RESOLVERS) {
      try {
        const data = await fetchJSON(resolver(hostname), 4000);
        const answers = (data?.Answer || []).filter(a => a.type === 16);
        if (answers.length)
          return answers.map(a => String(a.data).replace(/^"|"$/g, '').trim());
      } catch {}
    }
    return [];
  };

  // ── Minimal bech32 → npub ─────────────────────────────────────────────────
  const hexToNpub = hex => {
    try {
      const CS = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      const cb = (d,f,t,p) => { let a=0,b=0,r=[]; for(const v of d){a=(a<<f)|v;b+=f;while(b>=t){b-=t;r.push((a>>b)&((1<<t)-1));}}if(p&&b>0)r.push((a<<(t-b))&((1<<t)-1));return r; };
      const pm = v => { const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const x of v){const b=c>>25;c=((c&0x1ffffff)<<5)^x;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c; };
      const he = h => { const r=[];for(const c of h)r.push(c.charCodeAt(0)>>5);r.push(0);for(const c of h)r.push(c.charCodeAt(0)&31);return r; };
      const cs = (h,d) => { const v=he(h).concat(d).concat([0,0,0,0,0,0]);const m=pm(v)^1;const r=[];for(let p=0;p<6;p++)r.push((m>>(5*(5-p)))&31);return r; };
      const bytes = hex.match(/.{1,2}/g).map(b => parseInt(b, 16));
      const data  = cb(bytes, 8, 5, true);
      const hrp   = 'npub';
      return hrp + '1' + data.concat(cs(hrp, data)).map(d => CS[d]).join('');
    } catch { return null; }
  };

  // ── Media hosting check ────────────────────────────────────────────────────
  const checkMediaHost = (() => {
    let mediaServersPromise = null;
    const getMediaServers = () => {
      if (!mediaServersPromise) {
        mediaServersPromise = fetchJSON(
          `https://${DOMAIN}/.well-known/media-servers.json`, 4000
        ).then(j => {
          const raw = Array.isArray(j) ? j : (j?.servers || j?.media_servers || []);
          return raw.map(s => {
            try { return new URL(s).hostname.toLowerCase(); } catch { return null; }
          }).filter(Boolean);
        }).catch(() => []);
      }
      return mediaServersPromise;
    };
    return async url => {
      if (!url) return null;
      let hostname;
      try { hostname = new URL(url).hostname.toLowerCase(); } catch { return null; }
      if (hostname === DOMAIN || hostname.endsWith(`.${DOMAIN}`)) return 'gold';
      const trusted = await getMediaServers();
      if (trusted.some(h => hostname === h || hostname.endsWith(`.${h}`))) return 'green';
      return null;
    };
  })();

  // ── Race all relays — keep losers alive, resolve on first win ─────────────
  const raceRelays = (relays, pubkey) => {
    const SUB = 'p';
    return Promise.any(relays.map(url => new Promise((resolve, reject) => {
      let done = false;
      let ws;
      try { ws = new WebSocket(url); } catch(e) { return reject(e); }

      const fail  = r => { if (!done) { done = true; try{ws.close();}catch{} reject(new Error(r)); } };
      const timer = setTimeout(() => fail(`timeout:${url}`), 7000);

      ws.onopen = () =>
        ws.send(JSON.stringify(['REQ', SUB, { kinds: [0], authors: [pubkey], limit: 1 }]));

      ws.onmessage = e => {
        try {
          const m = JSON.parse(e.data);
          if (m[0] === 'EVENT' && m[1] === SUB && m[2]?.kind === 0 && !done) {
            done = true;
            clearTimeout(timer);
            // Close only the winning socket; losers remain open passively
            try { ws.close(); } catch {}
            try { resolve({ meta: JSON.parse(m[2].content), pubkey: m[2].pubkey }); }
            catch(pe) { reject(pe); }
          } else if (m[0] === 'EOSE' && !done) {
            fail(`no-event:${url}`);
          }
        } catch {}
      };

      ws.onerror = () => fail(`ws-err:${url}`);
      ws.onclose = () => { if (!done) fail(`ws-close:${url}`); };
    })));
  };

  // ── Gravatar verified accounts ─────────────────────────────────────────────
  // Returns array of { url, label, serviceType } filtered to non-messaging only.
  // Tries v3 REST API first, falls back to legacy unauthenticated endpoint.
  // Note: unauthenticated requests return max 4 verified accounts. <kcite ref="75"/>
  const fetchGravatarAccounts = async () => {
    const normalise = accts => accts
      .filter(a => {
        if (!a?.url && !a?.profile_url) return false;
        const t = (a.service_type || a.shortname || '').toLowerCase().replace(/[\s_]+/g, '-');
        return !MESSAGING_TYPES.has(t);
      })
      .map(a => ({
        url:         (a.url || a.profile_url || '').trim(),
        label:       a.service_label || a.display || a.shortname || '',
        serviceType: (a.service_type || a.shortname || '').toLowerCase().replace(/[\s_]+/g, '-'),
      }))
      .filter(a => a.url);

    // v3 REST API
    try {
      const d = await fetchJSON(
        `https://api.gravatar.com/v3/profiles/${GRAVATAR_SLUG}`, 6000
      );
      const accts = d?.verified_accounts || d?.accounts || [];
      if (accts.length) return normalise(accts);
    } catch {}

    // Legacy unauthenticated endpoint
    try {
      const d = await fetchJSON(
        `https://gravatar.com/${GRAVATAR_SLUG}.json`, 6000
      );
      const accts = d?.entry?.[0]?.accounts || [];
      if (accts.length) return normalise(accts);
    } catch {}

    return [];
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // MAIN
  // ═══════════════════════════════════════════════════════════════════════════

  // ── 1. nostr.json — pubkey + relay hints ───────────────────────────────────
  let pubkey           = '';
  let wellKnownNostrOk = false;
  let relayHints       = [];

  try {
    const j = await fetchJSON(`https://${DOMAIN}/.well-known/nostr.json?name=_`, 4000);
    const pk = j?.names?.['_'] || Object.values(j?.names || {})[0] || '';
    if (pk) {
      pubkey           = pk;
      wellKnownNostrOk = true;
      const hintMap    = j?.relays?.[pk] || [];
      relayHints       = Array.isArray(hintMap) ? hintMap : [];
    }
  } catch {}

  if (!pubkey) { showError('Could not resolve pubkey from NIP-05.'); return; }

  const allRelays = [...new Set([...relayHints, ...FALLBACK_RELAYS])];

  // ── 2. Race relays + Gravatar in parallel ──────────────────────────────────
  // Both network operations start at the same time; we don't wait for one
  // before starting the other.
  const relayPromise    = raceRelays(allRelays, pubkey);
  const gravatarPromise = fetchGravatarAccounts();

  let result;
  try {
    result = await relayPromise;
  } catch(agg) {
    showError('All relays failed.',
      agg?.errors?.map(e => e.message).join(' | ') ?? String(agg));
    return;
  }

  const { meta }      = result;
  const npub          = hexToNpub(pubkey);
  const nip05         = meta.nip05 || `_@${DOMAIN}`;
  const nip05Domain   = nip05.includes('@') ? nip05.split('@')[1] : '';
  const displayHandle = nip05.startsWith('_@') ? nip05.slice(2) : nip05;

  // ── 3. All verification + media checks in parallel ─────────────────────────
  const dnsNostrPromise = (async () => {
    const npubVal = npub || '';
    for (const name of [`_nostr.${DOMAIN}`, `_nip05.${DOMAIN}`, DOMAIN]) {
      try {
        const txts = await dohTxtLookup(name);
        if (txts.some(t => t.includes(pubkey) || (npubVal && t.includes(npubVal))))
          return true;
      } catch {}
    }
    return false;
  })();

  const dnsLnPromise = (async () => {
    try {
      const txts = await dohTxtLookup(`_lnurlp.${LN_DOMAIN}`);
      return txts.some(t =>
        t.includes(LN_USER) ||
        t.toLowerCase().includes('lnurlp') ||
        t.toLowerCase().includes('lightning')
      );
    } catch { return false; }
  })();

  const lnWellKnownPromise = (async () => {
    try {
      const j = await fetchJSON(
        `https://${LN_DOMAIN}/.well-known/lnurlp/${LN_USER}`, 5000
      );
      return j?.tag === 'payRequest' && !!j?.callback;
    } catch { return false; }
  })();

  const avatarMediaPromise = checkMediaHost(meta.picture || '');
  const bannerMediaPromise = checkMediaHost(meta.banner  || '');

  const [
    dnsNostrOk,
    dnsLnOk,
    lnWellKnownOk,
    avatarMediaLevel,
    bannerMediaLevel,
    gravatarAccounts,
  ] = await Promise.all([
    dnsNostrPromise,
    dnsLnPromise,
    lnWellKnownPromise,
    avatarMediaPromise,
    bannerMediaPromise,
    gravatarPromise,
  ]);

  // ── 4. Tick levels ─────────────────────────────────────────────────────────
  let handleTickLevel = null, handleTickTitle = '';
  if (wellKnownNostrOk && nip05Domain === DOMAIN) {
    handleTickLevel = 'gold';
    const parts = ['/.well-known/nostr.json ✓'];
    if (dnsNostrOk) parts.push('DNS TXT record ✓');
    handleTickTitle = 'Verified: ' + parts.join('  ');
  } else if (wellKnownNostrOk) {
    handleTickLevel = 'gold';
    handleTickTitle = 'Verified: pubkey confirmed in /.well-known/nostr.json ✓';
  } else {
    handleTickLevel = 'green';
    handleTickTitle = 'Verified: NIP-05 identity confirmed via relay';
  }

  let lnTickLevel = null, lnTickTitle = '';
  if (lnWellKnownOk) {
    lnTickLevel = 'gold';
    const parts = ['/.well-known/lnurlp ✓'];
    if (dnsLnOk) parts.push('DNS TXT _lnurlp record ✓');
    lnTickTitle = 'Verified: ' + parts.join('  ');
  }

  const avatarTickTitle = avatarMediaLevel === 'gold'
    ? `Avatar served from ${DOMAIN} ✓`
    : avatarMediaLevel === 'green'
      ? 'Avatar served from a trusted media server ✓' : '';

  const bannerTickTitle = bannerMediaLevel === 'gold'
    ? `Header image served from ${DOMAIN} ✓`
    : bannerMediaLevel === 'green'
      ? 'Header image served from a trusted media server ✓' : '';

  // ── 5. rel=me injection ────────────────────────────────────────────────────
  if (npub) {
    const l = document.createElement('link');
    l.rel = 'me'; l.href = `https://njump.me/${npub}`;
    document.head.appendChild(l);
  }
  for (const { url } of gravatarAccounts) {
    const l = document.createElement('link');
    l.rel = 'me'; l.href = url;
    document.head.appendChild(l);
  }

  // ── 6. Banner ──────────────────────────────────────────────────────────────
  const bannerEl = document.getElementById('banner');
  if (meta.banner) {
    const img = new Image();
    img.onload = () => {
      bannerEl.style.backgroundImage    = `url(${meta.banner})`;
      bannerEl.style.backgroundSize     = 'cover';
      bannerEl.style.backgroundPosition = 'center';
    };
    img.src = meta.banner;
  }
  if (bannerMediaLevel) {
    const bt = document.createElement('div');
    bt.className = 'banner-tick';
    bt.innerHTML = tickHtml(bannerMediaLevel, bannerTickTitle, true);
    bannerEl.appendChild(bt);
  }

  // ── 7. Avatar ──────────────────────────────────────────────────────────────
  const name       = meta.display_name || meta.name || DOMAIN;
  const avatarWrap = document.getElementById('avatarWrap');
  const makeFallback = n => {
    const d = document.createElement('div');
    d.className   = 'avatar-fallback';
    d.textContent = (n || '?')[0].toUpperCase();
    return d;
  };
  if (meta.picture) {
    const img = document.createElement('img');
    img.className = 'avatar-img'; img.alt = name;
    img.onerror   = () => img.replaceWith(makeFallback(name));
    img.src       = meta.picture;
    avatarWrap.replaceChildren(img);
  } else {
    avatarWrap.replaceChildren(makeFallback(name));
  }
  if (avatarMediaLevel) {
    const at = document.createElement('div');
    at.className = 'avatar-tick';
    at.innerHTML = tickHtml(avatarMediaLevel, avatarTickTitle, true);
    avatarWrap.appendChild(at);
  }

  // ── 8. Social icons HTML ───────────────────────────────────────────────────
  let socialHtml = '';
  if (gravatarAccounts.length) {
    const buttons = gravatarAccounts.map(({ url, label, serviceType }) => {
      const icon    = resolveIcon(serviceType, url);
      const tipText = label || serviceType || new URL(url).hostname;
      return `<a class="social-btn" href="${esc(url)}" target="_blank"
                 rel="noopener me" title="${esc(tipText)}">
                <i class="${esc(icon)}"></i>
              </a>`;
    }).join('');
    socialHtml = `
      <div class="section-title">Follow me on</div>
      <div class="social-row">${buttons}</div>`;
  }

  // ── 9. Render body ─────────────────────────────────────────────────────────
  const nostrUri  = npub ? `nostr:${npub}` : `https://njump.me/${nip05}`;
  const lightning = `${LN_USER}@${LN_DOMAIN}`;

  document.getElementById('body').innerHTML = `
    <div class="display-name">${esc(name)}</div>
    <div class="pills">
      <a class="pill" href="${esc(nostrUri)}" title="Open in your Nostr client">
        @${esc(displayHandle)}
        ${tickHtml(handleTickLevel, handleTickTitle)}
      </a>
      <a class="pill" href="lightning:${esc(lightning)}" title="Pay via Lightning Network">
        ⚡ ${esc(lightning)}
        ${tickHtml(lnTickLevel, lnTickTitle)}
      </a>
    </div>
    ${socialHtml}
    <a class="footer-link" href="${DITTO}/${esc(DOMAIN)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

})().catch(err => {
  document.getElementById('body').innerHTML =
    `<div class="error">⚠️ Unexpected error.<code>${err?.message ?? err}</code></div>`;
});
</script>
</body>
</html>
