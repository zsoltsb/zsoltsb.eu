<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zsoltsb.eu</title>
  <link rel="me" href="https://ditto.pub/zsoltsb.eu" />
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
  <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
      --accent: #8b5cf6; --accent2: #a78bfa; --text: #e8e8e8;
      --muted: #888; --gold: #f59e0b; --green: #34d399;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 40px 16px 80px;
    }
    .card {
      width: 100%; max-width: 600px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    }
    /* Banner */
    .banner {
      height: 160px; position: relative;
      background: linear-gradient(135deg,#1e1040 0%,#2d1b69 50%,#1a0f3d 100%);
      background-size: cover; background-position: center;
    }
    .banner-tick { position: absolute; bottom: 8px; right: 10px; }
    .avatar-wrap { position: absolute; bottom: -48px; left: 24px; }
    .avatar-img, .avatar-fb {
      width: 96px; height: 96px; border-radius: 50%;
      border: 4px solid var(--surface); display: block;
    }
    .avatar-img { object-fit: cover; }
    .avatar-fb {
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; font-size: 2.4rem; font-weight: 700; color: #fff;
    }
    .avatar-tick { position: absolute; bottom: 2px; right: 2px; }
    /* Body */
    .body { padding: 62px 24px 28px; }
    .display-name { font-size: 1.35rem; font-weight: 700; }
    /* Pill rows */
    .pill-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(139,92,246,.10); border: 1px solid rgba(139,92,246,.28);
      border-radius: 20px; padding: 6px 14px; font-size: .8rem;
      color: var(--accent2); text-decoration: none; line-height: 1;
      transition: background .18s, border-color .18s; white-space: nowrap;
    }
    .pill:hover { background: rgba(139,92,246,.22); border-color: rgba(139,92,246,.55); }
    /* Dropdowns */
    .dropdown { position: relative; margin-left: auto; flex-shrink: 0; }
    .dropdown-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.05); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 12px; font-size: .78rem;
      color: var(--muted); font-family: inherit; cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap; user-select: none;
    }
    .dropdown-btn:hover { background: rgba(255,255,255,.09); border-color: #444; color: var(--text); }
    .dropdown-btn .chevron { font-size: .6rem; transition: transform .2s; }
    .dropdown.open .chevron { transform: rotate(180deg); }
    .dropdown-menu {
      display: none; position: absolute; right: 0; top: calc(100% + 6px);
      background: #222; border: 1px solid var(--border); border-radius: 10px;
      min-width: 200px; z-index: 100; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .dropdown.open .dropdown-menu { display: block; }
    .dropdown-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; font-size: .82rem; color: var(--text);
      text-decoration: none; transition: background .12s;
    }
    .dropdown-item:hover { background: rgba(139,92,246,.12); }
    .di-icon {
      width: 20px; height: 20px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent2);
    }
    .di-icon svg { width: 18px; height: 18px; fill: currentColor; }
    /* Ticks */
    .tick {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0; cursor: help;
    }
    .tick svg { width: 9px; height: 9px; }
    .tick.gold { background: var(--gold); }
    .tick.green { background: var(--green); }
    .tick.lg { width: 20px; height: 20px; box-shadow: 0 0 0 2px var(--surface); }
    .tick.lg svg { width: 11px; height: 11px; }
    /* Social */
    .section-title {
      font-size: .68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .09em; color: var(--muted); margin-top: 24px; margin-bottom: 10px;
    }
    .social-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .social-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); text-decoration: none;
      transition: background .15s, border-color .15s, color .15s, transform .1s;
    }
    .social-btn:hover {
      background: rgba(139,92,246,.10); border-color: var(--accent);
      color: var(--accent2); transform: translateY(-2px);
    }
    .social-btn svg { width: 22px; height: 22px; fill: currentColor; }
    /* Btn icons */
    .btn-icon { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }
    /* Footer */
    .footer-link {
      display: block; text-align: center; margin-top: 26px; padding-top: 18px;
      border-top: 1px solid var(--border); font-size: .78rem;
      color: var(--muted); text-decoration: none;
    }
    .footer-link span { color: var(--accent2); }
    .footer-link:hover span { text-decoration: underline; }
    /* Skeleton */
    .sk {
      background: linear-gradient(90deg,var(--border) 25%,#2e2e2e 50%,var(--border) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }
    .error { padding: 28px; color: #f87171; font-size: .875rem; text-align: center; line-height: 1.7; }
    .error code { display: block; margin-top: 8px; font-size: .72rem; color: var(--muted); word-break: break-all; }
  </style>
</head>
<body>
<div class="card">
  <div class="banner" id="banner">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar-fb sk" style="background:var(--border)"></div>
    </div>
  </div>
  <div class="body" id="body">
    <div class="sk" style="width:44%;height:22px;margin-bottom:10px"></div>
    <div class="sk" style="width:100%;height:34px;border-radius:20px;margin-bottom:8px"></div>
    <div class="sk" style="width:100%;height:34px;border-radius:20px"></div>
  </div>
</div>

<script>
void (async () => {

  // ── CONFIG ────────────────────────────────────────────────────────────────
  const DOMAIN        = 'zsoltsb.eu';
  const DITTO_URL     = 'https://ditto.pub';
  const LN_USER       = 'wallet';
  const LN_DOMAIN     = DOMAIN;
  const GRAVATAR_SLUG = 'zsoltsb';

  const AUTHORITY_RELAY = 'wss://relay.ditto.pub';
  const OPENVIBE_RELAYS = [
    'wss://relay.damus.io','wss://relay.nostr.band','wss://nos.lol',
    'wss://relay.primal.net','wss://nostr.wine','wss://relay.snort.social',
    'wss://purplepag.es','wss://relay.nos.social',
  ];
  const EXTRA_RELAYS = ['wss://nostr.mom','wss://relay.nostr.bg','wss://nostr.oxtr.dev'];
  const DOH_RESOLVERS = [
    n => `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(n)}&type=TXT`,
    n => `https://dns.google/resolve?name=${encodeURIComponent(n)}&type=TXT`,
  ];

  // Hardcoded social order: shortname → position (lower = earlier)
  // Gravatar accounts not in this map are appended after in their original order
  const SOCIAL_ORDER = { bluesky:0, mastodon:1, tumblr:2, threads:3, github:4, gitlab:5 };

  // Hardcoded git fallbacks shown only if NOT already in Gravatar accounts
  const GIT_FALLBACKS = [
    { shortname:'github',  url:'https://github.com/zsoltsb',  name:'GitHub' },
    { shortname:'gitlab',  url:'https://gitlab.com/zsoltsb',  name:'GitLab' },
  ];

  // Messaging shortnames → go into "Drop me a line" dropdown
  const MESSAGING_KEYS = new Set([
    'whatsapp','telegram','signal','messenger','wechat','line','viber',
    'skype','discord','slack','matrix','imessage','sms','kik','snapchat',
    'kakaotalk','zalo','imo','threema','wire','session','element',
    'rocketchat','mattermost','teams','hangouts','gchat',
  ]);

  // Hardcoded Telegram entry (always first in messaging dropdown)
  const TELEGRAM_ENTRY = { shortname:'telegram', url:'https://t.me/zsoltsb', name:'Telegram' };

  // ── ICONIFY inline SVG fetcher ────────────────────────────────────────────
  // Uses api.iconify.design — no tracking, GDPR-safe, adblock-safe
  // Returns SVG string or null
  const iconCache = new Map();
  const fetchIcon = async (collection, name) => {
    const key = `${collection}:${name}`;
    if (iconCache.has(key)) return iconCache.get(key);
    try {
      const r = await fetch(
        `https://api.iconify.design/${collection}/${name}.svg?width=1em&height=1em`,
        { signal: AbortSignal.timeout(4000) }
      );
      if (!r.ok) throw new Error('not found');
      const svg = await r.text();
      // Strip width/height attrs so CSS controls size; ensure fill=currentColor
      const clean = svg
        .replace(/\s(width|height)="[^"]*"/g, '')
        .replace(/<svg /, '<svg ');
      iconCache.set(key, clean);
      return clean;
    } catch {
      iconCache.set(key, null);
      return null;
    }
  };

  // Icon lookup table: shortname/key → [collection, icon-name] candidates (tried in order)
  const ICON_LOOKUP = {
    'bluesky':       [['fa6-brands','bluesky'],       ['simple-icons','bluesky']],
    'mastodon':      [['fa6-brands','mastodon'],       ['simple-icons','mastodon']],
    'tumblr':        [['fa6-brands','tumblr'],         ['simple-icons','tumblr']],
    'threads':       [['fa6-brands','threads'],        ['simple-icons','threads']],
    'github':        [['fa6-brands','github'],         ['simple-icons','github']],
    'gitlab':        [['fa6-brands','gitlab'],         ['simple-icons','gitlab']],
    'twitter':       [['fa6-brands','x-twitter'],      ['simple-icons','x']],
    'x':             [['fa6-brands','x-twitter'],      ['simple-icons','x']],
    'instagram':     [['fa6-brands','instagram'],      ['simple-icons','instagram']],
    'facebook':      [['fa6-brands','facebook'],       ['simple-icons','facebook']],
    'linkedin':      [['fa6-brands','linkedin'],       ['simple-icons','linkedin']],
    'pinterest':     [['fa6-brands','pinterest'],      ['simple-icons','pinterest']],
    'reddit':        [['fa6-brands','reddit'],         ['simple-icons','reddit']],
    'tiktok':        [['fa6-brands','tiktok'],         ['simple-icons','tiktok']],
    'youtube':       [['fa6-brands','youtube'],        ['simple-icons','youtube']],
    'twitch':        [['fa6-brands','twitch'],         ['simple-icons','twitch']],
    'soundcloud':    [['fa6-brands','soundcloud'],     ['simple-icons','soundcloud']],
    'spotify':       [['fa6-brands','spotify'],        ['simple-icons','spotify']],
    'medium':        [['fa6-brands','medium'],         ['simple-icons','medium']],
    'substack':      [['simple-icons','substack']],
    'telegram':      [['fa6-brands','telegram'],       ['simple-icons','telegram']],
    'whatsapp':      [['fa6-brands','whatsapp'],       ['simple-icons','whatsapp']],
    'signal':        [['simple-icons','signal']],
    'discord':       [['fa6-brands','discord'],        ['simple-icons','discord']],
    'slack':         [['fa6-brands','slack'],          ['simple-icons','slack']],
    'skype':         [['fa6-brands','skype'],          ['simple-icons','skype']],
    'paypal':        [['fa6-brands','paypal'],         ['simple-icons','paypal']],
    'paypalme':      [['fa6-brands','paypal'],         ['simple-icons','paypal']],
    'venmo':         [['simple-icons','venmo']],
    'cashapp':       [['simple-icons','cashapp']],
    'patreon':       [['fa6-brands','patreon'],        ['simple-icons','patreon']],
    'kofi':          [['simple-icons','kofi']],
    'ko-fi':         [['simple-icons','kofi']],
    'buymeacoffee':  [['simple-icons','buymeacoffee']],
    'liberapay':     [['simple-icons','liberapay']],
    'opencollective':[['fa6-brands','opencollective'], ['simple-icons','opencollective']],
    'bitcoin':       [['fa6-brands','bitcoin'],        ['simple-icons','bitcoin']],
    'ethereum':      [['simple-icons','ethereum']],
    'revolut':       [['simple-icons','revolut']],
    'sentz':         [['simple-icons','sentz']],
    'farcaster':     [['simple-icons','farcaster']],
    'nostr':         [['fa6-solid','bolt']],
    'strava':        [['fa6-brands','strava'],         ['simple-icons','strava']],
    'steam':         [['fa6-brands','steam'],          ['simple-icons','steam']],
    'codepen':       [['fa6-brands','codepen'],        ['simple-icons','codepen']],
    'npm':           [['fa6-brands','npm'],            ['simple-icons','npm']],
    'docker':        [['fa6-brands','docker'],         ['simple-icons','docker']],
    '_link':         [['fa6-solid','link']],
    '_comment':      [['fa6-regular','comment']],
    '_dollar':       [['fa6-solid','hand-holding-dollar']],
  };

  const resolveIconKey = (shortname, url) => {
    const k = (shortname || '').toLowerCase().replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]/g,'');
    if (ICON_LOOKUP[k]) return k;
    // Try hostname
    try {
      const host = new URL(url).hostname.replace(/^www\./,'').replace(/\.[^.]+$/,'');
      const hk = host.toLowerCase().replace(/[^a-z0-9-]/g,'');
      if (ICON_LOOKUP[hk]) return hk;
      for (const key of Object.keys(ICON_LOOKUP)) {
        if (key !== '_link' && key !== '_comment' && key !== '_dollar') {
          if (hk.includes(key) || key.includes(hk)) return key;
        }
      }
    } catch {}
    return '_link';
  };

  const getIcon = async (shortname, url) => {
    const key = resolveIconKey(shortname, url);
    const candidates = ICON_LOOKUP[key] || ICON_LOOKUP['_link'];
    for (const [col, name] of candidates) {
      const svg = await fetchIcon(col, name);
      if (svg) return svg;
    }
    // Ultimate fallback: simple link SVG inline
    return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>`;
  };

  // ── HELPERS ───────────────────────────────────────────────────────────────
  const esc = s => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const tickHtml = (level, title, large = false) => !level ? '' :
    `<span class="tick${large?' lg':''} ${esc(level)}" title="${esc(title)}">
       <svg viewBox="0 0 10 10" fill="none" stroke="#0f0f0f" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
         <polyline points="1.5,5 4,7.5 8.5,2.5"/>
       </svg>
     </span>`;

  const fetchJSON = async (url, ms = 5000) => {
    const r = await fetch(url, { signal: AbortSignal.timeout(ms) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };

  const fetchJSONP = (url, cbParam = 'callback', ms = 8000) =>
    new Promise((resolve, reject) => {
      const name = '__gjp_' + Math.random().toString(36).slice(2);
      const timer = setTimeout(() => { cleanup(); reject(new Error('jsonp-timeout')); }, ms);
      const script = document.createElement('script');
      const cleanup = () => { clearTimeout(timer); delete window[name]; script.remove(); };
      window[name] = data => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('jsonp-error')); };
      script.src = `${url}${url.includes('?')?'&':'?'}${cbParam}=${name}`;
      document.head.appendChild(script);
    });

  const dohTxtLookup = async hostname => {
    for (const resolver of DOH_RESOLVERS) {
      try {
        const data = await fetchJSON(resolver(hostname), 4000);
        const answers = (data?.Answer || []).filter(a => a.type === 16);
        if (answers.length)
          return answers.map(a => String(a.data).replace(/^"|"$/g,'').trim());
      } catch {}
    }
    return [];
  };

  const hexToNpub = hex => {
    try {
      const CS='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      const cb=(d,f,t,p)=>{let a=0,b=0,r=[];for(const v of d){a=(a<<f)|v;b+=f;while(b>=t){b-=t;r.push((a>>b)&((1<<t)-1));}}if(p&&b>0)r.push((a<<(t-b))&((1<<t)-1));return r;};
      const pm=v=>{const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const x of v){const b=c>>25;c=((c&0x1ffffff)<<5)^x;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c;};
      const he=h=>{const r=[];for(const c of h)r.push(c.charCodeAt(0)>>5);r.push(0);for(const c of h)r.push(c.charCodeAt(0)&31);return r;};
      const cs=(h,d)=>{const v=he(h).concat(d).concat([0,0,0,0,0,0]);const m=pm(v)^1;const r=[];for(let p=0;p<6;p++)r.push((m>>(5*(5-p)))&31);return r;};
      const bytes=hex.match(/.{1,2}/g).map(b=>parseInt(b,16));
      const data=cb(bytes,8,5,true);
      const hrp='npub';
      return hrp+'1'+data.concat(cs(hrp,data)).map(d=>CS[d]).join('');
    } catch { return null; }
  };

  const checkMediaHost = (() => {
    let p = null;
    const get = () => {
      if (!p) p = fetchJSON(`https://${DOMAIN}/.well-known/media-servers.json`, 4000)
        .then(j => {
          const raw = Array.isArray(j) ? j : (j?.servers || j?.media_servers || []);
          return raw.map(s => { try { return new URL(s).hostname.toLowerCase(); } catch { return null; } }).filter(Boolean);
        }).catch(() => []);
      return p;
    };
    return async url => {
      if (!url) return null;
      let h; try { h = new URL(url).hostname.toLowerCase(); } catch { return null; }
      if (h === DOMAIN || h.endsWith(`.${DOMAIN}`)) return 'gold';
      const t = await get();
      if (t.some(x => h === x || h.endsWith(`.${x}`))) return 'green';
      return null;
    };
  })();

  // ── RELAY SYSTEM ──────────────────────────────────────────────────────────
  const fetchFromRelay = (wsUrl, pubkey, timeoutMs = 8000) =>
    new Promise((resolve, reject) => {
      let done = false; let ws;
      try { ws = new WebSocket(wsUrl); } catch(e) { return reject(e); }
      const fail = r => { if (!done) { done = true; try { ws.close(); } catch {} reject(new Error(r)); } };
      const timer = setTimeout(() => fail(`timeout:${wsUrl}`), timeoutMs);
      ws.onopen = () => ws.send(JSON.stringify(['REQ','s',{kinds:[0],authors:[pubkey],limit:1}]));
      ws.onmessage = e => {
        try {
          const m = JSON.parse(e.data);
          if (m[0]==='EVENT' && m[1]==='s' && m[2]?.kind===0 && !done) {
            done = true; clearTimeout(timer); try { ws.close(); } catch {}
            resolve({ meta: JSON.parse(m[2].content), relay: wsUrl });
          } else if (m[0]==='EOSE' && !done) { fail(`eose-empty:${wsUrl}`); }
        } catch {}
      };
      ws.onerror = () => fail(`ws-err:${wsUrl}`);
      ws.onclose = () => { if (!done) fail(`ws-close:${wsUrl}`); };
    });

  const fetchNostrMeta = async (pubkey, relayHints) => {
    const others = [...new Set([
      ...relayHints.filter(r => r !== AUTHORITY_RELAY),
      ...OPENVIBE_RELAYS, ...EXTRA_RELAYS,
    ])].filter(r => r !== AUTHORITY_RELAY);

    let authorityResult = null;
    const authorityPromise = fetchFromRelay(AUTHORITY_RELAY, pubkey, 9000)
      .then(r => { authorityResult = r; return r; })
      .catch(e => { console.warn('[relay] authority failed:', e.message); return null; });

    await new Promise(r => setTimeout(r, 200));
    const otherPromises = others.map(url => fetchFromRelay(url, pubkey, 8000).catch(() => null));
    await authorityPromise;

    if (authorityResult) return authorityResult;
    const fallback = await Promise.any(
      otherPromises.map(p => p.then(r => r ? r : Promise.reject()))
    ).catch(() => null);
    if (fallback) return fallback;
    throw new Error('All relays failed');
  };

  // ── GRAVATAR ──────────────────────────────────────────────────────────────
  // Actual JSON structure: entry[0].accounts[] + entry[0].payments{}
  const fetchGravatarData = async () => {
    const url = `https://gravatar.com/${GRAVATAR_SLUG}.json`;
    let entry = null;

    try {
      const d = await fetchJSONP(url);
      entry = d?.entry?.[0];
      if (entry) console.log('[gravatar] jsonp ✓');
    } catch(e) { console.warn('[gravatar] jsonp:', e.message); }

    if (!entry) {
      try {
        const d = await fetchJSON(url, 6000);
        entry = d?.entry?.[0];
        if (entry) console.log('[gravatar] direct ✓');
      } catch(e) { console.warn('[gravatar] direct:', e.message); }
    }

    if (!entry) return { social: [], messaging: [], payments: [] };

    // accounts[] — each has: shortname, name, url, verified, is_hidden
    const rawAccounts = (entry.accounts || [])
      .filter(a => !a.is_hidden && a.verified && (a.url || '').trim())
      .map(a => ({
        shortname: (a.shortname || '').toLowerCase(),
        name:      a.name || a.shortname || '',
        url:       (a.url || '').trim(),
      }));

    const social    = rawAccounts.filter(a => !MESSAGING_KEYS.has(a.shortname));
    const messaging = rawAccounts.filter(a =>  MESSAGING_KEYS.has(a.shortname));

    // payments{} — plain object: key=provider, value=url
    // e.g. {"paypalme":"https://paypal.me/zsoltsb","Revolut":"https://revolut.me/zsoltsb"}
    const paymentsObj = entry.payments || {};
    const payments = Object.entries(paymentsObj).map(([key, url]) => ({
      shortname: key.toLowerCase().replace(/\s+/g,'-'),
      name:      key,
      url:       String(url),
    })).filter(p => p.url.startsWith('http'));

    console.log(`[gravatar] social:${social.length} messaging:${messaging.length} payments:${payments.length}`);
    return { social, messaging, payments };
  };

  // ── MAIN ──────────────────────────────────────────────────────────────────

  // 1. Resolve pubkey
  let pubkey = '', wellKnownNostrOk = false, relayHints = [];
  try {
    const j = await fetchJSON(`https://${DOMAIN}/.well-known/nostr.json?name=_`, 4000);
    const pk = j?.names?.['_'] || Object.values(j?.names || {})[0] || '';
    if (pk) { pubkey = pk; wellKnownNostrOk = true; relayHints = j?.relays?.[pk] || []; }
  } catch {}
  if (!pubkey) {
    document.getElementById('body').innerHTML =
      '<div class="error">⚠️ Could not resolve pubkey from NIP-05.</div>';
    return;
  }

  // 2. Parallel: Nostr + Gravatar
  const metaPromise     = fetchNostrMeta(pubkey, relayHints);
  const gravatarPromise = fetchGravatarData();

  // 3. Nostr meta
  let result;
  try { result = await metaPromise; }
  catch(e) {
    document.getElementById('body').innerHTML =
      `<div class="error">⚠️ All relays failed.<code>${esc(e.message)}</code></div>`;
    return;
  }

  const { meta } = result;
  const npub        = hexToNpub(pubkey);
  const nip05       = meta.nip05 || `_@${DOMAIN}`;
  const nip05Domain = nip05.includes('@') ? nip05.split('@')[1] : '';
  const displayHandle = nip05.startsWith('_@') ? nip05.slice(2) : nip05;

  // 4. Verification + Gravatar
  const [
    dnsNostrOk, dnsLnOk, lnWellKnownOk,
    avatarMediaLevel, bannerMediaLevel,
    gravatarData,
  ] = await Promise.all([
    (async () => {
      for (const name of [`_nostr.${DOMAIN}`, `_nip05.${DOMAIN}`, DOMAIN]) {
        try {
          const txts = await dohTxtLookup(name);
          if (txts.some(t => t.includes(pubkey) || (npub && t.includes(npub)))) return true;
        } catch {}
      }
      return false;
    })(),
    (async () => {
      try {
        const txts = await dohTxtLookup(`_lnurlp.${LN_DOMAIN}`);
        return txts.some(t =>
          t.includes(LN_USER) || t.toLowerCase().includes('lnurlp') || t.toLowerCase().includes('lightning')
        );
      } catch { return false; }
    })(),
    (async () => {
      try {
        const j = await fetchJSON(`https://${LN_DOMAIN}/.well-known/lnurlp/${LN_USER}`, 5000);
        return j?.tag === 'payRequest' && !!j?.callback;
      } catch { return false; }
    })(),
    checkMediaHost(meta.picture || ''),
    checkMediaHost(meta.banner  || ''),
    gravatarPromise,
  ]);

  const { social: socialRaw, messaging: messagingRaw, payments } = gravatarData;

  // 5. Build final social list with hardcoded order
  // Merge Gravatar social + git fallbacks (only if not already in Gravatar)
  const gravatarShortnames = new Set(socialRaw.map(a => a.shortname));
  const gitToAdd = GIT_FALLBACKS.filter(g => !gravatarShortnames.has(g.shortname));
  const allSocial = [...socialRaw, ...gitToAdd];

  // Sort by SOCIAL_ORDER; items not in map go to end in original order
  const maxOrder = Object.keys(SOCIAL_ORDER).length;
  allSocial.sort((a, b) => {
    const oa = SOCIAL_ORDER[a.shortname] ?? (maxOrder + allSocial.indexOf(a));
    const ob = SOCIAL_ORDER[b.shortname] ?? (maxOrder + allSocial.indexOf(b));
    return oa - ob;
  });

  // Messaging: hardcoded Telegram first, then Gravatar messaging (deduped)
  const allMessaging = [
    TELEGRAM_ENTRY,
    ...messagingRaw.filter(a => a.shortname !== 'telegram'),
  ];

  // 6. Tick levels
  let handleTickLevel = 'green', handleTickTitle = 'Verified via relay';
  if (wellKnownNostrOk && nip05Domain === DOMAIN) {
    handleTickLevel = 'gold';
    handleTickTitle = '/.well-known/nostr.json ✓' + (dnsNostrOk ? ' · DNS TXT ✓' : '');
  } else if (wellKnownNostrOk) {
    handleTickLevel = 'gold';
    handleTickTitle = 'Verified: pubkey in /.well-known/nostr.json ✓';
  }
  let lnTickLevel = null, lnTickTitle = '';
  if (lnWellKnownOk) {
    lnTickLevel = 'gold';
    lnTickTitle = '/.well-known/lnurlp ✓' + (dnsLnOk ? ' · DNS TXT _lnurlp ✓' : '');
  }
  const avatarTickTitle = avatarMediaLevel === 'gold' ? `Avatar hosted on ${DOMAIN} ✓`
    : avatarMediaLevel === 'green' ? 'Avatar on trusted media server ✓' : '';
  const bannerTickTitle = bannerMediaLevel === 'gold' ? `Banner hosted on ${DOMAIN} ✓`
    : bannerMediaLevel === 'green' ? 'Banner on trusted media server ✓' : '';

  // 7. rel=me
  if (npub) {
    const l = document.createElement('link'); l.rel='me';
    l.href=`https://njump.me/${npub}`; document.head.appendChild(l);
  }
  for (const { url } of allSocial) {
    const l = document.createElement('link'); l.rel='me'; l.href=url;
    document.head.appendChild(l);
  }

  // 8. Banner
  const bannerEl = document.getElementById('banner');
  if (meta.banner) {
    const img = new Image();
    img.onload = () => { bannerEl.style.backgroundImage = `url(${meta.banner})`; };
    img.src = meta.banner;
  }
  if (bannerMediaLevel) {
    const bt = document.createElement('div'); bt.className='banner-tick';
    bt.innerHTML = tickHtml(bannerMediaLevel, bannerTickTitle, true);
    bannerEl.appendChild(bt);
  }

  // 9. Avatar
  const name = meta.display_name || meta.name || DOMAIN;
  const avatarWrap = document.getElementById('avatarWrap');
  if (meta.picture) {
    const img = document.createElement('img');
    img.className='avatar-img'; img.alt=name;
    img.onerror = () => {
      const fb = document.createElement('div');
      fb.className='avatar-fb'; fb.textContent=(name||'?')[0].toUpperCase();
      img.replaceWith(fb);
    };
    img.src = meta.picture;
    avatarWrap.replaceChildren(img);
  } else {
    const fb = document.createElement('div');
    fb.className='avatar-fb'; fb.textContent=(name||'?')[0].toUpperCase();
    avatarWrap.replaceChildren(fb);
  }
  if (avatarMediaLevel) {
    const at = document.createElement('div'); at.className='avatar-tick';
    at.innerHTML = tickHtml(avatarMediaLevel, avatarTickTitle, true);
    avatarWrap.appendChild(at);
  }

  // 10. Fetch all icons in parallel before rendering
  const nostrUri  = npub ? `nostr:${npub}` : `https://njump.me/${nip05}`;
  const lightning = `${LN_USER}@${LN_DOMAIN}`;

  // Pre-fetch all needed icons concurrently
  const [
    iconComment, iconDollar,
    socialIcons, messagingIcons, paymentIcons,
  ] = await Promise.all([
    getIcon('_comment', ''),
    getIcon('_dollar', ''),
    Promise.all(allSocial.map(a => getIcon(a.shortname, a.url))),
    Promise.all(allMessaging.map(a => getIcon(a.shortname, a.url))),
    Promise.all(payments.map(p => getIcon(p.shortname, p.url))),
  ]);

  // 11. Build HTML
  const buildSocialRow = () => allSocial.map((a, i) =>
    `<a class="social-btn" href="${esc(a.url)}" target="_blank" rel="noopener me" title="${esc(a.name)}">
       ${socialIcons[i] || ''}
     </a>`
  ).join('');

  const buildDropdown = (btnLabel, btnIconSvg, items, icons) => {
    if (!items.length) return '';
    const itemsHtml = items.map((item, i) =>
      `<a class="dropdown-item" href="${esc(item.url)}" target="_blank" rel="noopener">
         <span class="di-icon">${icons[i] || ''}</span>
         <span>${esc(item.name)}</span>
       </a>`
    ).join('');
    return `<div class="dropdown">
      <button class="dropdown-btn" type="button">
        <span class="btn-icon">${btnIconSvg || ''}</span>
        ${esc(btnLabel)} <span class="chevron">▾</span>
      </button>
      <div class="dropdown-menu">${itemsHtml}</div>
    </div>`;
  };

  const msgDropdown = buildDropdown('Drop me a line', iconComment, allMessaging, messagingIcons);
  const tipDropdown = buildDropdown('Drop me a dime', iconDollar, payments, paymentIcons);

  document.getElementById('body').innerHTML = `
    <div class="display-name">${esc(name)}</div>

    <div class="pill-row">
      <a class="pill" href="${esc(nostrUri)}" title="Open in your Nostr client">
        @${esc(displayHandle)} ${tickHtml(handleTickLevel, handleTickTitle)}
      </a>
      ${msgDropdown}
    </div>

    <div class="pill-row">
      <a class="pill" href="lightning:${esc(lightning)}" title="Pay via Lightning Network">
        ⚡ ${esc(lightning)} ${tickHtml(lnTickLevel, lnTickTitle)}
      </a>
      ${tipDropdown}
    </div>

    ${allSocial.length ? `
      <div class="section-title">Follow me on</div>
      <div class="social-row">${buildSocialRow()}</div>
    ` : ''}

    <a class="footer-link" href="${DITTO_URL}/${esc(DOMAIN)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

  // 12. Dropdown toggle
  document.querySelectorAll('.dropdown-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const dd = btn.closest('.dropdown');
      const wasOpen = dd.classList.contains('open');
      document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
      if (!wasOpen) dd.classList.add('open');
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
  });

})().catch(err => {
  const b = document.getElementById('body');
  if (b) b.innerHTML =
    `<div class="error">⚠️ Unexpected error.<code>${String(err?.message ?? err)}</code></div>`;
});
</script>
</body>
</html>
