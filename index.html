<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zsoltsb.eu</title>

  <!-- Static rel-me; more injected dynamically -->
  <link rel="me" href="https://ditto.pub/zsoltsb.eu" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #1a1a1a;
      --border:   #2a2a2a;
      --accent:   #8b5cf6;
      --accent-2: #a78bfa;
      --text:     #e8e8e8;
      --muted:    #888;
      --gold:     #f59e0b;
      --green:    #34d399;
      --radius:   14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ── Banner ── */
    .banner {
      height: 160px;
      background: linear-gradient(135deg, #1e1040 0%, #2d1b69 50%, #1a0f3d 100%);
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: absolute;
      bottom: -48px;
      left: 24px;
    }
    .avatar-img, .avatar-fallback {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: 4px solid var(--surface);
      object-fit: cover;
      display: block;
    }
    .avatar-fallback {
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; font-weight: 700; color: #fff;
    }

    /* ── Body ── */
    .body { padding: 62px 24px 28px; }

    .display-name {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
    }

    /* ── Pills ── */
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(139,92,246,0.10);
      border: 1px solid rgba(139,92,246,0.28);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--accent-2);
      text-decoration: none;
      font-family: inherit;
      line-height: 1;
      transition: background 0.18s, border-color 0.18s;
      cursor: pointer;
    }
    .pill:hover {
      background: rgba(139,92,246,0.22);
      border-color: rgba(139,92,246,0.55);
    }

    /* ── Verification ticks ── */
    .tick {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px; height: 15px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tick svg {
      width: 9px; height: 9px;
      fill: none;
      stroke: #0f0f0f;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tick.gold  { background: var(--gold);  }
    .tick.green { background: var(--green); }

    /* ── Social buttons ── */
    .section-title {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      margin-top: 24px;
      margin-bottom: 10px;
    }

    .social-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.82rem;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 0.18s, background 0.18s;
    }
    .social-btn:hover {
      border-color: var(--accent);
      background: rgba(139,92,246,0.06);
    }
    .social-btn i {
      font-size: 1rem;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
    }
    .footer-link span { color: var(--accent-2); }
    .footer-link:hover span { text-decoration: underline; }

    /* ── Skeleton ── */
    .sk {
      background: linear-gradient(90deg, var(--border) 25%, #2e2e2e 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .error {
      padding: 28px; color: #f87171;
      font-size: 0.875rem; text-align: center; line-height: 1.7;
    }
    .error code {
      display: block; margin-top: 8px;
      font-size: 0.72rem; color: var(--muted); word-break: break-all;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="banner" id="banner">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar-fallback sk" style="background:var(--border);"></div>
    </div>
  </div>
  <div class="body" id="body">
    <div class="sk" style="width:44%;height:22px;"></div>
    <div class="sk" style="width:62%;height:32px;margin-top:12px;border-radius:20px;display:inline-block;"></div>
    <div class="sk" style="width:52%;height:32px;margin-top:0;border-radius:20px;display:inline-block;margin-left:8px;"></div>
    <div class="sk" style="width:30%;height:13px;margin-top:24px;"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
      <div class="sk" style="width:90px;height:36px;border-radius:8px;margin:0;"></div>
      <div class="sk" style="width:110px;height:36px;border-radius:8px;margin:0;"></div>
      <div class="sk" style="width:80px;height:36px;border-radius:8px;margin:0;"></div>
    </div>
  </div>
</div>

<script>
(async () => {
  const DOMAIN  = 'zsoltsb.eu';
  const DITTO   = 'https://ditto.pub';
  const GRAVATAR_USER = 'zsoltsb'; // gravatar.com/zsoltsb

  const RELAYS = [
    'wss://relay.damus.io',
    'wss://relay.nostr.band',
    'wss://nos.lol',
    'wss://relay.primal.net',
    'wss://nostr.mom',
    'wss://ditto.pub',
    'wss://relay.snort.social',
  ];

  // ── Helpers ───────────────────────────────────────────────────────────────
  const esc = s => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function tickHtml(level, title) {
    // level: 'gold' | 'green' | null
    if (!level) return '';
    return `<span class="tick ${level}" title="${title}">
      <svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>
    </span>`;
  }

  function showError(msg, detail) {
    document.getElementById('body').innerHTML =
      `<div class="error">⚠️ Could not load profile.<br>${esc(msg)}${detail?`<code>${esc(detail)}</code>`:''}</div>`;
  }

  // ── Minimal bech32 encoder (npub) ─────────────────────────────────────────
  function hexToNpub(hex) {
    try {
      const CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      const convertbits = (data, from, to, pad) => {
        let acc = 0, bits = 0; const r = [];
        for (const v of data) {
          acc = (acc << from) | v; bits += from;
          while (bits >= to) { bits -= to; r.push((acc >> bits) & ((1<<to)-1)); }
        }
        if (pad && bits > 0) r.push((acc << (to-bits)) & ((1<<to)-1));
        return r;
      };
      const polymod = vals => {
        const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3]; let c=1;
        for (const v of vals) { const b=c>>25; c=((c&0x1ffffff)<<5)^v; for(let i=0;i<5;i++) if((b>>i)&1) c^=G[i]; }
        return c;
      };
      const hrpExpand = h => { const r=[]; for(const c of h) r.push(c.charCodeAt(0)>>5); r.push(0); for(const c of h) r.push(c.charCodeAt(0)&31); return r; };
      const checksum = (hrp, data) => { const v=hrpExpand(hrp).concat(data).concat([0,0,0,0,0,0]); const m=polymod(v)^1; const r=[]; for(let p=0;p<6;p++) r.push((m>>(5*(5-p)))&31); return r; };
      const bytes = hex.match(/.{1,2}/g).map(b=>parseInt(b,16));
      const data  = convertbits(bytes,8,5,true);
      const hrp   = 'npub';
      return hrp+'1'+data.concat(checksum(hrp,data)).map(d=>CHARSET[d]).join('');
    } catch { return null; }
  }

  // ── WebSocket relay query ─────────────────────────────────────────────────
  function queryRelay(url, pubkey) {
    return new Promise((resolve, reject) => {
      let done = false;
      let ws;
      try { ws = new WebSocket(url); } catch(e) { return reject(e); }
      const t = setTimeout(() => { if(!done){done=true;try{ws.close();}catch{}reject(new Error(`timeout:${url}`));} }, 7000);
      ws.onopen = () => ws.send(JSON.stringify(['REQ','p',{kinds:[0],authors:[pubkey],limit:1}]));
      ws.onmessage = e => {
        try {
          const m = JSON.parse(e.data);
          if (m[0]==='EVENT'&&m[1]==='p'&&m[2]?.kind===0&&!done) {
            done=true; clearTimeout(t); try{ws.close();}catch{}
            try { resolve({meta:JSON.parse(m[2].content), pubkey:m[2].pubkey}); }
            catch(pe){reject(pe);}
          } else if (m[0]==='EOSE'&&!done) {
            done=true; clearTimeout(t); try{ws.close();}catch{}
            reject(new Error(`no-event:${url}`));
          }
        } catch {}
      };
      ws.onerror = ()=>{ if(!done){done=true;clearTimeout(t);reject(new Error(`ws-err:${url}`));} };
      ws.onclose = ()=>{ if(!done){done=true;clearTimeout(t);reject(new Error(`ws-close:${url}`));} };
    });
  }

  // ── Fetch with timeout ────────────────────────────────────────────────────
  async function fetchJSON(url, ms=5000) {
    const r = await fetch(url, {signal: AbortSignal.timeout(ms)});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  // ── Step 1: Resolve pubkey via NIP-05 (same-origin, no CORS) ─────────────
  let pubkey = '';
  let nip05DomainMatch = false; // true = pubkey confirmed on OUR domain
  try {
    const j = await fetchJSON(`https://${DOMAIN}/.well-known/nostr.json?name=_`, 4000);
    const pk = j?.names?.['_'] || Object.values(j?.names||{})[0] || '';
    if (pk) { pubkey = pk; nip05DomainMatch = true; }
  } catch {}

  if (!pubkey) { showError('Could not resolve pubkey from NIP-05.'); return; }

  // ── Step 2: Race relays for kind:0 ───────────────────────────────────────
  let result;
  try {
    result = await Promise.any(RELAYS.map(r => queryRelay(r, pubkey)));
  } catch(agg) {
    showError('All relays failed.', agg?.errors?.map(e=>e.message).join(' | ') ?? String(agg));
    return;
  }

  const { meta } = result;
  const npub = hexToNpub(pubkey);

  // ── Step 3: Parallel validation ───────────────────────────────────────────

  // 3a. NIP-05 handle verification
  // Golden: pubkey in meta.nip05 matches our own /.well-known/nostr.json (already confirmed above)
  // Green:  meta.nip05 domain resolves externally (we skip re-fetching; same-origin already passed)
  const nip05 = meta.nip05 || `_@${DOMAIN}`;
  const displayHandle = nip05.startsWith('_@') ? nip05.slice(2) : nip05;
  // Check if the nip05 identifier's domain matches our own domain
  const nip05Domain = nip05.includes('@') ? nip05.split('@')[1] : '';
  const handleTickLevel = nip05DomainMatch && nip05Domain === DOMAIN ? 'gold'
    : nip05DomainMatch ? 'green'
    : null;
  const handleTickTitle = handleTickLevel === 'gold'
    ? 'Verified: pubkey confirmed in /.well-known/nostr.json on this domain'
    : 'Verified: NIP-05 identity confirmed';

  // 3b. Lightning address verification
  const lightning = meta.lud16 || meta.lud06 || '';
  let lnTickLevel = null;
  let lnTickTitle = '';
  if (lightning && lightning.includes('@')) {
    const [lnUser, lnDomain] = lightning.split('@');
    try {
      const lnJson = await fetchJSON(`https://${lnDomain}/.well-known/lnurlp/${lnUser}`, 5000);
      if (lnJson?.tag === 'payRequest' && lnJson?.callback) {
        // Golden if lightning domain matches our own domain (self-hosted wallet)
        // Green if it resolves on any external domain
        lnTickLevel = lnDomain === DOMAIN ? 'gold' : 'green';
        lnTickTitle = lnTickLevel === 'gold'
          ? 'Verified: Lightning address confirmed via /.well-known/lnurlp on this domain'
          : 'Verified: Lightning address resolves to a valid LNURL-pay endpoint';
      }
    } catch {}
  }

  // ── Step 4: Gravatar social links ─────────────────────────────────────────
  // Gravatar public API — no auth required for public profiles
  // Returns verified_accounts array with service_type, service_label, url
  let gravatarLinks = [];
  try {
    // Try slug-based endpoint first (public, no API key)
    const gData = await fetchJSON(`https://api.gravatar.com/v3/profiles/${GRAVATAR_USER}`, 6000);
    // verified_accounts is the array of verified social links
    const verified = gData?.verified_accounts || gData?.accounts || [];
    gravatarLinks = verified
      .filter(a => a?.url || a?.profile_url)
      .map(a => ({
        url:   a.url || a.profile_url,
        label: a.service_label || a.service_type || '',
        type:  (a.service_type || '').toLowerCase(),
      }));
  } catch {
    // Gravatar API may require auth; try legacy JSON endpoint as fallback
    try {
      const gLegacy = await fetchJSON(`https://www.gravatar.com/${GRAVATAR_USER}.json`, 6000);
      const accts = gLegacy?.entry?.[0]?.accounts || [];
      gravatarLinks = accts
        .filter(a => a?.url)
        .map(a => ({
          url:   a.url,
          label: a.display || a.shortname || a.domain || '',
          type:  (a.shortname || '').toLowerCase(),
        }));
    } catch {}
  }

  // ── Step 5: Platform icon mapping ─────────────────────────────────────────
  const PLATFORMS = [
    { key:'mastodon',   test: u => /mastodon|fosstodon|hachyderm|infosec\.exchange|social\.coop|techhub\.social|mstdn\./i.test(u), icon:'fa-brands fa-mastodon',   color:'#6364ff' },
    { key:'bluesky',    test: u => /bsky\.app|bsky\.social/i.test(u),                                                              icon:'fa-brands fa-bluesky',    color:'#0085ff' },
    { key:'instagram',  test: u => /instagram\.com/i.test(u),                                                                      icon:'fa-brands fa-instagram',  color:'#e1306c' },
    { key:'threads',    test: u => /threads\.net/i.test(u),                                                                        icon:'fa-brands fa-threads',    color:'#e8e8e8' },
    { key:'twitter',    test: u => /twitter\.com|x\.com/i.test(u),                                                                 icon:'fa-brands fa-x-twitter',  color:'#e8e8e8' },
    { key:'github',     test: u => /github\.com/i.test(u),                                                                         icon:'fa-brands fa-github',     color:'#e8e8e8' },
    { key:'youtube',    test: u => /youtube\.com|youtu\.be/i.test(u),                                                              icon:'fa-brands fa-youtube',    color:'#ff0000' },
    { key:'twitch',     test: u => /twitch\.tv/i.test(u),                                                                          icon:'fa-brands fa-twitch',     color:'#9146ff' },
    { key:'tiktok',     test: u => /tiktok\.com/i.test(u),                                                                         icon:'fa-brands fa-tiktok',     color:'#e8e8e8' },
    { key:'linkedin',   test: u => /linkedin\.com/i.test(u),                                                                       icon:'fa-brands fa-linkedin',   color:'#0a66c2' },
    { key:'facebook',   test: u => /facebook\.com|fb\.com/i.test(u),                                                               icon:'fa-brands fa-facebook',   color:'#1877f2' },
    { key:'reddit',     test: u => /reddit\.com/i.test(u),                                                                         icon:'fa-brands fa-reddit',     color:'#ff4500' },
    { key:'telegram',   test: u => /t\.me|telegram\.me/i.test(u),                                                                  icon:'fa-brands fa-telegram',   color:'#2ca5e0' },
    { key:'discord',    test: u => /discord\.gg|discord\.com/i.test(u),                                                            icon:'fa-brands fa-discord',    color:'#5865f2' },
    { key:'farcaster',  test: u => /warpcast\.com|farcaster\.xyz/i.test(u),                                                        icon:'fa-solid fa-circle-nodes',color:'#8a63d2' },
    { key:'nostr',      test: u => /nostr\.|njump\.me|snort\.social|primal\.net|ditto\.pub/i.test(u),                              icon:'fa-solid fa-bolt',        color:'#a78bfa' },
    { key:'substack',   test: u => /substack\.com/i.test(u),                                                                       icon:'fa-solid fa-newspaper',   color:'#ff6719' },
    { key:'medium',     test: u => /medium\.com/i.test(u),                                                                         icon:'fa-brands fa-medium',     color:'#e8e8e8' },
    { key:'tumblr',     test: u => /tumblr\.com/i.test(u),                                                                         icon:'fa-brands fa-tumblr',     color:'#35465c' },
    { key:'pinterest',  test: u => /pinterest\.com/i.test(u),                                                                      icon:'fa-brands fa-pinterest',  color:'#e60023' },
    { key:'spotify',    test: u => /spotify\.com/i.test(u),                                                                        icon:'fa-brands fa-spotify',    color:'#1db954' },
    { key:'soundcloud', test: u => /soundcloud\.com/i.test(u),                                                                     icon:'fa-brands fa-soundcloud', color:'#ff5500' },
    { key:'patreon',    test: u => /patreon\.com/i.test(u),                                                                        icon:'fa-brands fa-patreon',    color:'#ff424d' },
    { key:'ko-fi',      test: u => /ko-fi\.com/i.test(u),                                                                          icon:'fa-solid fa-mug-hot',     color:'#ff5e5b' },
    { key:'website',    test: () => false,                                                                                          icon:'fa-solid fa-globe',       color:'#888'    },
  ];

  function detectPlatform(url) {
    return PLATFORMS.find(p => p.test(url)) || PLATFORMS[PLATFORMS.length - 1];
  }

  // ── Step 6: Inject rel=me into <head> ─────────────────────────────────────
  for (const { url } of gravatarLinks) {
    const l = document.createElement('link');
    l.rel = 'me'; l.href = url;
    document.head.appendChild(l);
  }
  // Also inject Nostr profile link
  if (npub) {
    const l = document.createElement('link');
    l.rel = 'me'; l.href = `https://njump.me/${npub}`;
    document.head.appendChild(l);
  }

  // ── Step 7: Banner ────────────────────────────────────────────────────────
  const bannerUrl = meta.banner || '';
  const banner = document.getElementById('banner');
  if (bannerUrl) {
    const img = new Image();
    img.onload = () => {
      banner.style.backgroundImage    = `url(${bannerUrl})`;
      banner.style.backgroundSize     = 'cover';
      banner.style.backgroundPosition = 'center';
    };
    img.src = bannerUrl;
  }

  // ── Step 8: Avatar ────────────────────────────────────────────────────────
  const avatarUrl = meta.picture || '';
  const name      = meta.display_name || meta.name || DOMAIN;
  const avatarWrap = document.getElementById('avatarWrap');
  const makeFallback = n => {
    const d = document.createElement('div');
    d.className = 'avatar-fallback';
    d.textContent = (n||'?')[0].toUpperCase();
    return d;
  };
  if (avatarUrl) {
    const img = document.createElement('img');
    img.className = 'avatar-img';
    img.alt = name;
    img.onerror = () => img.replaceWith(makeFallback(name));
    img.src = avatarUrl;
    avatarWrap.replaceChildren(img);
  } else {
    avatarWrap.replaceChildren(makeFallback(name));
  }

  // ── Step 9: Social buttons HTML ───────────────────────────────────────────
  const nostrUri = npub ? `nostr:${npub}` : `https://njump.me/${nip05}`;

  let socialHtml = '';
  if (gravatarLinks.length) {
    const btns = gravatarLinks.map(({ url, label, type }) => {
      const p = PLATFORMS.find(pl => pl.key === type) || detectPlatform(url);
      const displayLabel = label || p.key;
      return `<a class="social-btn" href="${esc(url)}" target="_blank" rel="noopener me">
        <i class="${esc(p.icon)}" style="color:${esc(p.color)};"></i>
        ${esc(displayLabel)}
      </a>`;
    }).join('');
    socialHtml = `<div class="section-title">Find me on</div><div class="social-row">${btns}</div>`;
  }

  // ── Step 10: Render ───────────────────────────────────────────────────────
  document.getElementById('body').innerHTML = `
    <div class="display-name">${esc(name)}</div>

    <div class="pills">
      <a class="pill" href="${esc(nostrUri)}" title="Open in your Nostr client">
        @${esc(displayHandle)}
        ${tickHtml(handleTickLevel, handleTickTitle)}
      </a>

      ${lightning ? `<a class="pill" href="lightning:${esc(lightning)}" title="Pay via Lightning Network">
        ⚡ ${esc(lightning)}
        ${tickHtml(lnTickLevel, lnTickTitle)}
      </a>` : ''}
    </div>

    ${socialHtml}

    <a class="footer-link" href="${DITTO}/${esc(DOMAIN)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

})().catch(err => {
  document.getElementById('body').innerHTML =
    `<div class="error">⚠️ Unexpected error.<code>${err?.message ?? err}</code></div>`;
});
</script>
</body>
</html>
