<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zsoltsb.eu</title>

  <link rel="me" href="https://ditto.pub/zsoltsb.eu" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #1a1a1a;
      --border:   #2a2a2a;
      --accent:   #8b5cf6;
      --accent-2: #a78bfa;
      --text:     #e8e8e8;
      --muted:    #888;
      --gold:     #f59e0b;
      --green:    #34d399;
      --radius:   14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ── Banner ── */
    .banner {
      height: 160px;
      background: linear-gradient(135deg, #1e1040 0%, #2d1b69 50%, #1a0f3d 100%);
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: absolute;
      bottom: -48px;
      left: 24px;
    }
    .avatar-img, .avatar-fallback {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: 4px solid var(--surface);
      object-fit: cover;
      display: block;
    }
    .avatar-fallback {
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; font-weight: 700; color: #fff;
    }

    /* ── Body ── */
    .body { padding: 62px 24px 28px; }

    .display-name {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
    }

    /* ── Pills ── */
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(139,92,246,0.10);
      border: 1px solid rgba(139,92,246,0.28);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--accent-2);
      text-decoration: none;
      font-family: inherit;
      line-height: 1;
      transition: background 0.18s, border-color 0.18s;
    }
    .pill:hover {
      background: rgba(139,92,246,0.22);
      border-color: rgba(139,92,246,0.55);
    }

    /* ── Verification ticks ── */
    .tick {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px; height: 15px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: help;
    }
    .tick svg {
      width: 9px; height: 9px;
      fill: none;
      stroke: #0f0f0f;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .tick.gold  { background: var(--gold); }
    .tick.green { background: var(--green); }

    /* ── Footer ── */
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
    }
    .footer-link span { color: var(--accent-2); }
    .footer-link:hover span { text-decoration: underline; }

    /* ── Skeleton ── */
    .sk {
      background: linear-gradient(90deg, var(--border) 25%, #2e2e2e 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .error {
      padding: 28px; color: #f87171;
      font-size: 0.875rem; text-align: center; line-height: 1.7;
    }
    .error code {
      display: block; margin-top: 8px;
      font-size: 0.72rem; color: var(--muted); word-break: break-all;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="banner" id="banner">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar-fallback sk" style="background:var(--border);"></div>
    </div>
  </div>
  <div class="body" id="body">
    <div class="sk" style="width:44%;height:22px;"></div>
    <div class="sk" style="width:62%;height:32px;margin-top:12px;border-radius:20px;display:inline-block;"></div>
    <div class="sk" style="width:52%;height:32px;border-radius:20px;display:inline-block;margin-left:8px;"></div>
  </div>
</div>

<script>
(async () => {
  const DOMAIN = 'zsoltsb.eu';
  const DITTO  = 'https://ditto.pub';

  // Lightning address local part — hardcoded, known to be wallet@zsoltsb.eu
  const LN_USER   = 'wallet';
  const LN_DOMAIN = DOMAIN; // same domain = self-hosted

  const RELAYS = [
    'wss://relay.damus.io',
    'wss://relay.nostr.band',
    'wss://nos.lol',
    'wss://relay.primal.net',
    'wss://nostr.mom',
    'wss://relay.snort.social',
    'wss://ditto.pub',
  ];

  const DOH_RESOLVERS = [
    n => `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(n)}&type=TXT`,
    n => `https://dns.google/resolve?name=${encodeURIComponent(n)}&type=TXT`,
  ];

  // ── Helpers ───────────────────────────────────────────────────────────────
  const esc = s => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function tickHtml(level, title) {
    if (!level) return '';
    return `<span class="tick ${esc(level)}" title="${esc(title)}">
      <svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>
    </span>`;
  }

  function showError(msg, detail) {
    document.getElementById('body').innerHTML =
      `<div class="error">⚠️ Could not load profile.<br>${esc(msg)}${detail?`<code>${esc(detail)}</code>`:''}</div>`;
  }

  async function fetchJSON(url, ms = 5000) {
    const r = await fetch(url, { signal: AbortSignal.timeout(ms) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  // ── DNS-over-HTTPS TXT lookup ─────────────────────────────────────────────
  async function dohTxtLookup(hostname) {
    for (const resolver of DOH_RESOLVERS) {
      try {
        const data = await fetchJSON(resolver(hostname), 4000);
        const answers = (data?.Answer || []).filter(a => a.type === 16);
        if (answers.length) {
          return answers.map(a => String(a.data).replace(/^"|"$/g, '').trim());
        }
      } catch {}
    }
    return [];
  }

  // ── Minimal bech32 encoder → npub ─────────────────────────────────────────
  function hexToNpub(hex) {
    try {
      const CS = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      const cb = (d,f,t,p) => { let a=0,b=0,r=[]; for(const v of d){a=(a<<f)|v;b+=f;while(b>=t){b-=t;r.push((a>>b)&((1<<t)-1));}}if(p&&b>0)r.push((a<<(t-b))&((1<<t)-1));return r; };
      const pm = v => { const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const x of v){const b=c>>25;c=((c&0x1ffffff)<<5)^x;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c; };
      const he = h => { const r=[];for(const c of h)r.push(c.charCodeAt(0)>>5);r.push(0);for(const c of h)r.push(c.charCodeAt(0)&31);return r; };
      const cs = (h,d) => { const v=he(h).concat(d).concat([0,0,0,0,0,0]);const m=pm(v)^1;const r=[];for(let p=0;p<6;p++)r.push((m>>(5*(5-p)))&31);return r; };
      const bytes = hex.match(/.{1,2}/g).map(b=>parseInt(b,16));
      const data  = cb(bytes,8,5,true);
      const hrp   = 'npub';
      return hrp+'1'+data.concat(cs(hrp,data)).map(d=>CS[d]).join('');
    } catch { return null; }
  }

  // ── WebSocket relay query ─────────────────────────────────────────────────
  function queryRelay(url, pubkey) {
    return new Promise((resolve, reject) => {
      let done = false;
      let ws;
      try { ws = new WebSocket(url); } catch(e) { return reject(e); }
      const t = setTimeout(() => {
        if (!done) { done=true; try{ws.close();}catch{} reject(new Error(`timeout:${url}`)); }
      }, 7000);
      ws.onopen = () => ws.send(JSON.stringify(['REQ','p',{kinds:[0],authors:[pubkey],limit:1}]));
      ws.onmessage = e => {
        try {
          const m = JSON.parse(e.data);
          if (m[0]==='EVENT' && m[1]==='p' && m[2]?.kind===0 && !done) {
            done=true; clearTimeout(t); try{ws.close();}catch{}
            try { resolve({ meta: JSON.parse(m[2].content), pubkey: m[2].pubkey }); }
            catch(pe) { reject(pe); }
          } else if (m[0]==='EOSE' && !done) {
            done=true; clearTimeout(t); try{ws.close();}catch{}
            reject(new Error(`no-event:${url}`));
          }
        } catch {}
      };
      ws.onerror = () => { if(!done){done=true;clearTimeout(t);reject(new Error(`ws-err:${url}`));} };
      ws.onclose = () => { if(!done){done=true;clearTimeout(t);reject(new Error(`ws-close:${url}`));} };
    });
  }

  // ═════════════════════════════════════════════════════════════════════════
  // MAIN
  // ═════════════════════════════════════════════════════════════════════════

  // ── 1. Resolve pubkey via same-origin /.well-known/nostr.json ─────────────
  let pubkey = '';
  let wellKnownNostrOk = false;
  try {
    const j = await fetchJSON(`https://${DOMAIN}/.well-known/nostr.json?name=_`, 4000);
    const pk = j?.names?.['_'] || Object.values(j?.names || {})[0] || '';
    if (pk) { pubkey = pk; wellKnownNostrOk = true; }
  } catch {}

  if (!pubkey) { showError('Could not resolve pubkey from NIP-05.'); return; }

  // ── 2. Race relays for kind:0 ─────────────────────────────────────────────
  let result;
  try {
    result = await Promise.any(RELAYS.map(r => queryRelay(r, pubkey)));
  } catch(agg) {
    showError('All relays failed.', agg?.errors?.map(e=>e.message).join(' | ') ?? String(agg));
    return;
  }

  const { meta } = result;
  const npub = hexToNpub(pubkey);
  const nip05 = meta.nip05 || `_@${DOMAIN}`;
  const nip05Domain = nip05.includes('@') ? nip05.split('@')[1] : '';
  const displayHandle = nip05.startsWith('_@') ? nip05.slice(2) : nip05;

  // ── 3. All verification checks in parallel ────────────────────────────────

  // 3a. DNS TXT for NIP-05 — check _nostr.zsoltsb.eu and _nip05.zsoltsb.eu
  //     for a record containing the hex pubkey or npub <kcite ref="1"/>
  const dnsNostrPromise = (async () => {
    const npubVal = npub || '';
    for (const name of [`_nostr.${DOMAIN}`, `_nip05.${DOMAIN}`, DOMAIN]) {
      try {
        const txts = await dohTxtLookup(name);
        if (txts.some(t => t.includes(pubkey) || (npubVal && t.includes(npubVal)))) {
          return true;
        }
      } catch {}
    }
    return false;
  })();

  // 3b. DNS TXT for Lightning — check _lnurlp.zsoltsb.eu
  //     Standard: TXT value contains lnurlp= or the username <kcite ref="2"/>
  const dnsLnPromise = (async () => {
    try {
      const txts = await dohTxtLookup(`_lnurlp.${LN_DOMAIN}`);
      return txts.some(t =>
        t.includes(LN_USER) ||
        t.toLowerCase().includes('lnurlp') ||
        t.toLowerCase().includes('lightning')
      );
    } catch { return false; }
  })();

  // 3c. LNURL-pay well-known — hardcoded to wallet@zsoltsb.eu
  //     This is self-hosted (LN_DOMAIN === DOMAIN) so always golden if it resolves
  const lnWellKnownPromise = (async () => {
    try {
      const j = await fetchJSON(
        `https://${LN_DOMAIN}/.well-known/lnurlp/${LN_USER}`, 5000
      );
      return j?.tag === 'payRequest' && !!j?.callback;
    } catch { return false; }
  })();

  const [dnsNostrOk, dnsLnOk, lnWellKnownOk] = await Promise.all([
    dnsNostrPromise,
    dnsLnPromise,
    lnWellKnownPromise,
  ]);

  // ── 4. Determine tick levels ──────────────────────────────────────────────
  //
  // Priority rule: file present (self-hosted) = golden, always.
  // DNS TXT is additive — it adds detail to the tooltip but cannot downgrade.
  // External-only (no self-hosted file) = green.
  //
  // Handle:
  //   Golden = /.well-known/nostr.json present on own domain AND nip05 domain matches
  //   Green  = relay-confirmed only (no self-hosted file)
  let handleTickLevel = null;
  let handleTickTitle = '';

  if (wellKnownNostrOk && nip05Domain === DOMAIN) {
    handleTickLevel = 'gold';
    const parts = ['/.well-known/nostr.json ✓'];
    if (dnsNostrOk) parts.push('DNS TXT record ✓');
    handleTickTitle = 'Verified: ' + parts.join('  ');
  } else if (wellKnownNostrOk) {
    handleTickLevel = 'gold';
    handleTickTitle = 'Verified: pubkey confirmed in /.well-known/nostr.json ✓';
  } else {
    handleTickLevel = 'green';
    handleTickTitle = 'Verified: NIP-05 identity confirmed via relay';
  }

  // Lightning:
  //   Golden = /.well-known/lnurlp/wallet resolves (self-hosted, LN_DOMAIN === DOMAIN)
  //            DNS TXT adds to tooltip only
  //   No tick = file doesn't resolve
  let lnTickLevel = null;
  let lnTickTitle = '';

  if (lnWellKnownOk) {
    // LN_DOMAIN === DOMAIN is always true here (hardcoded), so always golden
    lnTickLevel = 'gold';
    const parts = ['/.well-known/lnurlp ✓'];
    if (dnsLnOk) parts.push('DNS TXT _lnurlp record ✓');
    lnTickTitle = 'Verified: ' + parts.join('  ');
  }

  // ── 5. Inject rel=me into <head> ──────────────────────────────────────────
  if (npub) {
    const l = document.createElement('link');
    l.rel = 'me'; l.href = `https://njump.me/${npub}`;
    document.head.appendChild(l);
  }

  // ── 6. Banner ─────────────────────────────────────────────────────────────
  const bannerUrl = meta.banner || '';
  if (bannerUrl) {
    const img = new Image();
    img.onload = () => {
      const b = document.getElementById('banner');
      b.style.backgroundImage    = `url(${bannerUrl})`;
      b.style.backgroundSize     = 'cover';
      b.style.backgroundPosition = 'center';
    };
    img.src = bannerUrl;
  }

  // ── 7. Avatar ─────────────────────────────────────────────────────────────
  const avatarUrl = meta.picture || '';
  const name      = meta.display_name || meta.name || DOMAIN;
  const avatarWrap = document.getElementById('avatarWrap');
  const makeFallback = n => {
    const d = document.createElement('div');
    d.className = 'avatar-fallback';
    d.textContent = (n || '?')[0].toUpperCase();
    return d;
  };
  if (avatarUrl) {
    const img = document.createElement('img');
    img.className = 'avatar-img'; img.alt = name;
    img.onerror = () => img.replaceWith(makeFallback(name));
    img.src = avatarUrl;
    avatarWrap.replaceChildren(img);
  } else {
    avatarWrap.replaceChildren(makeFallback(name));
  }

  // ── 8. Render ─────────────────────────────────────────────────────────────
  const nostrUri = npub ? `nostr:${npub}` : `https://njump.me/${nip05}`;
  const lightning = `${LN_USER}@${LN_DOMAIN}`;

  document.getElementById('body').innerHTML = `
    <div class="display-name">${esc(name)}</div>

    <div class="pills">
      <a class="pill" href="${esc(nostrUri)}" title="Open in your Nostr client">
        @${esc(displayHandle)}
        ${tickHtml(handleTickLevel, handleTickTitle)}
      </a>

      <a class="pill" href="lightning:${esc(lightning)}" title="Pay via Lightning Network">
        ⚡ ${esc(lightning)}
        ${tickHtml(lnTickLevel, lnTickTitle)}
      </a>
    </div>

    <a class="footer-link" href="${DITTO}/${esc(DOMAIN)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

})().catch(err => {
  document.getElementById('body').innerHTML =
    `<div class="error">⚠️ Unexpected error.<code>${err?.message ?? err}</code></div>`;
});
</script>
</body>
</html>
