  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />

    crossorigin="anonymous"

  />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
      --accent:  #8b5cf6; --accent2: #a78bfa; --text: #e8e8e8;
      --muted:   #888;    --gold: #f59e0b;     --green: #34d399;
      --r: 14px;
      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 40px 16px 80px;
    }
    .card {
      width: 100%; max-width: 600px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r); overflow: hidden;
    }

    /* ── Banner ── */
    .banner {
      height: 160px; position: relative;
      background: linear-gradient(135deg,#1e1040 0%,#2d1b69 50%,#1a0f3d 100%);
      background-size: cover; background-position: center;
    }
    .banner-tick { position: absolute; bottom: 8px; right: 10px; }
    .avatar-wrap { position: absolute; bottom: -48px; left: 24px; }
    .avatar-img, .avatar-fb {
      width: 96px; height: 96px; border-radius: 50%;
      border: 4px solid var(--surface); display: block;
    }
    .avatar-img { object-fit: cover; }
    .avatar-fb {
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; font-size: 2.4rem; font-weight: 700; color: #fff;
    }
    .avatar-tick { position: absolute; bottom: 2px; right: 2px; }

    /* ── Body ── */
    .body { padding: 62px 24px 28px; }
    .display-name { font-size: 1.35rem; font-weight: 700; color: var(--text); }

    /* ── Pill rows ── */
    .pill-row {
      display: flex; align-items: center; gap: 8px; margin-top: 10px;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(139,92,246,.10); border: 1px solid rgba(139,92,246,.28);
      border-radius: 20px; padding: 6px 14px; font-size: .8rem;
      color: var(--accent2); text-decoration: none; font-family: inherit;
      line-height: 1; transition: background .18s, border-color .18s; white-space: nowrap;
    }
    .pill:hover { background: rgba(139,92,246,.22); border-color: rgba(139,92,246,.55); }

    /* ── Dropdown buttons ── */
    .dropdown { position: relative; margin-left: auto; flex-shrink: 0; }
    .dropdown-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.05); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 12px; font-size: .78rem;
      color: var(--muted); font-family: inherit; cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap; user-select: none;
    }
    .dropdown-btn:hover { background: rgba(255,255,255,.09); border-color: #444; color: var(--text); }
    .dropdown-btn .chevron { font-size: .6rem; transition: transform .2s; display: inline-block; }
    .dropdown.open .chevron { transform: rotate(180deg); }
    .dropdown-menu {
      display: none; position: absolute; right: 0; top: calc(100% + 6px);
      background: #222; border: 1px solid var(--border); border-radius: 10px;
      min-width: 200px; z-index: 100; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .dropdown.open .dropdown-menu { display: block; }
    .dropdown-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; font-size: .82rem; color: var(--text);
      text-decoration: none; transition: background .12s;
    }
    .dropdown-item:hover { background: rgba(139,92,246,.12); }
    .dropdown-item .di-icon {
      width: 22px; text-align: center; font-size: 1rem; color: var(--accent2); flex-shrink: 0;
    }
    .dropdown-item .di-label { flex: 1; }

    /* ── Tick badges ── */
    .tick {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0; cursor: help;
    }
    .tick svg { width: 9px; height: 9px; }
    .tick.gold  { background: var(--gold); }
    .tick.green { background: var(--green); }
    .tick.lg    { width: 20px; height: 20px; box-shadow: 0 0 0 2px var(--surface); }
    .tick.lg svg { width: 11px; height: 11px; }

    /* ── Social sections ── */
    .section-title {
      font-size: .68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .09em; color: var(--muted); margin-top: 24px; margin-bottom: 10px;
    }
    .social-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .social-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); text-decoration: none; font-size: 1.15rem;
      transition: background .15s, border-color .15s, color .15s, transform .1s;
    }
    .social-btn:hover {
      background: rgba(139,92,246,.10); border-color: var(--accent);
      color: var(--accent2); transform: translateY(-2px);
    }

    /* ── Footer ── */
    .footer-link {
      display: block; text-align: center; margin-top: 26px; padding-top: 18px;
      border-top: 1px solid var(--border); font-size: .78rem;
      color: var(--muted); text-decoration: none;
    }
    .footer-link span { color: var(--accent2); }
    .footer-link:hover span { text-decoration: underline; }

    /* ── Skeleton ── */
    .sk {
      background: linear-gradient(90deg,var(--border) 25%,#2e2e2e 50%,var(--border) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }
    .error { padding: 28px; color: #f87171; font-size: .875rem; text-align: center; line-height: 1.7; }
    .error code { display: block; margin-top: 8px; font-size: .72rem; color: var(--muted); word-break: break-all; }
  </style>
</head>
<body>

<script>
void (async () => {

  // ═══════════════════════════════════════════════════════════════════════════
  // CONFIG
  // ═══════════════════════════════════════════════════════════════════════════
  const DOMAIN        = 'zsoltsb.eu';
  const DITTO_URL     = 'https://ditto.pub';
  const LN_USER       = 'wallet';
  const LN_DOMAIN     = DOMAIN;
  const GRAVATAR_SLUG = 'zsoltsb';

  const AUTHORITY_RELAY = 'wss://relay.ditto.pub';
  const OPENVIBE_RELAYS = [
    'wss://relay.damus.io','wss://relay.nostr.band','wss://nos.lol',
    'wss://relay.primal.net','wss://nostr.wine','wss://relay.snort.social',
    'wss://purplepag.es','wss://relay.nos.social',
  ];
  const EXTRA_RELAYS = [
    'wss://nostr.mom','wss://relay.nostr.bg','wss://nostr.oxtr.dev',
  ];
  const DOH_RESOLVERS = [
    n => `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(n)}&type=TXT`,
    n => `https://dns.google/resolve?name=${encodeURIComponent(n)}&type=TXT`,
  ];

  // ── Service classification sets ──────────────────────────────────────────
  // Messaging: shown only in "Drop me a line" dropdown
  const MESSAGING_KEYS = new Set([
    'whatsapp','telegram','signal','messenger','wechat','line','viber',
    'skype','discord','slack','matrix','xmpp','imessage','sms','kik',
    'snapchat','kakaotalk','zalo','imo','threema','wire','session',
    'element','rocketchat','mattermost','teams','hangouts','gchat',
  ]);

  // Payment: shown only in "Drop me a dime" dropdown
  const PAYMENT_KEYS = new Set([
    'paypal','venmo','cashapp','cash-app','cash app','patreon','ko-fi','kofi',
    'buymeacoffee','buy-me-a-coffee','liberapay','opencollective','open-collective',
    'bitcoin','ethereum','litecoin','dogecoin','monero','solana','cardano',
    'stripe','gofundme','zelle','revolut','wise','transferwise',
    'crypto','cryptocurrency','wallet',
  ]);

  // ── Icon map ─────────────────────────────────────────────────────────────
  const ICON_MAP = {
    'twitter':          { fa: 'fa-brands fa-x-twitter',      si: 'x' },
    'x':                { fa: 'fa-brands fa-x-twitter',      si: 'x' },
    'x-twitter':        { fa: 'fa-brands fa-x-twitter',      si: 'x' },
    'mastodon':         { fa: 'fa-brands fa-mastodon',        si: 'mastodon' },
    'bluesky':          { fa: 'fa-brands fa-bluesky',         si: 'bluesky' },
    'instagram':        { fa: 'fa-brands fa-instagram',       si: 'instagram' },
    'threads':          { fa: 'fa-brands fa-threads',         si: 'threads' },
    'facebook':         { fa: 'fa-brands fa-facebook',        si: 'facebook' },
    'linkedin':         { fa: 'fa-brands fa-linkedin',        si: 'linkedin' },
    'tumblr':           { fa: 'fa-brands fa-tumblr',          si: 'tumblr' },
    'pinterest':        { fa: 'fa-brands fa-pinterest',       si: 'pinterest' },
    'reddit':           { fa: 'fa-brands fa-reddit',          si: 'reddit' },
    'tiktok':           { fa: 'fa-brands fa-tiktok',          si: 'tiktok' },
    'vk':               { fa: 'fa-brands fa-vk',              si: 'vk' },
    'github':           { fa: 'fa-brands fa-github',          si: 'github' },
    'gitlab':           { fa: 'fa-brands fa-gitlab',          si: 'gitlab' },
    'bitbucket':        { fa: 'fa-brands fa-bitbucket',       si: 'bitbucket' },
    'codeberg':         { fa: null,                           si: 'codeberg' },
    'sourcehut':        { fa: null,                           si: 'sourcehut' },
    'stackoverflow':    { fa: 'fa-brands fa-stack-overflow',  si: 'stackoverflow' },
    'hackernews':       { fa: 'fa-brands fa-hacker-news',     si: 'ycombinator' },
    'dev':              { fa: 'fa-brands fa-dev',             si: 'devdotto' },
    'devto':            { fa: 'fa-brands fa-dev',             si: 'devdotto' },
    'codepen':          { fa: 'fa-brands fa-codepen',         si: 'codepen' },
    'npm':              { fa: 'fa-brands fa-npm',             si: 'npm' },
    'docker':           { fa: 'fa-brands fa-docker',          si: 'docker' },
    'youtube':          { fa: 'fa-brands fa-youtube',         si: 'youtube' },
    'twitch':           { fa: 'fa-brands fa-twitch',          si: 'twitch' },
    'vimeo':            { fa: 'fa-brands fa-vimeo',           si: 'vimeo' },
    'kick':             { fa: null,                           si: 'kick' },
    'soundcloud':       { fa: 'fa-brands fa-soundcloud',      si: 'soundcloud' },
    'spotify':          { fa: 'fa-brands fa-spotify',         si: 'spotify' },
    'bandcamp':         { fa: 'fa-brands fa-bandcamp',        si: 'bandcamp' },
    'lastfm':           { fa: 'fa-brands fa-lastfm',          si: 'lastfm' },
    'applemusic':       { fa: null,                           si: 'applemusic' },
    'medium':           { fa: 'fa-brands fa-medium',          si: 'medium' },
    'substack':         { fa: null,                           si: 'substack' },
    'wordpress':        { fa: 'fa-brands fa-wordpress',       si: 'wordpress' },
    'ghost':            { fa: null,                           si: 'ghost' },
    'hashnode':         { fa: null,                           si: 'hashnode' },
    'goodreads':        { fa: 'fa-brands fa-goodreads',       si: 'goodreads' },
    'behance':          { fa: 'fa-brands fa-behance',         si: 'behance' },
    'dribbble':         { fa: 'fa-brands fa-dribbble',        si: 'dribbble' },
    'flickr':           { fa: 'fa-brands fa-flickr',          si: 'flickr' },
    'deviantart':       { fa: 'fa-brands fa-deviantart',      si: 'deviantart' },
    '500px':            { fa: 'fa-brands fa-500px',           si: '500px' },
    'artstation':       { fa: null,                           si: 'artstation' },
    'unsplash':         { fa: null,                           si: 'unsplash' },
    'farcaster':        { fa: null,                           si: 'farcaster' },
    'nostr':            { fa: 'fa-solid fa-bolt',             si: null },
    'strava':           { fa: 'fa-brands fa-strava',          si: 'strava' },
    'steam':            { fa: 'fa-brands fa-steam',           si: 'steam' },
    // Messaging
    'telegram':         { fa: 'fa-brands fa-telegram',        si: 'telegram' },
    'whatsapp':         { fa: 'fa-brands fa-whatsapp',        si: 'whatsapp' },
    'signal':           { fa: null,                           si: 'signal' },
    'discord':          { fa: 'fa-brands fa-discord',         si: 'discord' },
    'slack':            { fa: 'fa-brands fa-slack',           si: 'slack' },
    'matrix':           { fa: null,                           si: 'matrix' },
    'skype':            { fa: 'fa-brands fa-skype',           si: 'skype' },
    // Payment
    'paypal':           { fa: 'fa-brands fa-paypal',          si: 'paypal' },
    'venmo':            { fa: null,                           si: 'venmo' },
    'cashapp':          { fa: null,                           si: 'cashapp' },
    'patreon':          { fa: 'fa-brands fa-patreon',         si: 'patreon' },
    'ko-fi':            { fa: null,                           si: 'kofi' },
    'kofi':             { fa: null,                           si: 'kofi' },
    'buymeacoffee':     { fa: null,                           si: 'buymeacoffee' },
    'opencollective':   { fa: 'fa-brands fa-opencollective',  si: 'opencollective' },
    'liberapay':        { fa: null,                           si: 'liberapay' },
    'bitcoin':          { fa: 'fa-brands fa-bitcoin',         si: 'bitcoin' },
    'ethereum':         { fa: null,                           si: 'ethereum' },
    'linktree':         { fa: null,                           si: 'linktree' },
    '_default':         { fa: 'fa-solid fa-link',             si: null },
  };

  const normaliseKey = s =>
    (s || '').toLowerCase().replace(/[\s_]+/g, '-').replace(/[^a-z0-9-]/g, '');

  const resolveIcon = (serviceType, url) => {
    const key = normaliseKey(serviceType);
    if (ICON_MAP[key]) return ICON_MAP[key];
    try {
      const host = new URL(url).hostname.replace(/^www\./, '').replace(/\.[^.]+$/, '');
      const hkey = normaliseKey(host);
      if (ICON_MAP[hkey]) return ICON_MAP[hkey];
      for (const [k, v] of Object.entries(ICON_MAP)) {
        if (k !== '_default' && (hkey.includes(k) || k.includes(hkey))) return v;
      }
    } catch {}
    return ICON_MAP['_default'];
  };

  // Friendly display name for payment providers
  const PAYMENT_LABELS = {
    'paypal': 'PayPal', 'venmo': 'Venmo', 'cashapp': 'Cash App',
    'cash-app': 'Cash App', 'patreon': 'Patreon', 'ko-fi': 'Ko-fi',
    'kofi': 'Ko-fi', 'buymeacoffee': 'Buy Me a Coffee',
    'buy-me-a-coffee': 'Buy Me a Coffee', 'liberapay': 'Liberapay',
    'opencollective': 'Open Collective', 'open-collective': 'Open Collective',
    'bitcoin': 'Bitcoin', 'ethereum': 'Ethereum', 'stripe': 'Stripe',
    'gofundme': 'GoFundMe', 'zelle': 'Zelle', 'revolut': 'Revolut',
    'wise': 'Wise',
  };

  const paymentLabel = (serviceType, fallback) => {
    const key = normaliseKey(serviceType);
    return PAYMENT_LABELS[key] || fallback || serviceType;
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // HELPERS
  // ═══════════════════════════════════════════════════════════════════════════
  const esc = s => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const tickHtml = (level, title, large = false) => !level ? '' :
    `<span class="tick${large?' lg':''} ${esc(level)}" title="${esc(title)}">
       <svg viewBox="0 0 10 10" fill="none" stroke="#0f0f0f" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
         <polyline points="1.5,5 4,7.5 8.5,2.5"/>
       </svg>
     </span>`;

  const fetchJSON = async (url, ms = 5000) => {
    const r = await fetch(url, { signal: AbortSignal.timeout(ms) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };

  const fetchJSONP = (url, cbParam = 'callback', ms = 8000) =>
    new Promise((resolve, reject) => {
      const name = '__gjp_' + Math.random().toString(36).slice(2);
      const timer = setTimeout(() => { cleanup(); reject(new Error('jsonp-timeout')); }, ms);
      const script = document.createElement('script');
      const cleanup = () => { clearTimeout(timer); delete window[name]; script.remove(); };
      window[name] = data => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('jsonp-error')); };
      script.src = `${url}${url.includes('?')?'&':'?'}${cbParam}=${name}`;
      document.head.appendChild(script);
    });

  const dohTxtLookup = async hostname => {
    for (const resolver of DOH_RESOLVERS) {
      try {
        const data = await fetchJSON(resolver(hostname), 4000);
        const answers = (data?.Answer || []).filter(a => a.type === 16);
        if (answers.length)
          return answers.map(a => String(a.data).replace(/^"|"$/g,'').trim());
      } catch {}
    }
    return [];
  };

  const hexToNpub = hex => {
    try {
      const CS='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      const cb=(d,f,t,p)=>{let a=0,b=0,r=[];for(const v of d){a=(a<<f)|v;b+=f;while(b>=t){b-=t;r.push((a>>b)&((1<<t)-1));}}if(p&&b>0)r.push((a<<(t-b))&((1<<t)-1));return r;};
      const pm=v=>{const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const x of v){const b=c>>25;c=((c&0x1ffffff)<<5)^x;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c;};
      const he=h=>{const r=[];for(const c of h)r.push(c.charCodeAt(0)>>5);r.push(0);for(const c of h)r.push(c.charCodeAt(0)&31);return r;};
      const cs=(h,d)=>{const v=he(h).concat(d).concat([0,0,0,0,0,0]);const m=pm(v)^1;const r=[];for(let p=0;p<6;p++)r.push((m>>(5*(5-p)))&31);return r;};
      const bytes=hex.match(/.{1,2}/g).map(b=>parseInt(b,16));
      const data=cb(bytes,8,5,true);
      const hrp='npub';
      return hrp+'1'+data.concat(cs(hrp,data)).map(d=>CS[d]).join('');
    } catch { return null; }
  };

  const checkMediaHost = (() => {
    let p = null;
    const get = () => {
      if (!p) p = fetchJSON(`https://${DOMAIN}/.well-known/media-servers.json`, 4000)
        .then(j => {
          const raw = Array.isArray(j) ? j : (j?.servers || j?.media_servers || []);
          return raw.map(s => { try { return new URL(s).hostname.toLowerCase(); } catch { return null; } }).filter(Boolean);
        }).catch(() => []);
      return p;
    };
    return async url => {
      if (!url) return null;
      let h; try { h = new URL(url).hostname.toLowerCase(); } catch { return null; }
      if (h === DOMAIN || h.endsWith(`.${DOMAIN}`)) return 'gold';
      const t = await get();
      if (t.some(x => h === x || h.endsWith(`.${x}`))) return 'green';
      return null;
    };
  })();

  // ═══════════════════════════════════════════════════════════════════════════
  // RELAY SYSTEM
  // ═══════════════════════════════════════════════════════════════════════════
  const fetchFromRelay = (wsUrl, pubkey, timeoutMs = 8000) =>
    new Promise((resolve, reject) => {
      let done = false; let ws;
      try { ws = new WebSocket(wsUrl); } catch(e) { return reject(e); }
      const fail = r => { if (!done) { done = true; try { ws.close(); } catch {} reject(new Error(r)); } };
      const timer = setTimeout(() => fail(`timeout:${wsUrl}`), timeoutMs);
      ws.onopen = () => ws.send(JSON.stringify(['REQ','s',{kinds:[0],authors:[pubkey],limit:1}]));
      ws.onmessage = e => {
        try {
          const m = JSON.parse(e.data);
          if (m[0]==='EVENT' && m[1]==='s' && m[2]?.kind===0 && !done) {
            done = true; clearTimeout(timer); try { ws.close(); } catch {}
            resolve({ meta: JSON.parse(m[2].content), relay: wsUrl });
          } else if (m[0]==='EOSE' && !done) { fail(`eose-empty:${wsUrl}`); }
        } catch {}
      };
      ws.onerror = () => fail(`ws-err:${wsUrl}`);
      ws.onclose = () => { if (!done) fail(`ws-close:${wsUrl}`); };
    });

  const metaConsistent = (a, b) =>
    ['name','display_name','picture','banner','nip05','lud16','lud06']
      .every(f => (a[f] ?? '') === (b[f] ?? ''));

  const fetchNostrMeta = async (pubkey, relayHints) => {
    const others = [...new Set([
      ...relayHints.filter(r => r !== AUTHORITY_RELAY),
      ...OPENVIBE_RELAYS, ...EXTRA_RELAYS,
    ])].filter(r => r !== AUTHORITY_RELAY);

    let authorityResult = null;
    const authorityPromise = fetchFromRelay(AUTHORITY_RELAY, pubkey, 9000)
      .then(r => { authorityResult = r; return r; })
      .catch(e => { console.warn('[relay] authority failed:', e.message); return null; });

    await new Promise(r => setTimeout(r, 200));
    const otherPromises = others.map(url => fetchFromRelay(url, pubkey, 8000).catch(() => null));
    await authorityPromise;

    if (authorityResult) {
      Promise.allSettled(otherPromises).then(results => {
        let ok = 0, bad = 0;
        for (const r of results) {
          if (r.status === 'fulfilled' && r.value) {
            if (metaConsistent(authorityResult.meta, r.value.meta)) ok++;
            else { bad++; console.warn(`[relay] inconsistent: ${r.value.relay}`); }
          }
        }
        console.log(`[relay] cross-check: ${ok} consistent, ${bad} inconsistent`);
      });
      return authorityResult;
    }
    const fallback = await Promise.any(
      otherPromises.map(p => p.then(r => r ? r : Promise.reject()))
    ).catch(() => null);
    if (fallback) return fallback;
    throw new Error('All relays failed');
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // GRAVATAR — parse accounts into three buckets: social, messaging, payment
  // ═══════════════════════════════════════════════════════════════════════════
  const classifyAccount = a => {
    const key = normaliseKey(a.service_type || a.shortname || '');
    // Also try to match against URL hostname for payment detection
    let urlKey = '';
    try {
      urlKey = normaliseKey(
        new URL(a.url || a.profile_url || '').hostname
          .replace(/^www\./, '').replace(/\.[^.]+$/, '')
      );
    } catch {}

    if (PAYMENT_KEYS.has(key) || PAYMENT_KEYS.has(urlKey)) return 'payment';
    if (MESSAGING_KEYS.has(key) || MESSAGING_KEYS.has(urlKey)) return 'messaging';
    return 'social';
  };

  const fetchGravatarData = async () => {
    const legacyUrl = `https://gravatar.com/${GRAVATAR_SLUG}.json`;
    let entry = null;

    // Try JSONP first (bypasses CORS)
    try {
      const d = await fetchJSONP(legacyUrl);
      entry = d?.entry?.[0];
      if (entry) console.log('[gravatar] jsonp ✓');
    } catch(e) { console.warn('[gravatar] jsonp:', e.message); }

    // Fallback: direct fetch
    if (!entry) {
      try {
        const d = await fetchJSON(legacyUrl, 6000);
        entry = d?.entry?.[0];
        if (entry) console.log('[gravatar] direct ✓');
      } catch(e) { console.warn('[gravatar] direct:', e.message); }
    }

    if (!entry) return { social: [], messaging: [], payment: [] };

    // Normalise all accounts
    const rawAccounts = (entry.accounts || [])
      .filter(a => (a?.url || a?.profile_url || '').trim())
      .map(a => ({
        url:         (a.url || a.profile_url || '').trim(),
        label:       a.service_label || a.display || a.shortname || '',
        serviceType: normaliseKey(a.service_type || a.shortname || ''),
        rawType:     a.service_type || a.shortname || '',
      }));

    // Also check for crypto_wallet_addresses (newer Gravatar REST API field
    // sometimes present in legacy JSON too)
    const cryptoWallets = (entry.crypto_wallet_addresses || []).map(w => ({
      url:         w.address || '',
      label:       w.label || w.currency || 'Crypto',
      serviceType: normaliseKey(w.label || w.currency || 'crypto'),
      rawType:     w.label || w.currency || 'crypto',
      isCrypto:    true,
    }));

    // Combine and classify
    const allAccounts = [...rawAccounts, ...cryptoWallets];
    const social    = allAccounts.filter(a => classifyAccount(a) === 'social');
    const messaging = allAccounts.filter(a => classifyAccount(a) === 'messaging');
    const payment   = allAccounts.filter(a => classifyAccount(a) === 'payment');

    console.log(`[gravatar] social:${social.length} messaging:${messaging.length} payment:${payment.length}`);
    return { social, messaging, payment };
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // MAIN
  // ═══════════════════════════════════════════════════════════════════════════

  // 1. Resolve pubkey
  let pubkey = '', wellKnownNostrOk = false, relayHints = [];
  try {
    const j = await fetchJSON(`https://${DOMAIN}/.well-known/nostr.json?name=_`, 4000);
    const pk = j?.names?.['_'] || Object.values(j?.names || {})[0] || '';
    if (pk) { pubkey = pk; wellKnownNostrOk = true; relayHints = j?.relays?.[pk] || []; }
  } catch {}
  if (!pubkey) {
    document.getElementById('body').innerHTML =
      '<div class="error">⚠️ Could not resolve pubkey from NIP-05.</div>';
    return;
  }

  // 2. Parallel: Nostr meta + Gravatar
  const metaPromise     = fetchNostrMeta(pubkey, relayHints);
  const gravatarPromise = fetchGravatarData();

  // 3. Await Nostr meta
  let result;
  try { result = await metaPromise; }
  catch(e) {
    document.getElementById('body').innerHTML =
      `<div class="error">⚠️ All relays failed.<code>${esc(e.message)}</code></div>`;
    return;
  }

  const { meta } = result;
  const npub          = hexToNpub(pubkey);
  const nip05         = meta.nip05 || `_@${DOMAIN}`;
  const nip05Domain   = nip05.includes('@') ? nip05.split('@')[1] : '';
  const displayHandle = nip05.startsWith('_@') ? nip05.slice(2) : nip05;

  // 4. Verification + Gravatar in parallel
  const [
    dnsNostrOk, dnsLnOk, lnWellKnownOk,
    avatarMediaLevel, bannerMediaLevel,
    gravatarData,
  ] = await Promise.all([
    (async () => {
      for (const name of [`_nostr.${DOMAIN}`, `_nip05.${DOMAIN}`, DOMAIN]) {
        try {
          const txts = await dohTxtLookup(name);
          if (txts.some(t => t.includes(pubkey) || (npub && t.includes(npub)))) return true;
        } catch {}
      }
      return false;
    })(),
    (async () => {
      try {
        const txts = await dohTxtLookup(`_lnurlp.${LN_DOMAIN}`);
        return txts.some(t =>
          t.includes(LN_USER) || t.toLowerCase().includes('lnurlp') || t.toLowerCase().includes('lightning')
        );
      } catch { return false; }
    })(),
    (async () => {
      try {
        const j = await fetchJSON(`https://${LN_DOMAIN}/.well-known/lnurlp/${LN_USER}`, 5000);
        return j?.tag === 'payRequest' && !!j?.callback;
      } catch { return false; }
    })(),
    checkMediaHost(meta.picture || ''),
    checkMediaHost(meta.banner  || ''),
    gravatarPromise,
  ]);

  const { social: socialAccounts, messaging: messagingAccounts, payment: paymentAccounts } = gravatarData;

  // 5. Tick levels
  let handleTickLevel = 'green', handleTickTitle = 'Verified via relay';
  if (wellKnownNostrOk && nip05Domain === DOMAIN) {
    handleTickLevel = 'gold';
    handleTickTitle = '/.well-known/nostr.json ✓' + (dnsNostrOk ? ' · DNS TXT ✓' : '');
  } else if (wellKnownNostrOk) {
    handleTickLevel = 'gold';
    handleTickTitle = 'Verified: pubkey in /.well-known/nostr.json ✓';
  }

  let lnTickLevel = null, lnTickTitle = '';
  if (lnWellKnownOk) {
    lnTickLevel = 'gold';
    lnTickTitle = '/.well-known/lnurlp ✓' + (dnsLnOk ? ' · DNS TXT _lnurlp ✓' : '');
  }

  const avatarTickTitle = avatarMediaLevel === 'gold' ? `Avatar hosted on ${DOMAIN} ✓`
    : avatarMediaLevel === 'green' ? 'Avatar on trusted media server ✓' : '';
  const bannerTickTitle = bannerMediaLevel === 'gold' ? `Banner hosted on ${DOMAIN} ✓`
    : bannerMediaLevel === 'green' ? 'Banner on trusted media server ✓' : '';

  // 6. rel=me injection
  if (npub) {
    const l = document.createElement('link'); l.rel = 'me';
    l.href = `https://njump.me/${npub}`; document.head.appendChild(l);
  }
  for (const { url } of [...socialAccounts, ...messagingAccounts]) {
    if (url && !url.startsWith('bitcoin:') && !url.startsWith('ethereum:')) {
      const l = document.createElement('link'); l.rel = 'me'; l.href = url;
      document.head.appendChild(l);
    }
  }

  // 7. Banner
  const bannerEl = document.getElementById('banner');
  if (meta.banner) {
    const img = new Image();
    img.onload = () => { bannerEl.style.backgroundImage = `url(${meta.banner})`; };
    img.src = meta.banner;
  }
  if (bannerMediaLevel) {
    const bt = document.createElement('div'); bt.className = 'banner-tick';
    bt.innerHTML = tickHtml(bannerMediaLevel, bannerTickTitle, true);
    bannerEl.appendChild(bt);
  }

  // 8. Avatar
  const name = meta.display_name || meta.name || DOMAIN;
  const avatarWrap = document.getElementById('avatarWrap');
  if (meta.picture) {
    const img = document.createElement('img');
    img.className = 'avatar-img'; img.alt = name;
    img.onerror = () => {
      const fb = document.createElement('div');
      fb.className = 'avatar-fb'; fb.textContent = (name || '?')[0].toUpperCase();
      img.replaceWith(fb);
    };
    img.src = meta.picture;
    avatarWrap.replaceChildren(img);
  } else {
    const fb = document.createElement('div');
    fb.className = 'avatar-fb'; fb.textContent = (name || '?')[0].toUpperCase();
    avatarWrap.replaceChildren(fb);
  }
  if (avatarMediaLevel) {
    const at = document.createElement('div'); at.className = 'avatar-tick';
    at.innerHTML = tickHtml(avatarMediaLevel, avatarTickTitle, true);
    avatarWrap.appendChild(at);
  }

  // 9. Icon placeholder helper (deferred class injection to bypass adblockers)
  let _iconIdx = 0;
  const iconPH = (icon) => {
    const id = `_ic${_iconIdx++}`;
    return `<i id="${id}" data-fa="${esc(icon.fa||'')}" data-si="${esc(icon.si||'')}"></i>`;
  };

  // 10. Social row builder
  const buildSocialRow = accounts => accounts.map(({ url, label, serviceType }) => {
    const icon = resolveIcon(serviceType, url);
    const tip = label || serviceType || (() => { try { return new URL(url).hostname; } catch { return url; } })();
    return `<a class="social-btn" href="${esc(url)}" target="_blank" rel="noopener me"
               title="${esc(tip)}">${iconPH(icon)}</a>`;
  }).join('');

  // 11. Dropdown builder
  const buildDropdown = (btnLabel, btnIcon, items) => {
    if (!items.length) return '';
    const itemsHtml = items.map(({ url, label, icon }) =>
      `<a class="dropdown-item" href="${esc(url)}" target="_blank" rel="noopener">
         <span class="di-icon">${iconPH(icon)}</span>
         <span class="di-label">${esc(label)}</span>
       </a>`
    ).join('');
    return `<div class="dropdown">
      <button class="dropdown-btn" type="button">
        ${iconPH(btnIcon)} ${esc(btnLabel)} <span class="chevron">▾</span>
      </button>
      <div class="dropdown-menu">${itemsHtml}</div>
    </div>`;
  };

  // Hardcoded Telegram first, then any additional messaging from Gravatar
  const TELEGRAM_HARDCODED = {
    url: 'https://t.me/zsoltsb',
    label: 'Telegram',
    serviceType: 'telegram',
  };
  const allMessaging = [
    TELEGRAM_HARDCODED,
    ...messagingAccounts.filter(a => a.serviceType !== 'telegram'),
  ];

  const msgItems = allMessaging.map(a => ({
    url:   a.url,
    label: a.label || paymentLabel(a.serviceType, a.rawType),
    icon:  resolveIcon(a.serviceType, a.url),
  }));

  const tipItems = paymentAccounts.map(a => ({
    url:   a.url,
    label: paymentLabel(a.serviceType, a.label || a.rawType),
    icon:  resolveIcon(a.serviceType, a.url),
  }));

  // 12. Render
  const nostrUri  = npub ? `nostr:${npub}` : `https://njump.me/${nip05}`;
  const lightning = `${LN_USER}@${LN_DOMAIN}`;

  const msgDropdown = buildDropdown(
    'Drop me a line',
    { fa: 'fa-regular fa-comment', si: null },
    msgItems
  );

  const tipDropdown = buildDropdown(
    'Drop me a dime',
    { fa: 'fa-solid fa-hand-holding-dollar', si: null },
    tipItems
  );

  const socialSection = socialAccounts.length
    ? `<div class="section-title">Follow me on</div>
       <div class="social-row">${buildSocialRow(socialAccounts)}</div>`
    : '';

  document.getElementById('body').innerHTML = `
    <div class="display-name">${esc(name)}</div>

    <div class="pill-row">
      <a class="pill" href="${esc(nostrUri)}" title="Open in your Nostr client">
        @${esc(displayHandle)} ${tickHtml(handleTickLevel, handleTickTitle)}
      </a>
      ${msgDropdown}
    </div>

    <div class="pill-row">
      <a class="pill" href="lightning:${esc(lightning)}" title="Pay via Lightning Network">
        ⚡ ${esc(lightning)} ${tickHtml(lnTickLevel, lnTickTitle)}
      </a>
      ${tipDropdown}
    </div>

    ${socialSection}

    <a class="footer-link" href="${DITTO_URL}/${esc(DOMAIN)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

  // 13. Apply icon classes after DOM insertion (adblocker bypass)
  document.querySelectorAll('i[data-fa], i[data-si]').forEach(el => {
    const fa = el.dataset.fa;
    const si = el.dataset.si;
    if (fa) {
      el.classList.add(...fa.split(' '));
    } else if (si) {
      el.classList.add('si', `si--${si}`);
    } else {
      el.classList.add('fa-solid', 'fa-link');
    }
    el.removeAttribute('data-fa');
    el.removeAttribute('data-si');
  });

  // 14. Dropdown toggle
  document.querySelectorAll('.dropdown-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const dd = btn.closest('.dropdown');
      const wasOpen = dd.classList.contains('open');
      document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
      if (!wasOpen) dd.classList.add('open');
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
  });

})().catch(err => {
  const b = document.getElementById('body');
  if (b) b.innerHTML =
    `<div class="error">⚠️ Unexpected error.<code>${String(err?.message ?? err)}</code></div>`;
});
</script>
</body>
</html>
