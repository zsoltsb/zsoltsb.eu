<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zsoltsb.eu</title>
  <link href="https://zsoltsb.eu" rel="me atproto authn">
  <link rel="me" href="nostr:nprofile1qy2hwumn8ghj7un9d3shjtnyd968gmewwp6kyqg4waehxw309aex2mrp0yhx6mmnw3ezuur4vgq3vamnwvaz7tmjv4kxz7fwwpexjmtpdshxuet5qyxhwumn8ghj7mn0wvhxcmmvqqswsw9tl07xfny3s2mesl4dnydcszjlg65az3ap844pjrjedqytl6qeme5w7" />
  <link rel="me" href="nostr:npub1aqu2h7luvnxfrq4hnpl2mxgm3q99734f69r6z0t2ry89j6qghl5qdy0rgm" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f0f;
      --surface:   #1a1a1a;
      --border:    #2a2a2a;
      --accent:    #8b5cf6;
      --accent-2:  #a78bfa;
      --text:      #e8e8e8;
      --muted:     #888;
      --radius:    12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px 80px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ── Banner ── */
    .banner {
      height: 140px;
      background: linear-gradient(135deg, #1e1040 0%, #2d1b69 50%, #1a0f3d 100%);
      position: relative;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: absolute;
      bottom: -44px;
      left: 24px;
    }
    .avatar-wrap img,
    .avatar-wrap .avatar-fallback {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 3px solid var(--surface);
      object-fit: cover;
      display: block;
      background: var(--accent);
    }
    .avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
    }

    /* ── Body ── */
    .body {
      padding: 56px 24px 24px;
    }

    .name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .handle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .handle {
      font-size: 0.875rem;
      color: var(--muted);
    }
    .handle a {
      color: var(--muted);
      text-decoration: none;
    }
    .handle a:hover { color: var(--accent-2); }

    .favicon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      vertical-align: middle;
    }

    /* ── Lightning ── */
    .lightning {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.8rem;
      color: var(--accent-2);
      text-decoration: none;
      transition: background 0.2s;
    }
    .lightning:hover { background: rgba(139,92,246,0.22); }
    .lightning svg { flex-shrink: 0; }

    /* ── Bio ── */
    .bio {
      margin-top: 14px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bio a {
      color: var(--accent-2);
      text-decoration: none;
    }
    .bio a:hover { text-decoration: underline; }

    /* ── Extra addresses ── */
    .section-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-top: 22px;
      margin-bottom: 8px;
    }

    .addresses {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .address-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.2s;
    }
    .address-chip:hover { border-color: var(--accent); }
    .address-chip .chip-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .address-chip .chip-label {
      color: var(--muted);
      font-size: 0.72rem;
      margin-left: auto;
      white-space: nowrap;
    }

    /* ── Stats ── */
    .stats {
      display: flex;
      gap: 20px;
      margin-top: 16px;
    }
    .stat { font-size: 0.85rem; color: var(--muted); }
    .stat strong { color: var(--text); font-weight: 600; }

    /* ── Ditto link ── */
    .ditto-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
    }
    .ditto-link span { color: var(--accent-2); }
    .ditto-link:hover span { text-decoration: underline; }

    /* ── Skeleton loader ── */
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, #333 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .sk-line { height: 14px; margin-bottom: 8px; }

    /* ── Error ── */
    .error-msg {
      padding: 24px;
      color: #f87171;
      font-size: 0.875rem;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="card" id="card">
  <div class="banner" id="banner">
    <div class="avatar-wrap">
      <div class="avatar-fallback skeleton" id="avatar-placeholder" style="width:88px;height:88px;border-radius:50%;"></div>
    </div>
  </div>
  <div class="body" id="body">
    <div class="sk-line skeleton" style="width:40%;height:18px;"></div>
    <div class="sk-line skeleton" style="width:30%;margin-top:6px;"></div>
    <div class="sk-line skeleton" style="width:60%;margin-top:14px;"></div>
    <div class="sk-line skeleton" style="width:90%;margin-top:6px;"></div>
    <div class="sk-line skeleton" style="width:75%;"></div>
  </div>
</div>

<script>
(async () => {
  const DOMAIN   = 'zsoltsb.eu';
  const DITTO    = 'https://ditto.pub';
  const RELAY_API = `${DITTO}/api/v1/accounts/lookup?acct=${DOMAIN}`;

  /* ── helpers ── */
  const $  = id => document.getElementById(id);
  const esc = s  => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function linkifyBio(text) {
    // hashtags
    text = text.replace(/#(\w+)/g, '<a href="https://ditto.pub/t/$1" target="_blank" rel="noopener">#$1</a>');
    // bare URLs (not already in href)
    text = text.replace(/(https?:\/\/[^\s<>"]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    return text;
  }

  function protocolLabel(url) {
    if (!url) return '';
    if (url.startsWith('nostr:'))      return 'Nostr';
    if (url.includes('bsky.app'))      return 'Bluesky';
    if (url.includes('mastodon') || url.includes('fosstodon') || url.includes('social'))
                                       return 'Fediverse';
    if (url.includes('tumblr'))        return 'Tumblr';
    if (url.includes('twitter') || url.includes('x.com')) return 'X / Twitter';
    try { return new URL(url).hostname.replace('www.',''); } catch { return url; }
  }

  /* ── fetch Mastodon-compatible account from Ditto ── */
  let profile;
  try {
    const res = await fetch(RELAY_API);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    profile = await res.json();
  } catch (e) {
    $('body-content') && ($('body-content').innerHTML = `<p class="error-msg">Could not load profile: ${esc(e.message)}</p>`);
    $('body').innerHTML = `<p class="error-msg">Could not load profile: ${esc(e.message)}</p>`;
    return;
  }

  /* ── parse fields ── */
  const name      = profile.display_name || profile.username || DOMAIN;
  const handle    = profile.acct         || DOMAIN;
  const avatarUrl = profile.avatar        || '';
  const headerUrl = profile.header        || '';
  const note      = profile.note          || '';   // HTML bio from Mastodon API
  const fields    = profile.fields        || [];   // extra address fields
  const followers = profile.followers_count ?? '';
  const following = profile.following_count ?? '';

  // lightning address: check lud16 in source (Ditto exposes it via nostr metadata)
  // Also check fields for "Lightning" label
  let lightning = '';
  if (profile.lud16) {
    lightning = profile.lud16;
  } else {
    const lf = fields.find(f => /lightning|wallet|lnurl|⚡/i.test(f.name));
    if (lf) lightning = lf.value.replace(/<[^>]+>/g,'').trim();
  }
  // fallback: known from profile
  if (!lightning) lightning = `wallet@${DOMAIN}`;

  /* ── render banner ── */
  const banner = $('banner');
  if (headerUrl) {
    banner.style.backgroundImage = `url(${headerUrl})`;
    banner.style.backgroundSize  = 'cover';
    banner.style.backgroundPosition = 'center';
  }

  /* ── render avatar ── */
  const avatarWrap = banner.querySelector('.avatar-wrap');
  if (avatarUrl) {
    const img = document.createElement('img');
    img.src = avatarUrl;
    img.alt = name;
    img.onerror = () => {
      img.replaceWith(makeFallback(name));
    };
    avatarWrap.replaceChildren(img);
  } else {
    avatarWrap.replaceChildren(makeFallback(name));
  }

  function makeFallback(n) {
    const d = document.createElement('div');
    d.className = 'avatar-fallback';
    d.textContent = (n || '?')[0].toUpperCase();
    return d;
  }

  /* ── build body HTML ── */
  const faviconUrl = `${DITTO}/api/favicon/${DOMAIN}`;

  // filter out lightning from extra fields to avoid duplication
  const extraFields = fields.filter(f => !/lightning|wallet|lnurl|⚡/i.test(f.name));

  let addressesHtml = '';
  if (extraFields.length) {
    const chips = extraFields.map(f => {
      const raw   = f.value.replace(/<[^>]+>/g,'').trim();
      const href  = f.value.match(/href="([^"]+)"/)?.[1] || (raw.startsWith('http') ? raw : '#');
      const label = protocolLabel(href);
      const fav   = href !== '#' ? `<img class="chip-icon" src="${DITTO}/api/favicon/${(() => { try { return new URL(href).hostname; } catch { return ''; } })()}" alt="" onerror="this.style.display='none'" />` : '';
      return `<a class="address-chip" href="${esc(href)}" target="_blank" rel="noopener me">
                ${fav}
                <span>${esc(f.name)}: ${esc(raw)}</span>
                <span class="chip-label">${esc(label)}</span>
              </a>`;
    }).join('');
    addressesHtml = `<div class="section-title">Also on</div><div class="addresses">${chips}</div>`;
  }

  const statsHtml = (followers !== '' || following !== '')
    ? `<div class="stats">
         ${followers !== '' ? `<div class="stat"><strong>${followers}</strong> followers</div>` : ''}
         ${following !== '' ? `<div class="stat"><strong>${following}</strong> following</div>` : ''}
       </div>` : '';

  const lightningHtml = lightning
    ? `<a class="lightning" href="lightning:${esc(lightning)}" title="Pay via Lightning">
         <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
           <path d="M13 2L4.5 13.5H11L10 22L19.5 10.5H13L13 2Z"/>
         </svg>
         ${esc(lightning)}
       </a>` : '';

  $('body').innerHTML = `
    <div class="name">${esc(name)}</div>
    <div class="handle-row">
      <span class="handle"><a href="${DITTO}/${esc(handle)}" target="_blank" rel="noopener">@${esc(handle)}</a></span>
      <img class="favicon" src="${faviconUrl}" alt="" onerror="this.style.display='none'" />
    </div>
    ${lightningHtml}
    <div class="bio">${linkifyBio(note || esc(profile.source?.note || ''))}</div>
    ${statsHtml}
    ${addressesHtml}
    <a class="ditto-link" href="${DITTO}/${esc(handle)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

})();
</script>
</body>
</html>
