<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zsoltsb.eu</title>
  <link rel="me" href="https://ditto.pub/zsoltsb.eu" />
  <link rel="me" href="https://mastodon.social/@zsoltsb" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f0f;
      --surface:  #1a1a1a;
      --border:   #2a2a2a;
      --accent:   #8b5cf6;
      --accent-2: #a78bfa;
      --text:     #e8e8e8;
      --muted:    #888;
      --radius:   14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 16px 80px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* ── Banner ── */
    .banner {
      height: 160px;
      background: linear-gradient(135deg, #1e1040 0%, #2d1b69 50%, #1a0f3d 100%);
      background-size: cover;
      background-position: center;
      position: relative;
      transition: background-image 0.3s;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: absolute;
      bottom: -48px;
      left: 24px;
    }
    .avatar-img,
    .avatar-fallback {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 4px solid var(--surface);
      object-fit: cover;
      display: block;
    }
    .avatar-fallback {
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 700;
      color: #fff;
    }

    /* ── Body ── */
    .body { padding: 62px 24px 28px; }

    .name {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
    }

    .handle-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .handle { font-size: 0.875rem; color: var(--muted); }
    .handle a { color: var(--muted); text-decoration: none; }
    .handle a:hover { color: var(--accent-2); }

    /* ── Lightning ── */
    .lightning {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.8rem;
      color: var(--accent-2);
      text-decoration: none;
      transition: background 0.2s;
    }
    .lightning:hover { background: rgba(139,92,246,0.25); }

    /* ── Bio ── */
    .bio {
      margin-top: 14px;
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bio a { color: var(--accent-2); text-decoration: none; }
    .bio a:hover { text-decoration: underline; }

    /* ── Links / fields ── */
    .section-title {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      margin-top: 22px;
      margin-bottom: 8px;
    }
    .links { display: flex; flex-direction: column; gap: 6px; }

    .link-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.83rem;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.2s;
    }
    .link-chip:hover { border-color: var(--accent); }
    .chip-icon {
      width: 18px; height: 18px;
      border-radius: 3px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .chip-label { color: var(--muted); font-size: 0.75rem; min-width: 72px; flex-shrink: 0; }
    .chip-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Ditto footer ── */
    .footer-link {
      display: block;
      text-align: center;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
    }
    .footer-link span { color: var(--accent-2); }
    .footer-link:hover span { text-decoration: underline; }

    /* ── Skeleton ── */
    .sk {
      background: linear-gradient(90deg, var(--border) 25%, #2e2e2e 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .error {
      padding: 28px;
      color: #f87171;
      font-size: 0.875rem;
      text-align: center;
      line-height: 1.7;
    }
    .error code {
      display: block;
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--muted);
      word-break: break-all;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="banner" id="banner">
    <div class="avatar-wrap" id="avatarWrap">
      <!-- skeleton avatar -->
      <div class="avatar-fallback sk" style="background:var(--border);"></div>
    </div>
  </div>
  <div class="body" id="body">
    <div class="sk" style="width:44%;height:20px;"></div>
    <div class="sk" style="width:34%;height:13px;margin-top:6px;"></div>
    <div class="sk" style="width:58%;height:13px;margin-top:14px;border-radius:20px;"></div>
    <div class="sk" style="width:96%;height:13px;margin-top:14px;"></div>
    <div class="sk" style="width:82%;height:13px;"></div>
    <div class="sk" style="width:68%;height:13px;"></div>
  </div>
</div>

<script>
(async () => {
  // ─────────────────────────────────────────────────────────────────────────
  // CONFIG — pubkey resolved from zsoltsb.eu NIP-05 (hardcoded; never changes)
  // To re-verify: fetch https://zsoltsb.eu/.well-known/nostr.json?name=_
  // ─────────────────────────────────────────────────────────────────────────
  const PUBKEY  = await resolvePubkey('zsoltsb.eu');
  const DITTO   = 'https://ditto.pub';
  const HANDLE  = 'zsoltsb.eu';

  // Multiple relays — race them, use first response
  const RELAYS = [
    'wss://relay.damus.io',
    'wss://relay.nostr.band',
    'wss://nos.lol',
    'wss://relay.primal.net',
    'wss://nostr.mom',
    'wss://ditto.pub',
  ];

  const esc = s => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function showError(msg, detail) {
    document.getElementById('body').innerHTML =
      `<div class="error">⚠️ Could not load profile.<br>${esc(msg)}${detail ? `<code>${esc(detail)}</code>` : ''}</div>`;
  }

  // ── NIP-05 pubkey resolution (same-origin if hosted on zsoltsb.eu) ────────
  async function resolvePubkey(domain) {
    // Try same-origin first (no CORS when page is on zsoltsb.eu)
    try {
      const r = await fetch(`https://${domain}/.well-known/nostr.json?name=_`,
        { signal: AbortSignal.timeout(4000) });
      if (r.ok) {
        const j = await r.json();
        const pk = j?.names?.['_'] || Object.values(j?.names || {})[0];
        if (pk) return pk;
      }
    } catch (_) {}
    // Fallback: known pubkey (update if you rotate keys)
    // Derived from https://zsoltsb.eu/.well-known/nostr.json
    return null; // will trigger relay search by nip05
  }

  // ── WebSocket query — returns kind:0 content JSON ─────────────────────────
  function queryRelay(url, pubkey, nip05) {
    return new Promise((resolve, reject) => {
      let done = false;
      const ws = new WebSocket(url);

      const timer = setTimeout(() => {
        if (!done) { done = true; ws.close(); reject(new Error(`timeout: ${url}`)); }
      }, 7000);

      ws.onopen = () => {
        const filter = pubkey
          ? { kinds: [0], authors: [pubkey], limit: 1 }
          : { kinds: [0], '#d': [nip05], limit: 1 };
        ws.send(JSON.stringify(['REQ', 'p', filter]));
      };

      ws.onmessage = e => {
        try {
          const msg = JSON.parse(e.data);
          if (msg[0] === 'EVENT' && msg[1] === 'p' && msg[2]?.kind === 0) {
            if (!done) {
              done = true;
              clearTimeout(timer);
              ws.close();
              try { resolve({ meta: JSON.parse(msg[2].content), pubkey: msg[2].pubkey }); }
              catch { reject(new Error('bad content JSON')); }
            }
          } else if (msg[0] === 'EOSE') {
            if (!done) { done = true; clearTimeout(timer); ws.close(); reject(new Error(`no event: ${url}`)); }
          }
        } catch (_) {}
      };

      ws.onerror = () => { if (!done) { done = true; clearTimeout(timer); reject(new Error(`ws error: ${url}`)); } };
      ws.onclose = () => { if (!done) { done = true; clearTimeout(timer); reject(new Error(`ws closed: ${url}`)); } };
    });
  }

  // ── Race all relays ───────────────────────────────────────────────────────
  let result;
  try {
    result = await Promise.any(
      RELAYS.map(r => queryRelay(r, PUBKEY, `_@${HANDLE}`))
    );
  } catch (aggErr) {
    // AggregateError — all relays failed
    const reasons = aggErr?.errors?.map(e => e.message).join(' | ') ?? String(aggErr);
    showError('All relays failed.', reasons);
    return;
  }

  const { meta, pubkey: resolvedPubkey } = result;

  // ── Parse metadata ────────────────────────────────────────────────────────
  const name      = meta.display_name || meta.name || HANDLE;
  const about     = meta.about        || '';
  const avatarUrl = meta.picture      || '';
  const bannerUrl = meta.banner       || '';
  const lightning = meta.lud16        || meta.lud06 || '';
  const nip05     = meta.nip05        || `_@${HANDLE}`;
  const website   = meta.website      || '';

  // Ditto stores extra links as JSON in a custom field "fields" or "links"
  // Standard Nostr kind:0 doesn't have structured fields — parse from about
  // or check for known custom keys Ditto uses
  const rawFields = meta.fields || meta.links || [];
  // Some clients store as array of [name, value] pairs
  const extraLinks = Array.isArray(rawFields)
    ? rawFields
        .map(f => Array.isArray(f) ? { name: f[0], value: f[1] } : f)
        .filter(f => f?.name && f?.value)
        .filter(f => !/lightning|lnurl|⚡|wallet/i.test(f.name))
    : [];

  // ── Banner ────────────────────────────────────────────────────────────────
  const banner = document.getElementById('banner');
  if (bannerUrl) {
    const img = new Image();
    img.onload = () => {
      banner.style.backgroundImage    = `url(${bannerUrl})`;
      banner.style.backgroundSize     = 'cover';
      banner.style.backgroundPosition = 'center';
    };
    img.src = bannerUrl;
  }

  // ── Avatar ────────────────────────────────────────────────────────────────
  const avatarWrap = document.getElementById('avatarWrap');
  const makeFallback = n => {
    const d = document.createElement('div');
    d.className = 'avatar-fallback';
    d.textContent = (n || '?')[0].toUpperCase();
    return d;
  };

  if (avatarUrl) {
    const img = document.createElement('img');
    img.className = 'avatar-img';
    img.alt = name;
    img.onerror = () => img.replaceWith(makeFallback(name));
    img.src = avatarUrl;
    avatarWrap.replaceChildren(img);
  } else {
    avatarWrap.replaceChildren(makeFallback(name));
  }

  // ── Linkify bio ───────────────────────────────────────────────────────────
  function linkify(text) {
    return esc(text)
      .replace(/(https?:\/\/[^\s<>"]+)/g,
        '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/#(\w+)/g,
        `<a href="${DITTO}/t/$1" target="_blank" rel="noopener">#$1</a>`);
  }

  // ── Handle display ────────────────────────────────────────────────────────
  const displayNip05 = nip05.startsWith('_@') ? nip05.slice(2) : nip05;
  const profileUrl   = `${DITTO}/${HANDLE}`;

  // ── Extra links HTML ──────────────────────────────────────────────────────
  function chipHostname(href) {
    try { return new URL(href).hostname.replace(/^www\./, ''); } catch { return ''; }
  }

  let linksHtml = '';
  if (extraLinks.length) {
    const chips = extraLinks.map(f => {
      const val  = String(f.value).trim();
      const href = val.startsWith('http') ? val : null;
      const host = href ? chipHostname(href) : '';
      const icon = host
        ? `<img class="chip-icon" src="${DITTO}/api/favicon/${esc(host)}" alt="" onerror="this.style.display='none'" />`
        : `<span style="width:18px;flex-shrink:0;"></span>`;
      const relAttr = href ? ' rel="noopener me"' : '';
      const inner = `${icon}<span class="chip-label">${esc(f.name)}</span><span class="chip-value">${esc(val)}</span>`;
      return href
        ? `<a class="link-chip" href="${esc(href)}" target="_blank"${relAttr}>${inner}</a>`
        : `<div class="link-chip">${inner}</div>`;
    }).join('');
    linksHtml = `<div class="section-title">Also on</div><div class="links">${chips}</div>`;
  }

  // ── Website chip ──────────────────────────────────────────────────────────
  let websiteHtml = '';
  if (website) {
    const host = chipHostname(website);
    const icon = host
      ? `<img class="chip-icon" src="${DITTO}/api/favicon/${esc(host)}" alt="" onerror="this.style.display='none'" />`
      : '';
    websiteHtml = `
      <div class="section-title">Website</div>
      <div class="links">
        <a class="link-chip" href="${esc(website)}" target="_blank" rel="noopener me">
          ${icon}
          <span class="chip-value">${esc(website.replace(/^https?:\/\//, ''))}</span>
        </a>
      </div>`;
  }

  // ── Lightning HTML ────────────────────────────────────────────────────────
  const lightningHtml = lightning ? `
    <a class="lightning" href="lightning:${esc(lightning)}" title="Pay via Lightning">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
        <path d="M13 2L4.5 13.5H11L10 22L19.5 10.5H13Z"/>
      </svg>
      ${esc(lightning)}
    </a>` : '';

  // ── Inject ────────────────────────────────────────────────────────────────
  document.getElementById('body').innerHTML = `
    <div class="name">${esc(name)}</div>
    <div class="handle-row">
      <span class="handle">
        <a href="${esc(profileUrl)}" target="_blank" rel="noopener me">@${esc(displayNip05)}</a>
      </span>
    </div>
    ${lightningHtml}
    <div class="bio">${linkify(about)}</div>
    ${websiteHtml}
    ${linksHtml}
    <a class="footer-link" href="${esc(profileUrl)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

  // ── Dynamic rel=me for discovered links ───────────────────────────────────
  extraLinks.forEach(f => {
    const val = String(f.value).trim();
    if (val.startsWith('http')) {
      const l = document.createElement('link');
      l.rel  = 'me';
      l.href = val;
      document.head.appendChild(l);
    }
  });
  if (website) {
    const l = document.createElement('link');
    l.rel  = 'me';
    l.href = website;
    document.head.appendChild(l);
  }

})().catch(err => {
  document.getElementById('body').innerHTML =
    `<div class="error">⚠️ Unexpected error.<code>${err?.message ?? err}</code></div>`;
});
</script>
</body>
</html>
