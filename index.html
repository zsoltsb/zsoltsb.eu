<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zsoltsb.eu</title>
  <link rel="me" href="https://ditto.pub/zsoltsb.eu" />

  <!-- Bunny Fonts (GDPR-safe Google Fonts drop-in) -->
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
  <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Free via cdnjs (Cloudflare) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a;
      --accent:  #8b5cf6; --accent2: #a78bfa; --text: #e8e8e8;
      --muted:   #888;    --gold: #f59e0b;     --green: #34d399;
      --r: 14px;
      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 40px 16px 80px;
    }
    .card {
      width: 100%; max-width: 600px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r); overflow: hidden;
    }

    /* ── Banner ── */
    .banner {
      height: 160px; position: relative;
      background: linear-gradient(135deg,#1e1040 0%,#2d1b69 50%,#1a0f3d 100%);
      background-size: cover; background-position: center;
    }
    .banner-tick { position: absolute; bottom: 8px; right: 10px; }
    .avatar-wrap { position: absolute; bottom: -48px; left: 24px; }
    .avatar-img, .avatar-fb {
      width: 96px; height: 96px; border-radius: 50%;
      border: 4px solid var(--surface); display: block;
    }
    .avatar-img { object-fit: cover; }
    .avatar-fb {
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; font-size: 2.4rem; font-weight: 700; color: #fff;
    }
    .avatar-tick { position: absolute; bottom: 2px; right: 2px; }

    /* ── Body ── */
    .body { padding: 62px 24px 28px; }
    .display-name { font-size: 1.35rem; font-weight: 700; color: var(--text); }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(139,92,246,.10); border: 1px solid rgba(139,92,246,.28);
      border-radius: 20px; padding: 6px 14px; font-size: .8rem;
      color: var(--accent2); text-decoration: none; font-family: inherit;
      line-height: 1; transition: background .18s, border-color .18s;
    }
    .pill:hover { background: rgba(139,92,246,.22); border-color: rgba(139,92,246,.55); }

    /* ── Tick badges ── */
    .tick {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0; cursor: help;
    }
    .tick svg { width: 9px; height: 9px; }
    .tick.gold  { background: var(--gold); }
    .tick.green { background: var(--green); }
    .tick.lg    { width: 20px; height: 20px; box-shadow: 0 0 0 2px var(--surface); }
    .tick.lg svg { width: 11px; height: 11px; }

    /* ── Social ── */
    .section-title {
      font-size: .68rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .09em; color: var(--muted); margin-top: 24px; margin-bottom: 12px;
    }
    .social-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .social-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); text-decoration: none; font-size: 1.15rem;
      transition: background .15s, border-color .15s, color .15s, transform .1s;
    }
    .social-btn:hover {
      background: rgba(139,92,246,.10); border-color: var(--accent);
      color: var(--accent2); transform: translateY(-2px);
    }
    /* Neutral class prefix — adblockers target "fa-twitter" etc., not "ic-*" */
    .ic { display: inline-block; }

    /* ── Footer ── */
    .footer-link {
      display: block; text-align: center; margin-top: 26px; padding-top: 18px;
      border-top: 1px solid var(--border); font-size: .78rem;
      color: var(--muted); text-decoration: none;
    }
    .footer-link span { color: var(--accent2); }
    .footer-link:hover span { text-decoration: underline; }

    /* ── Skeleton ── */
    .sk {
      background: linear-gradient(90deg,var(--border) 25%,#2e2e2e 50%,var(--border) 75%);
      background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px;
    }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }
    .error { padding: 28px; color: #f87171; font-size: .875rem; text-align: center; line-height: 1.7; }
    .error code { display: block; margin-top: 8px; font-size: .72rem; color: var(--muted); word-break: break-all; }
  </style>
</head>
<body>
<div class="card">
  <div class="banner" id="banner">
    <div class="avatar-wrap" id="avatarWrap">
      <div class="avatar-fb sk" style="background:var(--border)"></div>
    </div>
  </div>
  <div class="body" id="body">
    <div class="sk" style="width:44%;height:22px;margin-bottom:8px"></div>
    <div class="sk" style="width:62%;height:32px;border-radius:20px;display:inline-block"></div>
    <div class="sk" style="width:52%;height:32px;border-radius:20px;display:inline-block;margin-left:8px"></div>
  </div>
</div>

<script>
void (async () => {

  // ═══════════════════════════════════════════════════════════════════════════
  // CONFIG
  // ═══════════════════════════════════════════════════════════════════════════
  const DOMAIN        = 'zsoltsb.eu';
  const DITTO_URL     = 'https://ditto.pub';
  const LN_USER       = 'wallet';
  const LN_DOMAIN     = DOMAIN;
  const GRAVATAR_SLUG = 'zsoltsb';

  const AUTHORITY_RELAY = 'wss://relay.ditto.pub';

  const OPENVIBE_RELAYS = [
    'wss://relay.damus.io',
    'wss://relay.nostr.band',
    'wss://nos.lol',
    'wss://relay.primal.net',
    'wss://nostr.wine',
    'wss://relay.snort.social',
    'wss://purplepag.es',
    'wss://relay.nos.social',
  ];

  const EXTRA_RELAYS = [
    'wss://nostr.mom',
    'wss://relay.nostr.bg',
    'wss://nostr.oxtr.dev',
  ];

  const DOH_RESOLVERS = [
    n => `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(n)}&type=TXT`,
    n => `https://dns.google/resolve?name=${encodeURIComponent(n)}&type=TXT`,
  ];

  const MESSAGING_TYPES = new Set([
    'whatsapp','telegram','signal','messenger','wechat','line','viber',
    'skype','discord','slack','matrix','xmpp','imessage','sms','kik',
    'snapchat','kakaotalk','zalo','imo','threema','wire','session',
    'element','rocketchat','mattermost','teams','hangouts','gchat',
  ]);

  // ── Icon map: platform key → FA 6 classes (using neutral wrapper "ic")
  // Adblockers match on element class names like "fa-twitter" in the DOM.
  // We store the FA class string in a data attribute and apply it via JS
  // AFTER the DOM is built, so filter-list selectors never match statically.
  // ─────────────────────────────────────────────────────────────────────────
  const FA_ICONS = {
    'twitter':       'fa-brands fa-x-twitter',
    'x':             'fa-brands fa-x-twitter',
    'x-twitter':     'fa-brands fa-x-twitter',
    'mastodon':      'fa-brands fa-mastodon',
    'bluesky':       'fa-brands fa-bluesky',
    'instagram':     'fa-brands fa-instagram',
    'threads':       'fa-brands fa-threads',
    'facebook':      'fa-brands fa-facebook',
    'linkedin':      'fa-brands fa-linkedin',
    'github':        'fa-brands fa-github',
    'gitlab':        'fa-brands fa-gitlab',
    'youtube':       'fa-brands fa-youtube',
    'twitch':        'fa-brands fa-twitch',
    'tiktok':        'fa-brands fa-tiktok',
    'reddit':        'fa-brands fa-reddit',
    'pinterest':     'fa-brands fa-pinterest',
    'medium':        'fa-brands fa-medium',
    'substack':      'fa-solid fa-newspaper',
    'soundcloud':    'fa-brands fa-soundcloud',
    'spotify':       'fa-brands fa-spotify',
    'patreon':       'fa-brands fa-patreon',
    'ko-fi':         'fa-solid fa-mug-hot',
    'kofi':          'fa-solid fa-mug-hot',
    'vimeo':         'fa-brands fa-vimeo',
    'flickr':        'fa-brands fa-flickr',
    'behance':       'fa-brands fa-behance',
    'dribbble':      'fa-brands fa-dribbble',
    'stackoverflow': 'fa-brands fa-stack-overflow',
    'strava':        'fa-brands fa-strava',
    'steam':         'fa-brands fa-steam',
    'bandcamp':      'fa-brands fa-bandcamp',
    'lastfm':        'fa-brands fa-lastfm',
    'goodreads':     'fa-brands fa-goodreads',
    'farcaster':     'fa-solid fa-f',          // no official FA icon yet
    'nostr':         'fa-solid fa-bolt',        // no official FA icon yet
    '_default':      'fa-solid fa-link',
  };

  const resolveIcon = (serviceType, url) => {
    const key = (serviceType || '').toLowerCase().replace(/[\s_]+/g, '-');
    if (FA_ICONS[key]) return FA_ICONS[key];
    try {
      const host = new URL(url).hostname.replace(/^www\./, '');
      for (const [k, v] of Object.entries(FA_ICONS)) {
        if (k !== '_default' && host.includes(k.replace(/-/g, ''))) return v;
      }
    } catch {}
    return FA_ICONS['_default'];
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // HELPERS
  // ═══════════════════════════════════════════════════════════════════════════
  const esc = s => String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const tickHtml = (level, title, large = false) => !level ? '' :
    `<span class="tick${large?' lg':''} ${esc(level)}" title="${esc(title)}">
       <svg viewBox="0 0 10 10" fill="none" stroke="#0f0f0f" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round">
         <polyline points="1.5,5 4,7.5 8.5,2.5"/>
       </svg>
     </span>`;

  const fetchJSON = async (url, ms = 5000) => {
    const r = await fetch(url, { signal: AbortSignal.timeout(ms) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  };

  const fetchJSONP = (url, cbParam = 'callback', ms = 8000) =>
    new Promise((resolve, reject) => {
      const name = '__gjp_' + Math.random().toString(36).slice(2);
      const timer = setTimeout(() => { cleanup(); reject(new Error('jsonp-timeout')); }, ms);
      const script = document.createElement('script');
      const cleanup = () => { clearTimeout(timer); delete window[name]; script.remove(); };
      window[name] = data => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('jsonp-error')); };
      script.src = `${url}${url.includes('?')?'&':'?'}${cbParam}=${name}`;
      document.head.appendChild(script);
    });

  const dohTxtLookup = async hostname => {
    for (const resolver of DOH_RESOLVERS) {
      try {
        const data = await fetchJSON(resolver(hostname), 4000);
        const answers = (data?.Answer || []).filter(a => a.type === 16);
        if (answers.length)
          return answers.map(a => String(a.data).replace(/^"|"$/g,'').trim());
      } catch {}
    }
    return [];
  };

  const hexToNpub = hex => {
    try {
      const CS='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      const cb=(d,f,t,p)=>{let a=0,b=0,r=[];for(const v of d){a=(a<<f)|v;b+=f;while(b>=t){b-=t;r.push((a>>b)&((1<<t)-1));}}if(p&&b>0)r.push((a<<(t-b))&((1<<t)-1));return r;};
      const pm=v=>{const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const x of v){const b=c>>25;c=((c&0x1ffffff)<<5)^x;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c;};
      const he=h=>{const r=[];for(const c of h)r.push(c.charCodeAt(0)>>5);r.push(0);for(const c of h)r.push(c.charCodeAt(0)&31);return r;};
      const cs=(h,d)=>{const v=he(h).concat(d).concat([0,0,0,0,0,0]);const m=pm(v)^1;const r=[];for(let p=0;p<6;p++)r.push((m>>(5*(5-p)))&31);return r;};
      const bytes=hex.match(/.{1,2}/g).map(b=>parseInt(b,16));
      const data=cb(bytes,8,5,true);
      const hrp='npub';
      return hrp+'1'+data.concat(cs(hrp,data)).map(d=>CS[d]).join('');
    } catch { return null; }
  };

  const checkMediaHost = (() => {
    let p = null;
    const get = () => {
      if (!p) p = fetchJSON(`https://${DOMAIN}/.well-known/media-servers.json`, 4000)
        .then(j => {
          const raw = Array.isArray(j) ? j : (j?.servers || j?.media_servers || []);
          return raw.map(s => { try { return new URL(s).hostname.toLowerCase(); } catch { return null; } }).filter(Boolean);
        }).catch(() => []);
      return p;
    };
    return async url => {
      if (!url) return null;
      let h; try { h = new URL(url).hostname.toLowerCase(); } catch { return null; }
      if (h === DOMAIN || h.endsWith(`.${DOMAIN}`)) return 'gold';
      const t = await get();
      if (t.some(x => h === x || h.endsWith(`.${x}`))) return 'green';
      return null;
    };
  })();

  // ═══════════════════════════════════════════════════════════════════════════
  // RELAY SYSTEM
  // ═══════════════════════════════════════════════════════════════════════════
  const fetchFromRelay = (wsUrl, pubkey, timeoutMs = 8000) =>
    new Promise((resolve, reject) => {
      let done = false;
      let ws;
      try { ws = new WebSocket(wsUrl); } catch(e) { return reject(e); }
      const fail = r => { if (!done) { done = true; try { ws.close(); } catch {} reject(new Error(r)); } };
      const timer = setTimeout(() => fail(`timeout:${wsUrl}`), timeoutMs);
      ws.onopen = () => ws.send(JSON.stringify(['REQ','s',{kinds:[0],authors:[pubkey],limit:1}]));
      ws.onmessage = e => {
        try {
          const m = JSON.parse(e.data);
          if (m[0]==='EVENT' && m[1]==='s' && m[2]?.kind===0 && !done) {
            done = true; clearTimeout(timer);
            try { ws.close(); } catch {}
            resolve({ meta: JSON.parse(m[2].content), relay: wsUrl });
          } else if (m[0]==='EOSE' && !done) { fail(`eose-empty:${wsUrl}`); }
        } catch {}
      };
      ws.onerror = () => fail(`ws-err:${wsUrl}`);
      ws.onclose = () => { if (!done) fail(`ws-close:${wsUrl}`); };
    });

  const metaConsistent = (authority, candidate) => {
    const fields = ['name','display_name','picture','banner','nip05','lud16','lud06'];
    return fields.every(f => (authority[f] ?? '') === (candidate[f] ?? ''));
  };

  const fetchNostrMeta = async (pubkey, relayHints) => {
    const others = [...new Set([
      ...relayHints.filter(r => r !== AUTHORITY_RELAY),
      ...OPENVIBE_RELAYS,
      ...EXTRA_RELAYS,
    ])].filter(r => r !== AUTHORITY_RELAY);

    let authorityResult = null;
    const authorityPromise = fetchFromRelay(AUTHORITY_RELAY, pubkey, 9000)
      .then(r => { authorityResult = r; return r; })
      .catch(e => { console.warn('[relay] authority failed:', e.message); return null; });

    await new Promise(r => setTimeout(r, 200));
    const otherPromises = others.map(url =>
      fetchFromRelay(url, pubkey, 8000).catch(() => null)
    );

    await authorityPromise;

    if (authorityResult) {
      Promise.allSettled(otherPromises).then(results => {
        let ok = 0, bad = 0;
        for (const r of results) {
          if (r.status === 'fulfilled' && r.value) {
            if (metaConsistent(authorityResult.meta, r.value.meta)) ok++;
            else { bad++; console.warn(`[relay] inconsistent: ${r.value.relay}`); }
          }
        }
        console.log(`[relay] cross-check: ${ok} consistent, ${bad} inconsistent`);
      });
      return authorityResult;
    }

    const fallback = await Promise.any(
      otherPromises.map(p => p.then(r => r ? r : Promise.reject()))
    ).catch(() => null);
    if (fallback) return fallback;
    throw new Error('All relays failed');
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // GRAVATAR
  // ═══════════════════════════════════════════════════════════════════════════
  const normaliseAccounts = (accts = []) => accts
    .filter(a => {
      if (!a?.url && !a?.profile_url) return false;
      const t = (a.service_type || a.shortname || '').toLowerCase().replace(/[\s_]+/g, '-');
      return !MESSAGING_TYPES.has(t);
    })
    .map(a => ({
      url:         (a.url || a.profile_url || '').trim(),
      label:       a.service_label || a.display || a.shortname || '',
      serviceType: (a.service_type || a.shortname || '').toLowerCase().replace(/[\s_]+/g, '-'),
      order:       a.order ?? 999,
    }))
    .filter(a => a.url)
    .sort((a, b) => a.order - b.order);

  const fetchGravatarAccounts = async () => {
    const legacyUrl = `https://gravatar.com/${GRAVATAR_SLUG}.json`;
    try {
      const d = await fetchJSONP(legacyUrl);
      const a = normaliseAccounts(d?.entry?.[0]?.accounts);
      if (a.length) { console.log('[gravatar] jsonp ✓'); return a; }
    } catch(e) { console.warn('[gravatar] jsonp:', e.message); }
    try {
      const d = await fetchJSON(legacyUrl, 6000);
      const a = normaliseAccounts(d?.entry?.[0]?.accounts);
      if (a.length) { console.log('[gravatar] direct ✓'); return a; }
    } catch(e) { console.warn('[gravatar] direct:', e.message); }
    return [];
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // MAIN
  // ═══════════════════════════════════════════════════════════════════════════

  // 1. Resolve pubkey
  let pubkey = '', wellKnownNostrOk = false, relayHints = [];
  try {
    const j = await fetchJSON(`https://${DOMAIN}/.well-known/nostr.json?name=_`, 4000);
    const pk = j?.names?.['_'] || Object.values(j?.names || {})[0] || '';
    if (pk) { pubkey = pk; wellKnownNostrOk = true; relayHints = j?.relays?.[pk] || []; }
  } catch {}
  if (!pubkey) {
    document.getElementById('body').innerHTML =
      '<div class="error">⚠️ Could not resolve pubkey from NIP-05.</div>';
    return;
  }

  // 2. Parallel: Nostr meta + Gravatar
  const metaPromise     = fetchNostrMeta(pubkey, relayHints);
  const gravatarPromise = fetchGravatarAccounts();

  // 3. Await Nostr meta
  let result;
  try { result = await metaPromise; }
  catch(e) {
    document.getElementById('body').innerHTML =
      `<div class="error">⚠️ All relays failed.<code>${esc(e.message)}</code></div>`;
    return;
  }

  const { meta } = result;
  const npub          = hexToNpub(pubkey);
  const nip05         = meta.nip05 || `_@${DOMAIN}`;
  const nip05Domain   = nip05.includes('@') ? nip05.split('@')[1] : '';
  const displayHandle = nip05.startsWith('_@') ? nip05.slice(2) : nip05;

  // 4. Verification + Gravatar in parallel
  const [
    dnsNostrOk, dnsLnOk, lnWellKnownOk,
    avatarMediaLevel, bannerMediaLevel,
    gravatarAccounts,
  ] = await Promise.all([
    (async () => {
      for (const name of [`_nostr.${DOMAIN}`, `_nip05.${DOMAIN}`, DOMAIN]) {
        try {
          const txts = await dohTxtLookup(name);
          if (txts.some(t => t.includes(pubkey) || (npub && t.includes(npub)))) return true;
        } catch {}
      }
      return false;
    })(),
    (async () => {
      try {
        const txts = await dohTxtLookup(`_lnurlp.${LN_DOMAIN}`);
        return txts.some(t =>
          t.includes(LN_USER) || t.toLowerCase().includes('lnurlp') || t.toLowerCase().includes('lightning')
        );
      } catch { return false; }
    })(),
    (async () => {
      try {
        const j = await fetchJSON(`https://${LN_DOMAIN}/.well-known/lnurlp/${LN_USER}`, 5000);
        return j?.tag === 'payRequest' && !!j?.callback;
      } catch { return false; }
    })(),
    checkMediaHost(meta.picture || ''),
    checkMediaHost(meta.banner  || ''),
    gravatarPromise,
  ]);

  // 5. Tick levels
  let handleTickLevel = 'green', handleTickTitle = 'Verified via relay';
  if (wellKnownNostrOk && nip05Domain === DOMAIN) {
    handleTickLevel = 'gold';
    handleTickTitle = '/.well-known/nostr.json ✓' + (dnsNostrOk ? ' · DNS TXT ✓' : '');
  } else if (wellKnownNostrOk) {
    handleTickLevel = 'gold';
    handleTickTitle = 'Verified: pubkey in /.well-known/nostr.json ✓';
  }

  let lnTickLevel = null, lnTickTitle = '';
  if (lnWellKnownOk) {
    lnTickLevel = 'gold';
    lnTickTitle = '/.well-known/lnurlp ✓' + (dnsLnOk ? ' · DNS TXT _lnurlp ✓' : '');
  }

  const avatarTickTitle = avatarMediaLevel === 'gold' ? `Avatar hosted on ${DOMAIN} ✓`
    : avatarMediaLevel === 'green' ? 'Avatar on trusted media server ✓' : '';
  const bannerTickTitle = bannerMediaLevel === 'gold' ? `Banner hosted on ${DOMAIN} ✓`
    : bannerMediaLevel === 'green' ? 'Banner on trusted media server ✓' : '';

  // 6. rel=me injection
  if (npub) {
    const l = document.createElement('link'); l.rel = 'me';
    l.href = `https://njump.me/${npub}`; document.head.appendChild(l);
  }
  for (const { url } of gravatarAccounts) {
    const l = document.createElement('link'); l.rel = 'me'; l.href = url;
    document.head.appendChild(l);
  }

  // 7. Banner
  const bannerEl = document.getElementById('banner');
  if (meta.banner) {
    const img = new Image();
    img.onload = () => { bannerEl.style.backgroundImage = `url(${meta.banner})`; };
    img.src = meta.banner;
  }
  if (bannerMediaLevel) {
    const bt = document.createElement('div');
    bt.className = 'banner-tick';
    bt.innerHTML = tickHtml(bannerMediaLevel, bannerTickTitle, true);
    bannerEl.appendChild(bt);
  }

  // 8. Avatar
  const name = meta.display_name || meta.name || DOMAIN;
  const avatarWrap = document.getElementById('avatarWrap');
  if (meta.picture) {
    const img = document.createElement('img');
    img.className = 'avatar-img'; img.alt = name;
    img.onerror = () => {
      const fb = document.createElement('div');
      fb.className = 'avatar-fb'; fb.textContent = (name || '?')[0].toUpperCase();
      img.replaceWith(fb);
    };
    img.src = meta.picture;
    avatarWrap.replaceChildren(img);
  } else {
    const fb = document.createElement('div');
    fb.className = 'avatar-fb'; fb.textContent = (name || '?')[0].toUpperCase();
    avatarWrap.replaceChildren(fb);
  }
  if (avatarMediaLevel) {
    const at = document.createElement('div');
    at.className = 'avatar-tick';
    at.innerHTML = tickHtml(avatarMediaLevel, avatarTickTitle, true);
    avatarWrap.appendChild(at);
  }

  // 9. Social icons — FA classes injected via JS after DOM build
  //    The data-ic attribute holds the FA class string; a MutationObserver-free
  //    approach: we set element.className directly in JS, never in HTML,
  //    so static filter-list CSS selectors never match.
  const buildSocialRow = accounts => {
    if (!accounts.length) return '';
    const items = accounts.map(({ url, label, serviceType }) => {
      const faClass = resolveIcon(serviceType, url);
      const tip = label || serviceType || (() => { try { return new URL(url).hostname; } catch { return url; } })();
      // Use data-fa to carry the class; applied post-render below
      return `<a class="social-btn" href="${esc(url)}" target="_blank" rel="noopener me"
                 title="${esc(tip)}" data-fa="${esc(faClass)}"><i class="ic"></i></a>`;
    }).join('');
    return `<div class="section-title">Follow me on</div><div class="social-row">${items}</div>`;
  };

  // 10. Render body
  const nostrUri  = npub ? `nostr:${npub}` : `https://njump.me/${nip05}`;
  const lightning = `${LN_USER}@${LN_DOMAIN}`;

  document.getElementById('body').innerHTML = `
    <div class="display-name">${esc(name)}</div>
    <div class="pills">
      <a class="pill" href="${esc(nostrUri)}" title="Open in your Nostr client">
        @${esc(displayHandle)} ${tickHtml(handleTickLevel, handleTickTitle)}
      </a>
      <a class="pill" href="lightning:${esc(lightning)}" title="Pay via Lightning Network">
        ⚡ ${esc(lightning)} ${tickHtml(lnTickLevel, lnTickTitle)}
      </a>
    </div>
    ${buildSocialRow(gravatarAccounts)}
    <a class="footer-link" href="${DITTO_URL}/${esc(DOMAIN)}" target="_blank" rel="noopener">
      View full profile on <span>ditto.pub</span>
    </a>
  `;

  // 11. Apply FA classes AFTER DOM insertion — adblocker filter lists
  //     match static HTML class attributes, not dynamically assigned ones.
  document.querySelectorAll('[data-fa]').forEach(btn => {
    const icon = btn.querySelector('i.ic');
    if (icon) {
      // Assign via className property — never written into HTML source
      icon.className = btn.dataset.fa;
      btn.removeAttribute('data-fa');
    }
  });

})().catch(err => {
  const b = document.getElementById('body');
  if (b) b.innerHTML =
    `<div class="error">⚠️ Unexpected error.<code>${String(err?.message ?? err)}</code></div>`;
});
</script>
</body>
</html>
